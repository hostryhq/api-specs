  actor: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
  data:
    credit_note_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f7011
    bill_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f7001
    outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
    business_date: '2026-11-24'
    invoice_date: '2026-11-24'
    total_paise: 50400
