$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:hostry:events:tenancy.series.closed:v1
title: tenancy.series.closed v1
description: "A document series was closed, by closing its registration, by moving the outlet to another registration (changeOutletTaxRegistration) or by the owner (closeDocumentSeriesUnreconciled). Ids and codes only. The series reads closed and awaiting device until the device states its last number (control intent series.close) and billing publishes billing.series.reconciled (ADR-0014 A2.5 item 2)."
x-publisher: tenancy
x-subscribers:
- billing
- identity
- sync
allOf:
- $ref: urn:hostry:events:envelope:v1
- type: object
  properties:
    type:
      const: tenancy.series.closed
    v:
      const: 1
    source:
      const: tenancy
    data:
      type: object
      required:
      - series_id
      - code
      - doc_type
      - tax_registration_id
      - outlet_id
      - device_id
      - cause
      properties:
        series_id:
          type: string
          description: The document series.
        code:
          type: string
          description: Series code, 3 characters from the registry alphabet.
          pattern: ^[A-HJ-NP-Z2-9]{3}$
        doc_type:
          type: string
          description: Document type of the series.
          enum:
          - tax_invoice
          - credit_note
          - bill_of_supply
          - plain_bill
        tax_registration_id:
          type: string
          description: The registration the series belongs to.
        outlet_id:
          type: string
          description: The outlet.
        device_id:
          type: string
          description: The device that holds the series.
        cause:
          type: string
          description: Why it was closed.
          enum:
          - registration_closed
          - outlet_moved
          - closed_unreconciled
examples:
