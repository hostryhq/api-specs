$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:hostry:events:tenancy.organisation.created:v1
title: tenancy.organisation.created v1
description: An organisation was created (status trial). Identity stops issuing for suspended or closed
  scopes using the organisation and outlet events.
x-publisher: tenancy
x-subscribers:
- identity
- billing
allOf:
- $ref: urn:hostry:events:envelope:v1
- type: object
  properties:
    type:
      const: tenancy.organisation.created
    v:
      const: 1
    source:
      const: tenancy
    data:
      type: object
      required:
      - organisation_id
      - status
      properties:
        organisation_id:
          type: string
          description: The organisation (equals tenant_id).
        status:
          type: string
          description: Organisation state.
          enum:
          - trial
          - active
          - suspended
          - closed
