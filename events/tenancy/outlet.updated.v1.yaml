$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:hostry:events:tenancy.outlet.updated:v1
title: tenancy.outlet.updated v1
description: An outlet or property changed. Identity stops issuing for inactive outlets.
x-publisher: tenancy
x-subscribers:
- identity
- billing
- catalog
allOf:
- $ref: urn:hostry:events:envelope:v1
- type: object
  properties:
    type:
      const: tenancy.outlet.updated
    v:
      const: 1
    source:
      const: tenancy
    data:
      type: object
      required:
      - outlet_id
      - brand_id
      - kind
      - status
      - tax_registration_id
      properties:
        outlet_id:
          type: string
          description: The outlet or property.
        brand_id:
          type: string
          description: Its brand.
        kind:
          type: string
          description: Outlet kind.
          enum:
          - restaurant
          - bakery_outlet
          - production_unit
          - stall
          - property
          - service_point
        status:
          type: string
          description: Outlet state.
          enum:
          - active
          - inactive
        tax_registration_id:
          type: string
          description: The registration the outlet bills under.
        effective_from:
          type: string
          format: date
          description: IST business date from which `tax_registration_id` (and `tax_regime`) apply. The outlet switches at its next trading-day open
            (ADR-0014 A2.5), so a registration change takes effect on the date of that open, never mid-day; billing starts its registration era on it.
            Absent on an update that does not change the registration (a consumer then keeps the current era).
        tax_regime:
          type: string
          description: Regime of that registration (billing defaults to regular when a consumer predates this field). Absent when the registration is not yet known.
          enum:
          - regular
          - composition
          - unregistered
        series_ids:
          type: array
          description: Ids of the outlet's open document series, so a consumer can tell which codes to expect. Ids only; codes arrive in tenancy.series.issued.
          items:
            type: string
            description: A document series id.
examples:
- id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f9124
  type: tenancy.outlet.updated
  v: 1
  source: tenancy
  tenant_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
  key: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
  key_seq: 2
  occurred_at: '2026-11-24T13:05:11.120Z'
  actor: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
  data:
    outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
    brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
    kind: restaurant
    status: active
    tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
    effective_from: '2026-11-25'
    tax_regime: regular
    series_ids: [0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6c, 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a95]
