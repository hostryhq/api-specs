$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:hostry:events:tenancy.vendor_access.recorded:v1
title: tenancy.vendor_access.recorded v1
description: 'A vendor or support request served by tenancy was recorded in its vendor_access_log in the
  action''s own transaction (ADR-0013 V5). Identity folds it into the vendor audit log and the tenant''s
  own audit log. Ids, action key and a ticket reference of fixed pattern only: no free text, no personal
  data, no GSTIN.'
x-publisher: tenancy
x-subscribers:
- identity
allOf:
- $ref: urn:hostry:events:envelope:v1
- type: object
  properties:
    type:
      const: tenancy.vendor_access.recorded
    v:
      const: 1
    source:
      const: tenancy
    data:
      type: object
      required:
      - entry_id
      - vendor_user_id
      - token_type
      - action_key
      - outcome
      - request_id
      properties:
        entry_id:
          type: string
          description: Row id in the serving service's vendor_access_log.
        vendor_user_id:
          type: string
          description: The vendor user.
        token_type:
          type: string
          description: Credential used.
          enum:
          - vendor
          - support
        support_session_id:
          type: string
          description: Set when token_type is support.
        action_key:
          type: string
          description: Stable action key, for example vendor.organisation.created.
          pattern: ^[a-z]+(\.[a-z_]+)+$
        target_id:
          type: string
          description: Target record id, when any.
        approval_id:
          type: string
          description: The vendor approval executed, for the kinds org_suspend, org_reinstate and org_close (ADR-0005 A3.4). Absent on any other entry.
        grant_jti:
          type: string
          description: The jti of the grant that executed the approval (ADR-0005 A3.4). Present with approval_id. Identity sets the approval executed on the first entry with outcome `succeeded`, idempotently; `refused` and `failed` change nothing.
        ticket_reference:
          type: string
          description: Support ticket reference (fixed pattern).
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$
        outcome:
          type: string
          description: Result.
          enum:
          - succeeded
          - refused
          - failed
        result_count:
          type: integer
          description: Number of records a read returned.
          minimum: 0
        request_id:
          type: string
          description: Request id for correlation.
