# Shared components for every Hostry OpenAPI document. Referenced as
# ../../../common/components.yaml#/components/... and inlined by `make bundle`.
openapi: 3.1.0
info:
  title: Hostry common components
  version: 1.0.0
  description: Shared schemas, parameters, headers and responses. Not a service API.
paths: {}
components:
  schemas:
    Id:
      type: string
      description: Client-generated, time-sortable UUIDv7 in lower-case canonical form (ADR-0003 policy; ULID is not accepted).
        The row id of an entity whose entity file declares a deterministic id (id.rule uuidv5, ADR-0014) is a UUIDv5 in the
        same form, so two devices that write the same natural key converge on one row.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[57][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC.
      example: '2026-11-24T13:05:11.120Z'
    Money:
      type: object
      description: Amount in integer paise. Never a float.
      required: [amount_paise, currency]
      properties:
        amount_paise:
          type: integer
          format: int64
          description: Amount in paise (1 INR = 100 paise).
          example: 12500
        currency:
          type: string
          description: ISO 4217 currency code.
          enum: [INR]
          example: INR
    MobileE164:
      type: string
      description: >-
        Indian mobile number in E.164 form (+91 then ten digits starting 6 to 9). Accepted on
        input only where a request must carry a number; never returned in full by any vendor or
        support operation.
      pattern: '^\+91[6-9][0-9]{9}$'
      example: '+919876543210'
    MobileMasked:
      type: string
      description: Mobile number masked to its last 3 digits. The only form vendor and support responses may carry.
      pattern: '^\+91\*{7}[0-9]{3}$'
      example: '+91*******210'
    Gstin:
      type: string
      description: >-
        GSTIN, 15 characters, upper case, no spaces. Format only here; the check character and
        the state-code match are validated by the service (rule from gst-invoicing-india).
      pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$'
      example: 33ABCDE1234F1Z7
    StateCode:
      type: string
      description: Two-digit GST state code from the platform state reference table.
      pattern: '^[0-9]{2}$'
      example: '33'
    TicketReference:
      type: string
      description: Support ticket reference. Fixed pattern so it can travel in events without free text.
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$'
      example: SUP-2041
    Reason:
      type: string
      description: Free-text reason, 10 to 500 characters. Stays with the owning record; never placed in events.
      minLength: 10
      maxLength: 500
      example: Owner phoned to report a lost tablet.
    DrainStatement:
      type: object
      description: 'The device-signed list of everything a revoked device holds and its last document numbers (ADR-0005 A3.3,
        domain tag `hostry-drain-v1`). Ordinary drain: `by` = `origin`, signed with the revoked device''s key. Key loss: `by` = the
        adopting device, `rec` = the recovery id, signed with the new key.'
      properties:
        origin:
          type: string
          description: The drained device.
        streams:
          type: array
          description: Every stream in which the device's log holds an own-origin op, with its head.
          items:
            type: object
            description: Head of one stream.
            properties:
              stream:
                type: string
                description: Stream.
              seq:
                type: integer
                description: Last own-origin seq in the stream.
                format: int64
              h:
                type: string
                description: Hash of that op.
            required:
            - stream
            - seq
            - h
        series:
          type: array
          description: Every series in the device's pack, in the fields of a `series_close` record; 0 when never used.
          items:
            type: object
            description: Last number of one series.
            properties:
              series_id:
                type: string
                description: Series id.
              code:
                type: string
                description: Three-character series code.
              fy:
                type: string
                description: Financial year, four digits.
              last_number:
                type: integer
                description: Last running number allocated from the series, 0 when never used.
                format: int64
                minimum: 0
            required:
            - series_id
            - code
            - fy
            - last_number
        by:
          type: string
          description: Signing device id.
        rec:
          type: string
          description: Recovery record id (key loss only).
        kid:
          type: string
          description: Signing key id.
        at:
          type: string
          description: Signing time, RFC 3339 UTC.
        sig:
          type: string
          description: ES256 of "hostry-drain-v1\n" + canonical JSON of the statement without `sig`.
      required:
      - origin
      - streams
      - series
      - by
      - kid
      - at
      - sig
    PageCursor:
      type: object
      description: Cursor pagination field shared by every list response (compose with allOf).
      properties:
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
          example: eyJhZnRlciI6IjAxOTBhMWIyLWMzZDQtN2U1Zi04YTliLTBjMWQyZTNmNGE1YiJ9
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a stable URI per error kind.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the error kind, urn:hostry:problem:<code>.
          example: urn:hostry:problem:not_found
        title:
          type: string
          description: Short human-readable summary; not for programmatic use.
          example: Resource not found
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Explanation specific to this occurrence. Never contains internals or SQL.
          example: No such resource.
        instance:
          type: string
          description: URI reference identifying this occurrence.
          example: /v1/resources/0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        request_id:
          type: string
          description: Request ID for log correlation.
          example: req_0190a1b2c3d4
        code:
          type: string
          description: Stable machine-readable error code (also the suffix of `type`); doubles as the i18n key base.
          example: not_found
        reason:
          type: string
          description: Optional sub-code that refines `code`, for example approval_not_executable carries not_approved, lapsed, executed, not_approver or subject_changed.
          example: not_approved
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            description: One field-level error.
            required: [field, code]
            properties:
              field:
                type: string
                description: Name or path of the offending field.
                example: name
              code:
                type: string
                description: Stable machine-readable code for this field error.
                example: required
              message:
                type: string
                description: Optional human-readable explanation.
                example: must not be empty
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's next_cursor.
      schema:
        type: string
      example: eyJhZnRlciI6IjAxOTBhMWIyLWMzZDQtN2U1Zi04YTliLTBjMWQyZTNmNGE1YiJ9
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 50, maximum 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key, 1-128 visible ASCII characters (a UUIDv7 is
        recommended). A replay with the same key and request returns the original status and
        body without repeating the effect. The same key with a different request returns 422
        (code idempotency.mismatch); the same key while the first request is still in progress
        returns 409 (code idempotency.in_progress); an invalid key returns 422
        (code idempotency.key_invalid). Records expire after 24 hours. An operation whose response
        carries a one-time secret (token, refresh token, code, code half, grant, offline pack) never has
        that response stored: its replay returns 409 (code idempotency.replay_secret) and the client
        repeats the operation with a new key. Token-issuing operations (sessions, refresh, device and
        drain tokens) are not recorded; a replay runs again and meets the credential checks.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]{1,128}$'
      example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Caller-supplied request ID, echoed in responses and logs. Generated if absent.
      schema:
        type: string
        maxLength: 64
      example: req_0190a1b2c3d4
    OutletScope:
      name: X-Outlet-Id
      in: header
      required: false
      description: >-
        Selects the outlet/property scope within the token's organisation. The tenant itself
        is always taken from the token, never from a header, query or body field.
      schema:
        $ref: '#/components/schemas/Id'
      example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
    VendorLimit:
      name: limit
      in: query
      required: false
      description: Page size for vendor lists (default 25, maximum 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    VendorClientAddress:
      name: X-Vendor-Client-Address
      in: header
      required: false
      description: >-
        Network address of the staff member's browser, passed down by the admin service. Trusted
        only together with the admin service token; used for the audit record alone.
      schema:
        type: string
        maxLength: 45
      example: 203.0.113.7
    ApprovalToken:
      name: Hostry-Approval
      in: header
      required: false
      description: >-
        Per-operation approval token (ADR-0005 A2.2). ES256, typ approval, 5 minutes, single use;
        claims include op (the operationId), bh (hash of the request body) and th (target hash), so it releases only
        that one request on that one target. th is the lower-case hex SHA-256 over the UTF-8 text METHOD, a newline, the
        request path with its ids exactly as sent (no query string), a newline and the 64 hex digits of bh (no sha256:
        prefix), for example "POST\n/v1/members\n<bh hex>"; the verifier recomputes it from the request it received
        and refuses a token whose th differs (403 approval.target_mismatch). Needed when the binding is under caution and the operation is blocked.
      schema:
        type: string
      example: tok_example_approval
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
      example: 30
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:bad_request', title: Bad request, status: 400, code: bad_request}
    Unauthorized:
      description: Missing or refused token. Every refused token (expired, wrong realm, wrong audience, revoked, bad signature) is the same 401 with code auth.invalid_token; no finer reason is exposed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:auth.invalid_token', title: Authentication required, status: 401, code: auth.invalid_token}
    Forbidden:
      description: Token lacks the required permission.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:forbidden', title: Permission denied, status: 403, code: forbidden}
    NotFound:
      description: No such resource in the caller's tenant (also returned for another tenant's resource).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:not_found', title: Not found, status: 404, code: not_found}
    Conflict:
      description: State conflict, or an Idempotency-Key request still in progress.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:idempotency.in_progress', title: Conflict, status: 409, code: idempotency.in_progress}
    ValidationFailed:
      description: Request is well-formed but invalid, or an Idempotency-Key was reused with a different request.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:hostry:problem:validation'
            title: Validation failed
            status: 422
            code: validation
            errors: [{field: name, code: required, message: must not be empty}]
    EmitUnavailable:
      description: The cloud sync gateway cannot take the emit now (unreachable, 5xx, timeout, or not ready after a restore; ADR-0014 A2.2 item 7). Nothing changed anywhere. Retry with the same Idempotency-Key, which is safe even if the first call did land. One code for every service.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:emit.unavailable', title: Cloud emit unavailable, status: 503, code: emit.unavailable}
    TooManyRequests:
      description: Rate limit exceeded; honour Retry-After.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'urn:hostry:problem:rate_limited', title: Too many requests, status: 429, code: rate_limited}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token issued by identity (ADR-0005). One tenant per token.
    vendorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token of the vendor realm (own issuer and audience). Refused by every tenant-facing operation.
    serviceAuth:
      type: apiKey
      in: header
      name: Hostry-Service-Token
      description: >-
        60-second ES256 service token (ADR-0005 section 9) naming the calling service. Operations
        under /internal/v1 accept it only from the callers listed in x-service-callers.
