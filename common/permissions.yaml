# Permission catalogue and link-scope catalogue (ADR-0005 section 7, A2.2, A2.4, A2.5; ADR-0003 section 3).
# Source of truth for go-auth and client-core generation. Checked by `make lint-specs`
# (cmd/validate-specs): every x-permission in every spec must appear here.
#
# Flags
#   sensitive         reason and audit record required
#   strong_only       never exercisable in a pin or device session; blocked for 24 h on a binding under caution
#   owner_grant       roles containing it are created, edited and assigned by owners only (every strong_only
#                     permission is owner_grant in v1; the lint enforces it)
#   support_viewable  readable in a support session (view mode); read operations only
#   support_actable   writable in a support session in act mode; no permission carries it in Phase 1; the lint
#                     refuses it on strong_only, owner_grant and sensitive permissions
# Realms
#   tenant   tenant-realm token (user, pin, device, support)
#   vendor   vendor-realm token (admin.*); never valid in a tenant token
#   service  caller identified by the service token alone (x-service-callers)
catalogue_version: 1
permissions:
  # ---- tenancy ----
  - {key: organisation.read, realm: tenant, service: tenancy, description_key: perm.organisation.read, flags: [support_viewable]}
  - {key: organisation.manage, realm: tenant, service: tenancy, description_key: perm.organisation.manage, flags: [strong_only, owner_grant]}
  - {key: brand.read, realm: tenant, service: tenancy, description_key: perm.brand.read, flags: [support_viewable]}
  - {key: brand.manage, realm: tenant, service: tenancy, description_key: perm.brand.manage, flags: [strong_only, owner_grant]}
  - {key: outlet.read, realm: tenant, service: tenancy, description_key: perm.outlet.read, flags: [support_viewable]}
  - {key: outlet.create, realm: tenant, service: tenancy, description_key: perm.outlet.create, flags: [strong_only, owner_grant]}
  - {key: outlet.manage, realm: tenant, service: tenancy, description_key: perm.outlet.manage, flags: [strong_only, owner_grant]}
  - {key: tax_registration.read, realm: tenant, service: tenancy, description_key: perm.tax_registration.read, flags: [support_viewable]}
  - {key: tax_registration.manage, realm: tenant, service: tenancy, description_key: perm.tax_registration.manage, flags: [sensitive, strong_only, owner_grant]}
  - {key: settings.read, realm: tenant, service: tenancy, description_key: perm.settings.read, flags: [support_viewable]}
  - {key: settings.manage, realm: tenant, service: tenancy, description_key: perm.settings.manage, flags: [strong_only, owner_grant]}
  - {key: series.read, realm: tenant, service: tenancy, description_key: perm.series.read, flags: [support_viewable]}
  - {key: series.close_unreconciled, realm: tenant, service: tenancy, description_key: perm.series.close_unreconciled, flags: [sensitive, strong_only, owner_grant]}
  - {key: link.read, realm: tenant, service: tenancy, description_key: perm.link.read, flags: []}
  - {key: link.manage, realm: tenant, service: tenancy, description_key: perm.link.manage, flags: [sensitive, strong_only, owner_grant]}
  - {key: link.revoke, realm: tenant, service: tenancy, description_key: perm.link.revoke, flags: [sensitive, strong_only, owner_grant]}
  # ---- identity ----
  - {key: device.read, realm: tenant, service: identity, description_key: perm.device.read, flags: [support_viewable]}
  - {key: device.register, realm: tenant, service: identity, description_key: perm.device.register, flags: [strong_only, owner_grant]}
  - {key: device.activation_code.create, realm: tenant, service: identity, description_key: perm.device.activation_code.create, flags: [strong_only, owner_grant]}
  - {key: device.revoke, realm: tenant, service: identity, description_key: perm.device.revoke, flags: [sensitive, strong_only, owner_grant]}
  - {key: member.read, realm: tenant, service: identity, description_key: perm.member.read, flags: [support_viewable]}
  - {key: member.manage, realm: tenant, service: identity, description_key: perm.member.manage, flags: [sensitive, strong_only, owner_grant]}
  - {key: member.pin.authorise, realm: tenant, service: identity, description_key: perm.member.pin.authorise, flags: [strong_only, owner_grant]}
  - {key: member.role.assign, realm: tenant, service: identity, description_key: perm.member.role.assign, flags: [sensitive, strong_only, owner_grant]}
  - {key: member.owner.assign, realm: tenant, service: identity, description_key: perm.member.owner.assign, flags: [sensitive, strong_only, owner_grant]}
  - {key: role.read, realm: tenant, service: identity, description_key: perm.role.read, flags: [support_viewable]}
  - {key: role.manage, realm: tenant, service: identity, description_key: perm.role.manage, flags: [strong_only, owner_grant]}
  - {key: audit.read, realm: tenant, service: identity, description_key: perm.audit.read, flags: []}
  # Declared for Phase 2 (owner app creates the one-time code for act mode); no operation in Phase 1.
  - {key: support.code.create, realm: tenant, service: identity, description_key: perm.support.code.create, flags: [strong_only, owner_grant]}
  # ---- restaurant domain (Phase 2; docs/product/restaurant-mvp-spec.md section 2) ----
  # Spec flags map as: S -> sensitive; SO -> strong_only + owner_grant. P (action proof) and A (allowance) are intent properties of the
  # sync intent registry, not catalogue flags; they are noted at the end of a row. Support-session flags are conservative: only menu.read is viewable.
  - {key: menu.read, realm: tenant, service: catalog, description_key: perm.menu.read, flags: [support_viewable]}
  - {key: menu.manage, realm: tenant, service: catalog, description_key: perm.menu.manage, flags: []}
  - {key: menu.price.edit, realm: tenant, service: catalog, description_key: perm.menu.price.edit, flags: [sensitive]}  # P
  - {key: menu.tax_class.edit, realm: tenant, service: catalog, description_key: perm.menu.tax_class.edit, flags: [strong_only, owner_grant]}
  - {key: menu.import, realm: tenant, service: catalog, description_key: perm.menu.import, flags: [strong_only, owner_grant]}
  - {key: menu.availability.set, realm: tenant, service: catalog, description_key: perm.menu.availability.set, flags: []}
  - {key: menu.open_item, realm: tenant, service: catalog, description_key: perm.menu.open_item, flags: []}  # A
  - {key: catalog.import, realm: tenant, service: catalog, description_key: perm.catalog.import, flags: [support_actable]}  # act-mode twin of menu.import (ADR-0005 A2.5 item 5); stays off until security-reviewer signs
  - {key: floor.manage, realm: tenant, service: catalog, description_key: perm.floor.manage, flags: []}
  - {key: order.create, realm: tenant, service: orders, description_key: perm.order.create, flags: []}
  - {key: order.edit, realm: tenant, service: orders, description_key: perm.order.edit, flags: []}
  - {key: order.line.cancel, realm: tenant, service: orders, description_key: perm.order.line.cancel, flags: [sensitive]}  # P
  - {key: order.line.cancel.grace, realm: tenant, service: orders, description_key: perm.order.line.cancel.grace, flags: []}  # A
  - {key: order.items.move, realm: tenant, service: orders, description_key: perm.order.items.move, flags: []}
  - {key: order.table.move, realm: tenant, service: orders, description_key: perm.order.table.move, flags: []}
  - {key: order.table.merge, realm: tenant, service: orders, description_key: perm.order.table.merge, flags: []}
  - {key: kot.handover, realm: tenant, service: orders, description_key: perm.kot.handover, flags: []}
  - {key: kot.reprint, realm: tenant, service: orders, description_key: perm.kot.reprint, flags: []}
  - {key: kds.view, realm: tenant, service: orders, description_key: perm.kds.view, flags: []}
  - {key: kds.bump, realm: tenant, service: orders, description_key: perm.kds.bump, flags: []}
  - {key: bill.split, realm: tenant, service: orders, description_key: perm.bill.split, flags: []}
  - {key: bill.merge, realm: tenant, service: orders, description_key: perm.bill.merge, flags: []}
  - {key: bill.new, realm: tenant, service: orders, description_key: perm.bill.new, flags: []}
  - {key: bill.request, realm: tenant, service: orders, description_key: perm.bill.request, flags: []}
  - {key: bill.present, realm: tenant, service: orders, description_key: perm.bill.present, flags: []}
  - {key: bill.cancel, realm: tenant, service: orders, description_key: perm.bill.cancel, flags: [sensitive]}  # P
  - {key: check.close_internal, realm: tenant, service: orders, description_key: perm.check.close_internal, flags: [sensitive]}  # A; internal-consumption record is owned by billing (O2-1, provisional)
  - {key: exceptions.view, realm: tenant, service: orders, description_key: perm.exceptions.view, flags: []}  # shared by catalog, orders and billing exception lists
  - {key: exceptions.resolve, realm: tenant, service: orders, description_key: perm.exceptions.resolve, flags: []}
  - {key: bill.finalize, realm: tenant, service: billing, description_key: perm.bill.finalize, flags: []}
  - {key: payment.record, realm: tenant, service: billing, description_key: perm.payment.record, flags: []}
  - {key: bill.discount.apply, realm: tenant, service: billing, description_key: perm.bill.discount.apply, flags: []}
  - {key: bill.discount.over_limit, realm: tenant, service: billing, description_key: perm.bill.discount.over_limit, flags: [sensitive]}  # P
  - {key: bill.discount.limit.edit, realm: tenant, service: billing, description_key: perm.bill.discount.limit.edit, flags: [strong_only, owner_grant]}
  - {key: bill.line.comp, realm: tenant, service: billing, description_key: perm.bill.line.comp, flags: [sensitive]}  # P
  - {key: bill.line.comp.allowance, realm: tenant, service: billing, description_key: perm.bill.line.comp.allowance, flags: []}  # A
  - {key: bill.service_charge.remove, realm: tenant, service: billing, description_key: perm.bill.service_charge.remove, flags: []}
  - {key: bill.customer_details.edit, realm: tenant, service: billing, description_key: perm.bill.customer_details.edit, flags: []}
  - {key: bill.reprint, realm: tenant, service: billing, description_key: perm.bill.reprint, flags: []}
  - {key: bill.credit_note.create, realm: tenant, service: billing, description_key: perm.bill.credit_note.create, flags: [sensitive]}  # P
  - {key: bill.rebill, realm: tenant, service: billing, description_key: perm.bill.rebill, flags: []}  # A
  - {key: bill.manual_entry, realm: tenant, service: billing, description_key: perm.bill.manual_entry, flags: [sensitive]}
  - {key: payment.refund, realm: tenant, service: billing, description_key: perm.payment.refund, flags: [sensitive]}  # P
  - {key: drawer.open_no_sale, realm: tenant, service: billing, description_key: perm.drawer.open_no_sale, flags: [sensitive]}
  - {key: drawer.cash_move, realm: tenant, service: billing, description_key: perm.drawer.cash_move, flags: []}
  - {key: shift.open, realm: tenant, service: billing, description_key: perm.shift.open, flags: []}
  - {key: shift.close, realm: tenant, service: billing, description_key: perm.shift.close, flags: []}
  - {key: shift.close.any, realm: tenant, service: billing, description_key: perm.shift.close.any, flags: []}
  - {key: day.close, realm: tenant, service: billing, description_key: perm.day.close, flags: [sensitive]}
  - {key: report.view.day, realm: tenant, service: billing, description_key: perm.report.view.day, flags: []}
  - {key: report.view.outlet, realm: tenant, service: billing, description_key: perm.report.view.outlet, flags: []}
  - {key: report.export, realm: tenant, service: billing, description_key: perm.report.export, flags: []}
  - {key: settings.outlet.edit, realm: tenant, service: billing, description_key: perm.settings.outlet.edit, flags: []}
  - {key: settings.gst_profile.edit, realm: tenant, service: billing, description_key: perm.settings.gst_profile.edit, flags: [strong_only, owner_grant]}
  - {key: settings.numbering.edit, realm: tenant, service: billing, description_key: perm.settings.numbering.edit, flags: [strong_only, owner_grant]}
  - {key: member.disable_local, realm: tenant, service: identity, description_key: perm.member.disable_local, flags: [sensitive]}  # Should; off until the ADR-0005 amendment (O2-2)
  - {key: audit.read.vendor_access, realm: tenant, service: identity, description_key: perm.audit.read.vendor_access, flags: []}
  - {key: subscription.read, realm: tenant, service: tenancy, description_key: perm.subscription.read, flags: []}  # owner "My plan" (Could, A1 BR-A1-90)
  # Added with the sync intent registry (sync/intents): named by the spec and ADR-0005 section 8 but absent from the catalogue. Provisional; security-reviewer confirms.
  - {key: series.activate, realm: tenant, service: tenancy, description_key: perm.series.activate, flags: [sensitive]}  # P; offline activation of a dormant billing series with an approval (RM-O25)
  - {key: device.clock.confirm, realm: tenant, service: identity, description_key: perm.device.clock.confirm, flags: [sensitive]}  # P; manager confirms date and time after a clock skew (RM-X3)
  - {key: series.manual_book.register, realm: tenant, service: tenancy, description_key: perm.series.manual_book.register, flags: [sensitive, strong_only, owner_grant]}  # owner registers a paper bill book as an entry-only series (ADR-0014 A1.6 item 4)
  # ---- service callers (x-service-callers) ----
  - {key: revocation.read, realm: service, service: identity, description_key: perm.revocation.read, flags: []}
  - {key: device.drain.record, realm: service, service: identity, description_key: perm.device.drain.record, flags: []}
  - {key: proof.verify, realm: service, service: identity, description_key: perm.proof.verify, flags: []}
  - {key: series.issue, realm: service, service: tenancy, description_key: perm.series.issue, flags: []}
  - {key: link.decide, realm: service, service: tenancy, description_key: perm.link.decide, flags: []}
  - {key: register.read, realm: service, service: billing, description_key: perm.register.read, flags: []}  # tenancy and identity read the last number seen per series (ADR-0014 R5)
  - {key: orders.check_count.read, realm: service, service: orders, description_key: perm.orders.check_count.read, flags: []}  # billing asks for open checks before accepting number_at (not on the trading path)
  # ---- vendor realm (Admin A0 section 2; ADR-0003 A1.1; ADR-0005 A2.3) ----
  - {key: admin.org.read, realm: vendor, service: admin, description_key: perm.admin.org.read, flags: []}
  - {key: admin.org.create, realm: vendor, service: admin, description_key: perm.admin.org.create, flags: []}
  - {key: admin.owner_invite.manage, realm: vendor, service: admin, description_key: perm.admin.owner_invite.manage, flags: []}
  - {key: admin.registration.verify, realm: vendor, service: admin, description_key: perm.admin.registration.verify, flags: []}
  - {key: admin.device.read, realm: vendor, service: admin, description_key: perm.admin.device.read, flags: []}
  - {key: admin.device.revoke, realm: vendor, service: admin, description_key: perm.admin.device.revoke, flags: []}
  - {key: admin.support.session.start, realm: vendor, service: admin, description_key: perm.admin.support.session.start, flags: []}
  - {key: admin.audit.read, realm: vendor, service: admin, description_key: perm.admin.audit.read, flags: []}
  - {key: admin.audit.read_own, realm: vendor, service: admin, description_key: perm.admin.audit.read_own, flags: []}
  - {key: admin.user.manage, realm: vendor, service: admin, description_key: perm.admin.user.manage, flags: []}
  # Two-person approvals. The three admin.approval.* strings are gate permissions (a static x-permission cannot express "by kind");
  # the kind-specific permissions below are checked by identity per kind (x-permission-by-kind).
  - {key: admin.approval.create, realm: vendor, service: admin, description_key: perm.admin.approval.create, flags: []}
  - {key: admin.approval.read, realm: vendor, service: admin, description_key: perm.admin.approval.read, flags: []}
  - {key: admin.approval.decide, realm: vendor, service: admin, description_key: perm.admin.approval.decide, flags: []}
  - {key: admin.signin_code.create, realm: vendor, service: admin, description_key: perm.admin.signin_code.create, flags: []}
  - {key: admin.signin_code.approve, realm: vendor, service: admin, description_key: perm.admin.signin_code.approve, flags: []}
  - {key: admin.recovery.create, realm: vendor, service: admin, description_key: perm.admin.recovery.create, flags: []}
  - {key: admin.recovery.approve, realm: vendor, service: admin, description_key: perm.admin.recovery.approve, flags: []}
  # Admin A1 (docs/product/admin-a1-spec.md section 2; ADR-0014 A1.3, A1.4)
  - {key: admin.subscription.read, realm: vendor, service: admin, description_key: perm.admin.subscription.read, flags: []}
  - {key: admin.subscription.start, realm: vendor, service: admin, description_key: perm.admin.subscription.start, flags: []}
  - {key: admin.subscription.manage, realm: vendor, service: admin, description_key: perm.admin.subscription.manage, flags: []}
  - {key: admin.subscription.adjust, realm: vendor, service: admin, description_key: perm.admin.subscription.adjust, flags: []}
  - {key: admin.plan.manage, realm: vendor, service: admin, description_key: perm.admin.plan.manage, flags: []}
  - {key: admin.taxrules.manage, realm: vendor, service: admin, description_key: perm.admin.taxrules.manage, flags: []}
  - {key: admin.taxrules.publish, realm: vendor, service: admin, description_key: perm.admin.taxrules.publish, flags: []}
  - {key: admin.org.lifecycle.request, realm: vendor, service: admin, description_key: perm.admin.org.lifecycle.request, flags: []}
  - {key: admin.org.lifecycle.approve, realm: vendor, service: admin, description_key: perm.admin.org.lifecycle.approve, flags: []}
  - {key: admin.support.session.act, realm: vendor, service: admin, description_key: perm.admin.support.session.act, flags: []}
  - {key: admin.report.ledger, realm: vendor, service: admin, description_key: perm.admin.report.ledger, flags: []}
  # ---- sync (device-token capabilities, member-token read-backs, and the internal emit) ----
  - {key: sync.push, realm: tenant, service: sync, description_key: perm.sync.push, flags: []}  # device token: hello, push, pull, snapshot, poke
  - {key: sync.drain, realm: tenant, service: sync, description_key: perm.sync.drain, flags: []}  # drain token: quarantine-upload only (ADR-0005 section 4)
  - {key: sync.quarantine.manage, realm: tenant, service: sync, description_key: perm.sync.quarantine.manage, flags: [sensitive]}
  - {key: sync.exceptions.read, realm: tenant, service: sync, description_key: perm.sync.exceptions.read, flags: []}
  - {key: sync.register.read, realm: tenant, service: sync, description_key: perm.sync.register.read, flags: []}
  - {key: sync.emit, realm: service, service: sync, description_key: perm.sync.emit, flags: []}  # catalog and billing write cloud-origin ops (ADR-0014 A2.2)

# Vendor roles are sets of permissions (checks are on permissions, never role names). A0 table of
# docs/product/admin-a0-spec.md section 2, plus admin.registration.verify (ADR-0003 A1.1: platform admin and onboarding)
# and the approval permissions (proposed: platform_admin for sign-in codes and recovery, which stay switched off;
# support for device_revoke_over_quota via admin.device.revoke).
# Role matrix rule while the vendor team is three people or fewer: approval of sign-in codes and owner recovery
# (admin.signin_code.approve, admin.recovery.approve) belongs to platform_admin only; support may still create the requests
# (admin.approval.create) but approves only device_revoke_over_quota. Revisit when the team grows (security review H-roles).
vendor_roles:
  platform_admin: [admin.org.read, admin.org.create, admin.owner_invite.manage, admin.registration.verify, admin.device.read, admin.device.revoke,
                   admin.support.session.start, admin.audit.read, admin.audit.read_own, admin.user.manage, admin.approval.create, admin.approval.read,
                   admin.approval.decide, admin.signin_code.create, admin.signin_code.approve, admin.recovery.create, admin.recovery.approve,
                   admin.subscription.read, admin.subscription.start, admin.subscription.manage, admin.subscription.adjust, admin.plan.manage, admin.taxrules.manage, admin.taxrules.publish, admin.org.lifecycle.request, admin.org.lifecycle.approve, admin.support.session.act, admin.report.ledger]
  onboarding: [admin.org.read, admin.org.create, admin.owner_invite.manage, admin.registration.verify, admin.device.read, admin.audit.read_own,
               admin.subscription.read, admin.subscription.start, admin.support.session.act]
  support: [admin.org.read, admin.device.read, admin.device.revoke, admin.support.session.start, admin.audit.read_own,
            admin.approval.create, admin.approval.read, admin.approval.decide,
            admin.subscription.read]
  billing: [admin.org.read, admin.audit.read_own,
            admin.subscription.read, admin.subscription.start, admin.subscription.manage, admin.org.lifecycle.request, admin.report.ledger]

# Link scopes (ADR-0003 section 3). Phase 1 has the test-only pair used by the go-common/testkit fixture operation;
# no service spec declares a link scope. Real scopes arrive with the Phase 5 templates.
link_scopes:
  - {key: test.echo.read, description_key: linkscope.test.echo.read, test_only: true}
  - {key: test.echo.post, description_key: linkscope.test.echo.post, test_only: true}
