# Sync intent registry, gateway (ADR-0002 S4, ADR-0005 section 7 and A2, ADR-0014 R1). Source of truth for the client can() table, the
# gateway check (ADR-0002 S11) and the hub structural check (S8). Checked by `make lint-intents` (cmd/validate-intents);
# keys and rules are in sync/intents/README.md. Generated once from a table, edited by hand from here.
registry: sync-intents
registry_v: 1
group: gateway
description: Cloud-origin intents (the gateway emit API).
intents:
- intent: sync.void
  intent_v: 1
  class: control
  owner: gateway
  description: The gateway voids a refused configuration op on every node. Origin cloud-<epoch>; one mutation of the protocol
    record sync_void (svc-sync contract).
  permission: null
  permission_reason: Cloud-origin op; sealed by the gateway like any cloud-origin op.
  proof:
    kind: session
  override: false
  sessions: []
  device_kinds:
  - cloud
  streams:
  - outlet
  - brand
  - tenant
  numbering: none
  entities: {}
  records:
  - sync_void
  idempotency: The record id is stream|origin|seq of the refused op; a replayed void adds the same op to the void set again,
    which is a no-op.
- intent: cloud.emit
  intent_v: 1
  class: config
  owner: gateway
  description: 'A cloud service writes data to devices through the gateway emit API: published tax rule sets, the verified
    tax profile, billing settings changed online, and day revisions for late documents.'
  permission: null
  permission_reason: Authorised online by the serving service (vendor grant or strong-only API) before the emit; the gateway
    accepts it from cloud origin only.
  authorised_online_by:
  - admin.taxrules.publish
  - settings.gst_profile.edit
  - settings.numbering.edit
  - bill.discount.limit.edit
  proof:
    kind: session
  override: false
  sessions: []
  device_kinds:
  - cloud
  streams:
  - tenant
  - outlet
  numbering: none
  entities:
    tax_rule_set:
    - insert
    tax_rule:
    - insert
    outlet_tax_profile:
    - insert
    - set
    billing_settings:
    - insert
    - set
    business_day_revision:
    - insert
  idempotency: Each emit has a deterministic op id (UUIDv5 of tenant, entity and version), so a retried emit or an emit queued
    for an organisation created later is one op. Cloud-origin only entities are never writable from a device.
- intent: menu.import.apply
  intent_v: 1
  class: config
  owner: catalog
  description: A committed CSV menu import reaches devices as ops through the gateway emit API (ADR-0014 R9).
  permission: null
  permission_reason: 'Authorised online: createMenuImport and commit need a strong session, or a support act-mode session
    with the owner''s one-time code.'
  authorised_online_by:
  - menu.import
  - catalog.import
  proof:
    kind: session
  override: false
  sessions: []
  device_kinds:
  - cloud
  streams:
  - brand
  numbering: none
  entities:
    category:
    - insert
    - set
    item:
    - insert
    - set
    item_variant:
    - insert
    - set
    price_entry:
    - insert
    - set
  idempotency: Each row op id is a UUIDv5 of (import job, row), so a retried commit emits the same ops; devices apply them
    like any config op.
