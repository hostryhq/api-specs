- intent: day.open
  intent_v: 1
  class: trading
  owner: billing
  description: Open the outlet's business date. Two devices opening the same date while partitioned both record a day_open
    fact.
  permission: shift.open
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  streams:
  - outlet
  numbering: none
  entities:
    business_day:
    - insert
    day_open:
    - insert
  idempotency: The row id is a deterministic UUIDv5 of its natural key (entity file id.name), so two devices that write the
    same key converge on one row; a replayed op is ignored. Each device also records its own day_open fact.
- intent: day.close
  intent_v: 1
  class: trading
  owner: billing
  description: Lock the business date and record the Z-report figures. A closed day is never reopened; late documents become
    numbered revisions written by the cloud.
  permission: day.close
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  streams:
  - outlet
  numbering: none
  entities:
    business_day:
    - rank
    day_close:
    - insert
  idempotency: The business_day row is rank-forward (open to closed); a replayed or concurrent close is a no-op on the row
    and each close fact is kept.
