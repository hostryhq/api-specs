# Sync intent registry, billing (ADR-0002 S4, ADR-0005 section 7 and A2, ADR-0014 R1). Source of truth for the client can() table, the
# gateway check (ADR-0002 S11) and the hub structural check (S8). Checked by `make lint-intents` (cmd/validate-intents);
# keys and rules are in sync/intents/README.md. Generated once from a table, edited by hand from here.
registry: sync-intents
registry_v: 1
group: billing
description: Legal documents, tender, shifts and business days.
intents:
- intent: bill.finalize
  intent_v: 1
  class: trading
  owner: billing
  description: 'Take the invoice number: the first payment, Issue invoice, or Present in print mode. One op creates the bill,
    its lines and tax lines, any payment, and marks the check billed. Immutable afterwards; corrections are a credit note
    or a re-bill.'
  permission: bill.finalize
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: allocated
  documents:
  - tax_invoice
  - bill_of_supply
  - plain_bill
  entities:
    bill:
    - insert
    bill_line:
    - insert
    bill_tax_line:
    - insert
    payment:
    - insert
    check:
    - set
    - rank
    seating:
    - rank
  idempotency: The bill id is a client UUIDv7 and the number is allocated from the device series in the same local transaction
    as the op; replay never allocates again. The same number under a different bill id is refused as duplicate_document and
    the number is kept by the first op.
- intent: bill.manual_entry
  intent_v: 1
  class: trading
  owner: billing
  description: Type in a paper bill-book bill after a power cut. The book keeps its own number (entry-only series); Hostry
    never gives that supply a second number.
  permission: bill.manual_entry
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  streams:
  - outlet
  numbering: typed
  documents:
  - tax_invoice
  - bill_of_supply
  - plain_bill
  entities:
    bill:
    - insert
    bill_line:
    - insert
    bill_tax_line:
    - insert
    payment:
    - insert
  idempotency: The bill id is a UUIDv5 of (series, financial year, number), so the same page typed twice on two devices converges
    on one bill.
- intent: payment.record
  intent_v: 1
  class: trading
  owner: billing
  description: Record how a guest paid a numbered bill (a further share, or a bill issued before paying). Tender is recorded,
    not collected.
  permission: payment.record
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    payment:
    - insert
  idempotency: Every inserted row id is a client UUIDv7 carried in the op; an op is identified by (origin, stream, seq), so
    a replayed op is ignored and never inserts a second row.
- intent: payment.refund
  intent_v: 1
  class: trading
  owner: billing
  description: Return recorded money for a payment.
  permission: payment.refund
  proof:
    kind: action
    binds:
    - bill_id
    - payment_id
    - amount_paise
  override: true
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  streams:
  - outlet
  numbering: none
  entities:
    refund:
    - insert
  idempotency: Every inserted row id is a client UUIDv7 carried in the op; an op is identified by (origin, stream, seq), so
    a replayed op is ignored and never inserts a second row.
- intent: creditnote.issue
  intent_v: 1
  class: trading
  owner: billing
  description: Reduce the value of a numbered bill by a credit note that cites it.
  permission: bill.credit_note.create
  proof:
    kind: action
    binds:
    - bill_id
    - total_paise
  override: true
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: allocated
  documents:
  - credit_note
  entities:
    credit_note:
    - insert
    credit_note_line:
    - insert
    credit_note_tax_line:
    - insert
  idempotency: The credit note id is a client UUIDv7 and its number is allocated from the device credit-note series in the
    same local transaction; replay never allocates again.
- intent: bill.rebill
  intent_v: 1
  class: trading
  owner: billing
  description: 'One op for an unpaid numbered bill: a full credit note plus the replacement bills (split, GSTIN, discount,
    removed item), so no node sees half of it.'
  permission: bill.rebill
  proof:
    kind: session
  override: false
  allowance:
    counter: rebill
    limit_setting: rebill_allowance_per_shift
    checked_by: device and again by billing as a detector
  above_allowance:
    approval_permission: bill.credit_note.create
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: allocated
  documents:
  - credit_note
  - tax_invoice
  - bill_of_supply
  - plain_bill
  entities:
    credit_note:
    - insert
    credit_note_line:
    - insert
    credit_note_tax_line:
    - insert
    bill:
    - insert
    bill_line:
    - insert
    bill_tax_line:
    - insert
  idempotency: All new ids are client UUIDv7 and share one rebill_group_id; every number is allocated in the one local transaction;
    replay never allocates again.
  x-provisional: Above the allowance the spec says "a manager's approval"; the approval is taken as one for bill.credit_note.create.
    Confirm with security-reviewer.
