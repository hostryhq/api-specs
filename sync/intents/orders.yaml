- intent: bill.discount.apply
  intent_v: 1
  class: trading
  owner: orders
  description: Discount on a check or a line up to the outlet limit (a setting owned by billing).
  permission: bill.discount.apply
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    check:
    - set
    order_line:
    - set
  idempotency: Mutations are per field group, last writer by (hlc, origin); replaying the same op re-applies the same (hlc,
    origin) and is a no-op. A lww_review field carries prev, so a concurrent edit is kept and sent to a manager, never merged
    silently.
