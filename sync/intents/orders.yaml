- intent: kot.send
  intent_v: 1
  class: trading
  owner: orders
  description: 'Send draft lines to the kitchen: one ticket, its lines, and the lines rank from draft to sent. Delivery is
    to hub or cloud, not the kitchen seeing it.'
  permission: order.edit
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    kot:
    - insert
    kot_line:
    - insert
    order_line:
    - rank
  idempotency: Ticket and ticket-line ids are client UUIDv7 in the op; replay is a no-op. A second send of the same order
    lines creates no second ticket because the line state is rank-forward (draft to sent).
