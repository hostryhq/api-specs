# Sync intent registry, orders (ADR-0002 S4, ADR-0005 section 7 and A2, ADR-0014 R1). Source of truth for the client can() table, the
# gateway check (ADR-0002 S11) and the hub structural check (S8). Checked by `make lint-intents` (cmd/validate-intents);
# keys and rules are in sync/intents/README.md. Generated once from a table, edited by hand from here.
registry: sync-intents
registry_v: 1
group: orders
description: 'Floor and kitchen intents: seatings, orders, checks, tickets, KDS, discounts and comps on a check.'
intents:
- intent: seating.open
  intent_v: 1
  class: trading
  owner: orders
  description: Open a table (or counter) occupancy.
  permission: order.create
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    seating:
    - insert
  idempotency: Seating id is a client UUIDv7. Two devices opening the same table while partitioned create two seatings; the
    table-occupied detector raises an exception for a manager. Replay of one op is a no-op.
- intent: check.create
  intent_v: 1
  class: trading
  owner: orders
  description: Open the unnumbered check that lines will be billed together on.
  permission: order.create
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    check:
    - insert
  idempotency: Every inserted row id is a client UUIDv7 carried in the op; an op is identified by (origin, stream, seq), so
    a replayed op is ignored and never inserts a second row.
- intent: order.create
  intent_v: 1
  class: trading
  owner: orders
  description: Create an order on a seating or a counter token.
  permission: order.create
