- intent: order.line.cancel.grace
  intent_v: 1
  class: trading
  owner: orders
  description: 'Allowance: cancel a sent line while its kitchen status is still new and inside the grace window. No second
    person, a reason, counted per member per shift.'
  permission: order.line.cancel.grace
  proof:
    kind: session
  override: false
  allowance:
    counter: cancel_grace
    limit_setting: cancel_grace_seconds
    checked_by: device and again by orders as a detector
  above_allowance:
    use_intent: order.line.cancel
  sessions:
  - pin
  - strong
  device_kinds:
