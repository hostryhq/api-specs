    kind: action
    binds:
    - order_line_id
    - qty_milli
    - reason_code_id
  override: true
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - waiter
  streams:
  - outlet
  numbering: none
  entities:
    kot:
    - insert
    order_line_cancel:
