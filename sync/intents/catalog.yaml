# Sync intent registry, catalog (ADR-0002 S4, ADR-0005 section 7 and A2, ADR-0014 R1). Source of truth for the client can() table, the
# gateway check (ADR-0002 S11) and the hub structural check (S8). Checked by `make lint-intents` (cmd/validate-intents);
# keys and rules are in sync/intents/README.md. Generated once from a table, edited by hand from here.
registry: sync-intents
registry_v: 1
group: catalog
description: Menu, price, floor and outlet configuration (class config).
intents:
- intent: settings.outlet.edit
  intent_v: 1
  class: config
  owner: catalog
  description: 'Outlet settings: service charge, rounding, idle lock, KOT settings, stations, printers, print routes, tender
    kinds, quick items. GST profile, numbering mode and discount limit are strong-only online calls, not intents.'
  permission: settings.outlet.edit
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - personal
  streams:
  - outlet
  numbering: none
  entities:
    outlet_settings:
    - insert
    - set
    - del
    - undel
    printer:
    - insert
    - set
    - del
    - undel
    print_route:
    - insert
    - set
    - del
    - undel
    station:
    - insert
    - set
    - del
    - undel
    receipt_profile:
    - insert
    - set
    - del
    - undel
    outlet_power_profile:
    - insert
    - set
    - del
    - undel
    billing_settings:
    - insert
    - set
    tender_kind:
    - insert
    - set
    - del
    - undel
    item_outlet:
    - insert
    - set
    - del
    - undel
  idempotency: Mutations are per field group, last writer by (hlc, origin); replaying the same op re-applies the same (hlc,
    origin) and is a no-op. A lww_review field carries prev, so a concurrent edit is kept and sent to a manager, never merged
    silently. Singleton rows use deterministic UUIDv5 ids.
