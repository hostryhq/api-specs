- intent: menu.price.set
  intent_v: 1
  class: config
  owner: catalog
  description: Change a brand-level price. Price changes need an action proof; recorded in a pin session they are accepted
    and listed for the owner as configuration changed on a shared device.
  permission: menu.price.edit
  proof:
    kind: action
    binds:
    - item_id
    - variant_id
    - price_paise
  override: true
  sessions:
  - pin
  - strong
  device_kinds:
  - pos
  - personal
  streams:
  - brand
  numbering: none
  entities:
    price_entry:
    - insert
    - set
    - del
    - undel
  idempotency: Mutations are per field group, last writer by (hlc, origin); replaying the same op re-applies the same (hlc,
    origin) and is a no-op. A lww_review field carries prev, so a concurrent edit is kept and sent to a manager, never merged
    silently. The price row id is a UUIDv5 of its natural key, so concurrent edits meet on one row.
