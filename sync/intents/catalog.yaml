    - set
  idempotency: Mutations are per field group, last writer by (hlc, origin); replaying the same op re-applies the same (hlc,
    origin) and is a no-op. A lww_review field carries prev, so a concurrent edit is kept and sent to a manager, never merged
    silently.
  x-provisional: Spec lists per-outlet price overrides as Could, later; the entity field exists. Replaces menu.price.set in
    item_outlet.written_by_intents because one op has one stream.
- intent: menu.availability.set
  intent_v: 1
  class: config
  owner: catalog
  description: Mark an item sold out or available at one outlet. The kitchen holds this permission; a KDS acts in its device
    session.
  permission: menu.availability.set
  proof:
    kind: session
  override: false
  sessions:
  - pin
  - strong
  - device
  device_kinds:
  - pos
  - waiter
  - kds
  - personal
  streams:
  - outlet
  numbering: none
  entities:
    item_outlet:
    - insert
    - set
    - del
    - undel
  idempotency: Mutations are per field group, last writer by (hlc, origin); replaying the same op re-applies the same (hlc,
    origin) and is a no-op. A lww_review field carries prev, so a concurrent edit is kept and sent to a manager, never merged
    silently. The row id is a deterministic UUIDv5 of its natural key (entity file id.name), so two devices that write the
    same key converge on one row; a replayed op is ignored.
