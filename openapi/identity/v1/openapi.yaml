openapi: 3.1.0
info:
  title: Hostry identity API
  version: 1.0.0
  description: Sessions, OTP login, devices, members, roles, offline packs, revocations, owner invitations
    and the vendor realm (ADR-0005 with Amendments A1 and A2; ADR-0013). Tenant-facing operations are
    under /v1; operations for other services and for the admin service are under /internal/v1 (the exception
    to the /v1 rule recorded in ADR-0005 section 9) and declare x-service-callers. Vendor operations require
    the admin service token plus the vendor user's own access token. The tenant is always taken from the
    verified token, never from a body field; on vendor routes the organisation comes from the path. Vendor-assisted
    sign-in codes and owner recovery exist but are off by default (configuration). Creating the first
    vendor user (`vendor bootstrap`, `vendor recover`) is a command of the identity binary and has no
    API.
  x-status: stable
  x-example-worlds:
    base: "Organisation 4a60 with outlet 4a61 (tenancy). Owner Asha 4a64 (active, +919876543210, PIN set, pin_v 2; assignments 4a6f to built-in role Owner 4a9a and 4a8b to Cashier 4a65 at outlet 4a61). Staff member Ravi 4a9e (active, +919876543211, no PIN, assignment 4a9f to Cashier 4a65). Roles: Owner 4a9a (built-in), Cashier 4a65, Waiter 4a9b (unassigned). Device 4a5e (pos, Counter 1, outlet 4a61, active, hardware key, billing active, registered 13:05:11, last contact 13:10:11) with binding 4a6e (active, caution until 2026-12-08), offline pack_v 7 (issued 13:05:11, valid until 2026-12-08), series A7K active for it. Permission catalogue version 1 (common/permissions.yaml). Vendor users Priya 4a66 (support, active, TOTP enrolled) and Arun 4a78 (platform_admin, active). Device nonce nonce_example_01 valid. No session, challenge, approval, support session or invitation exists. The caller of tenant operations is Asha in a strong session; the caller of vendor operations is Priya."
    otp-challenge-pending: "Base plus OTP challenge 4a5b outstanding for +919876543210 from device 4a5e, code 482915."
    session-open: "Base plus Asha session 4a5d opened at 13:05:11 on device 4a5e with refresh token tok_example_refresh, PIN session proof valid (pack_v 7, pin_v 2)."
    device-unregistered: "Base without device 4a5e, binding 4a6e and series; nonce nonce_example_01 valid; activation code 7QK3M9XD (id 4a75, pos, outlet 4a61) unused and unexpired."
    device-revoked: "Base after device 4a5e was revoked at 13:15:11 by vendor user Priya for ticket SUP-2041 (revocation 4a77; vendor audit entry 4a8a vendor.device.revoked); the drain is not recorded yet."
    device-drained: "The device-revoked world after the device drained through device-ops seq 1842; a wipe order was issued at 13:20:11."
    pin-reset-authorised: "Base plus PIN reset authorisation 4a76 for Asha on device 4a5e, unused and unexpired."
    pin-locked: "Base with Asha locked out after repeated wrong PINs."
    co-owner: "Base plus owner-role assignment 4a8d on Ravi 4a9e (built-in role Owner 4a9a)."
    approval-pending: "Base plus approval request 4a70 (operation createMember, body hash as in the example) filed by Ravi on binding 4a6e and pending; the caller is Asha, who may decide it."
    approval-approved: "The approval-pending world after the request was approved; the caller is the requester Ravi and the token is still unclaimed."
    owner-recovery-pending: "Base plus owner recovery 4a8d pending for the organisation; the caller is Asha, who did not request it."
    org-no-owner: "Organisation 4a60 exists with no members and no owner invitation; the caller is a vendor user with admin.owner_invite.manage."
    owner-invited: "Organisation 4a60 exists with no members and a pending owner invitation 4a67 for +919876543210 (owner name Asha) created at 13:05:11."
    vendor-session-active: "Base plus an active vendor session for Priya with renewal handle renew_example."
    vendor-setup-pending: "Priya 4a66 in status setup_pending with setup token setup_example valid and no TOTP enrolled."
    support-session-active: "Base plus support session 4a68 (view mode) started by Priya for organisation 4a60, ticket SUP-2041, 13:05:11 to 13:35:11, active; the tenant audit holds entry 4a69 support.session.started."
    vendor-approval-pending: "Base plus vendor approval 4a6d (kind sign_in_code, organisation 4a60, +919876543210, requested by Priya, ticket SUP-2041) pending; the caller is Arun 4a78 (platform_admin)."
    vendor-approval-approved: "The vendor-approval-pending world after Arun approved it; the caller is the requester Priya, who has not claimed her code half."
servers:
- url: /
tags:
- name: identity
  description: Identity service.
- name: vendor
  description: 'Vendor realm: vendor users, support sessions, owner invitations, vendor device access,
    two-person approvals.'
- name: internal
  description: Operations for other Hostry services (sync gateway).
security:
- bearerAuth: []
paths:
  /v1/otp-challenges:
    post:
      operationId: createOtpChallenge
      summary: Start an owner or manager OTP sign-in
      description: 'Limits: 30 s resend cooldown, 3 sends per 15 minutes and 6 per day per number, plus
        per-device and per-IP limits and a global daily budget (429 with Retry-After). Counters advance
        identically for unknown numbers, so 429 does not reveal whether a number is known. Indian numbers only.'
      tags:
      - identity
      x-permission: public
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOtpChallenge'
            example:
              mobile_e164: '+919876543210'
              device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              device_public_key:
                kty: EC
                crv: P-256
                x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
      responses:
        '202':
          description: Challenge created. Identical status, body and timing band for known and unknown
            numbers; an OTP is sent only to a number with an account or a pending invitation (ADR-0005
            section 3, IC-03). A number over a limit gets the 429 below, identically whether or not the
            number is known.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
                expires_at: '2026-11-24T13:10:11.120Z'
                resend_after: '2026-11-24T13:05:41.120Z'
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/sessions:
    post:
      operationId: createSession
      summary: Exchange a verified OTP (or vendor-assisted code) for a session
      tags:
      - identity
      x-permission: public
      x-example-world: otp-challenge-pending
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
            example:
              grant_type: otp
              challenge_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
              code: '482915'
              device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              device_assertion: assertion.example
      responses:
        '201':
          description: Session created. When the number has a pending owner invitation, the invitation
            is consumed and the owner member created (invitation_accepted). A replay or a different number
            is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d
                member_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
                tokens:
                  access_token: tok_example_access
                  token_type: Bearer
                  expires_at: '2026-11-24T13:10:11.120Z'
                  refresh_token: tok_example_refresh
                  refresh_expires_at: '2026-12-24T13:05:11.120Z'
                amr: otp
                auth_time: '2026-11-24T13:05:11.120Z'
                invitation_accepted: false
                memberships:
                - member_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
                  organisation_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/sessions/{session_id}:
    delete:
      operationId: endSession
      summary: End a session (sign out, or end a pin session id)
      tags:
      - identity
      x-permission: authenticated
      x-example-world: session-open
      parameters:
      - name: session_id
        in: path
        required: true
        description: Session ID (the sid claim).
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      responses:
        '204':
          description: Session ended; an ended session id gets no more tokens. Repeating is a no-op.
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /v1/tokens/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      tags:
      - identity
      x-permission: public
      x-example-world: session-open
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSession'
            example:
              refresh_token: tok_example_refresh
              device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              proof: proof.example
      responses:
        '200':
          description: New token pair. Reuse of a rotated refresh token revokes the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: tok_example_access
                token_type: Bearer
                expires_at: '2026-11-24T13:10:11.120Z'
                refresh_token: tok_example_refresh
                refresh_expires_at: '2026-12-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/tokens/switch:
    post:
      operationId: switchMember
      summary: Get a token for another organisation of the same account
      tags:
      - identity
      x-permission: authenticated
      x-example-world: session-open
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchMember'
            example:
              member_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
      responses:
        '200':
          description: Token for the chosen membership (membership and member status re-read; one tenant
            per token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: tok_example_access
                token_type: Bearer
                expires_at: '2026-11-24T13:10:11.120Z'
                refresh_token: tok_example_refresh
                refresh_expires_at: '2026-12-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /v1/tokens/device:
    post:
      operationId: createDeviceToken
      summary: Get a device or pin token by device-key assertion
      description: 'Pin grant (ADR-0005 A2.1): identity checks device, outlet binding, member, pack_v
        issued to this device, current pin_v, opened_at within [-60 s, +16 h], sid ownership and the proof.
        Limits: 5 failures in 15 minutes refuse that member and device for 15 minutes; 10 failed sessions
        in 24 hours refuse until cleared. These limits never touch local PIN login or sync.'
      tags:
      - identity
      x-permission: public
      x-example-world: session-open
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
            example:
              grant_type: pin
              device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              assertion: assertion.example
              session_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d
              member_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
              pack_v: 7
              pin_v: 2
              opened_at: '2026-11-24T13:05:11.120Z'
              session_proof: proof.example
      responses:
        '200':
          description: 'Access token. Pin: sub is the member, sid is the session.open id, amr pin, lifetime
            15 minutes and never past opened_at plus 16 hours.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
              example:
                access_token: tok_example_access
                token_type: Bearer
                expires_at: '2026-11-24T13:10:11.120Z'
                typ: pin
                session_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d
        '401':
          $ref: '#/components/responses/InvalidSessionProof'
        '403':
          $ref: '#/components/responses/DeviceRevoked'
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/tokens/drain:
    post:
      operationId: createDrainToken
      summary: Get the drain token a revoked device may use
      tags:
      - identity
      x-permission: public
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrainRequest'
            example:
              device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              assertion: assertion.example
      responses:
        '200':
          description: 'Drain token: 5 minutes, valid only for quarantine upload and the wipe-order endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrainToken'
              example:
                access_token: tok_example_drain
                expires_at: '2026-11-24T13:10:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/device-nonces:
    post:
      operationId: createDeviceNonce
      summary: Get a nonce to sign with the key being registered
      tags:
      - identity
      x-permission: public
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Nonce, single use, short lived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceNonce'
              example:
                nonce: nonce_example_01
                expires_at: '2026-11-24T13:10:11.120Z'
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/jwks:
    get:
      operationId: getJwks
      summary: Public signing keys of the tenant realm
      tags:
      - identity
      x-permission: public
      security: []
      responses:
        '200':
          description: 'JWKS: current and next keys, plus retired keys for 45 days.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                - kty: EC
                  crv: P-256
                  x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                  y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                  kid: k-2026-09
                  alg: ES256
                  use: sig
  /v1/vendor-jwks:
    get:
      operationId: getVendorJwks
      summary: Public signing keys of the vendor realm (separate issuer)
      tags:
      - identity
      x-permission: public
      security: []
      responses:
        '200':
          description: JWKS of the vendor realm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                - kty: EC
                  crv: P-256
                  x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                  y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                  kid: v-2026-09
                  alg: ES256
                  use: sig
  /v1/activation-codes:
    post:
      operationId: createActivationCode
      summary: Create a single-use device activation code
      description: 'strong_only: refused in pin and device sessions, and for 24 hours on a binding under
        caution unless approved. Redemption and creation are rate limited per outlet per day.'
      tags:
      - identity
      x-permission: device.activation_code.create
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      - $ref: ../../../common/components.yaml#/components/parameters/ApprovalToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivationCode'
            example:
              outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
              kind: pos
      responses:
        '201':
          description: Code, shown once. A replay returns the same code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCode'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a75
                code: 7QK3M9XD
                outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                kind: pos
                expires_at: '2026-11-24T13:10:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/device-activations:
    post:
      operationId: activateDevice
      summary: Activate a device with an activation code
      description: The owners of the organisation are notified with device name, kind, outlet and key_protection.
        A pending series registration that is unverified does not block registration, only billing.
      tags:
      - identity
      x-permission: public
      x-example-world: device-unregistered
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateDevice'
            example:
              activation_code: 7QK3M9XD
              id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              name: Counter 1
              public_key:
                kty: EC
                crv: P-256
                x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
              key_protection: hardware
              nonce: nonce_example_01
              nonce_signature: sig.example
      responses:
        '201':
          description: Device registered with its signed offline pack, series codes included for billing
            kinds. A replay returns the same device. A public key already bound to an active device is
            refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivation'
              example:
                device:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  kind: pos
                  name: Counter 1
                  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  state: active
                  key_protection: hardware
                  registered_at: '2026-11-24T13:05:11.120Z'
                  last_contact_at: '2026-11-24T13:10:11.120Z'
                  billing_capability: active
                offline_pack:
                  pack_v: 7
                  jws: pack.jws.example
                  issued_at: '2026-11-24T13:05:11.120Z'
                  offline_valid_until: '2026-12-08T13:05:11.120Z'
                  claims:
                    pack_v: 7
                    organisation_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                    device:
                      device_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                      public_key:
                        kty: EC
                        crv: P-256
                        x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                        y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                      outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                      kind: pos
                    members:
                    - member_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64
                      display_name: Asha
                      status: active
                      pin_salt: c2FsdC1leGFtcGxl
                      pin_verifier: kg
                      vbits: 12
                      pin_v: 2
                      permissions:
                      - organisation.read
                      - brand.read
                      - outlet.read
                      - tax_registration.read
                      - settings.read
                      - series.read
                      - link.read
                      - device.read
                      - member.read
                      - role.read
                      - audit.read
                    series:
                    - code: A7K
                      doc_type: tax_invoice
                      state: active
                      tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                    revoked_device_ids: []
                    intent_table_version: 3
                    catalogue_version: 1
                    issued_at: '2026-11-24T13:05:11.120Z'
                    offline_valid_until: '2026-12-08T13:05:11.120Z'
                    idle_lock_minutes: 5
                    identity_public_keys:
                    - kty: EC
                      crv: P-256
                      x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                      y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                      kid: k-2026-09
                      alg: ES256
                      use: sig
                    op_signing_public_key:
                      kty: EC
                      crv: P-256
                      x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                      y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                      kid: o-2026-09
                      alg: ES256
                      use: sig
        '409':
          $ref: '#/components/responses/RegistrationUnverified'
        '422':
          $ref: '#/components/responses/ActivationInvalid'
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/devices:
    post:
      operationId: registerDevice
