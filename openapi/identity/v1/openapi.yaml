          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/ApprovalConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'ES256 tenant-realm access token issued by identity (ADR-0005), sent as Authorization:
        Bearer. One tenant per token. Support tokens are accepted only together with the admin service
        token (Hostry-Service-Token).'
    vendorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 vendor-realm access token (own issuer and audience). Refused by every tenant-facing
        operation.
    serviceAuth:
      type: apiKey
      in: header
      name: Hostry-Service-Token
      description: 60-second ES256 service token (ADR-0005 section 9). Operations under /internal/v1 accept
        it only from the callers in x-service-callers.
  schemas:
    PublicJwk:
      type: object
      description: Public key as a JWK (RFC 7517), P-256 only. Private key material is never sent.
      required:
      - kty
      - crv
      - x
      - y
      properties:
        kty:
          type: string
          description: Key type.
          enum:
          - EC
          example: EC
        crv:
          type: string
          description: Curve.
          enum:
          - P-256
          example: P-256
        x:
          type: string
          description: Base64url X coordinate.
          example: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        y:
          type: string
          description: Base64url Y coordinate.
          example: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
      additionalProperties: false
    Jwk:
      type: object
      description: One published signing key (RFC 7517).
      required:
      - kty
      - crv
      - x
      - y
      - kid
      - alg
      - use
      properties:
        kty:
          type: string
          description: Key type.
          enum:
          - EC
          example: EC
        crv:
          type: string
          description: Curve.
          enum:
          - P-256
          example: P-256
        x:
          type: string
          description: Base64url X coordinate.
          example: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        y:
          type: string
          description: Base64url Y coordinate.
          example: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
        kid:
          type: string
          description: Key id.
          example: k-2026-09
        alg:
          type: string
          description: Algorithm; always ES256.
          enum:
          - ES256
          example: ES256
        use:
          type: string
          description: Key use.
          enum:
          - sig
          example: sig
    Jwks:
      type: object
      description: 'JSON Web Key Set: current and next signing keys, plus retired keys still inside the
        longest offline window.'
      required:
      - keys
      properties:
        keys:
          type: array
          description: Public signing keys.
          items:
            $ref: '#/components/schemas/Jwk'
    TokenPair:
      type: object
      description: Access token and, for strong sessions, a rotating refresh token.
      required:
      - access_token
      - token_type
      - expires_at
      properties:
        access_token:
          type: string
          description: ES256 access token, 15 minutes (ADR-0005 section 2).
          example: tok_example_access
        token_type:
          type: string
          description: Always Bearer.
          enum:
          - Bearer
          example: Bearer
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        refresh_token:
          type: string
          description: Opaque 256-bit refresh token; rotates on every use and reuse revokes the session.
          example: tok_example_refresh
        refresh_expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    AuthMethod:
      type: string
      description: How the principal authenticated (the amr claim).
      enum:
      - otp
      - vendor_code
      - pin
      - device
      example: otp
    Membership:
      type: object
      description: One organisation the signed-in account belongs to.
      required:
      - member_id
      - organisation_id
      properties:
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    CreateOtpChallenge:
      type: object
      description: Request to start an owner or manager OTP sign-in. The response never reveals whether
        the number is known.
      required:
      - mobile_e164
      - device_id
      - device_public_key
      properties:
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_public_key:
          $ref: '#/components/schemas/PublicJwk'
    OtpChallenge:
      type: object
      description: A pending OTP challenge, bound to the requesting device key. Identical for known, unknown
        and rate-blocked numbers.
      required:
      - id
      - expires_at
      - resend_after
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        resend_after:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    CreateSession:
      type: object
      description: Exchange a verified OTP, or a vendor-assisted sign-in code, for a session.
      required:
      - grant_type
      - challenge_id
      - code
      - device_id
      - device_assertion
      properties:
        grant_type:
          type: string
          description: Which secret is being redeemed.
          enum:
          - otp
          - vendor_code
          example: otp
        challenge_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: The 6-digit OTP, or the 8-character vendor-assisted code.
          pattern: ^[0-9A-Z]{6,8}$
          example: '482915'
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_assertion:
          type: string
          description: Compact JWS signed with the device key over the challenge id, a fresh jti and iat
            (IC-04).
          example: assertion.example
    Session:
      type: object
      description: A signed-in strong session.
      required:
      - session_id
      - member_id
      - tokens
      - amr
      - auth_time
      - invitation_accepted
      - memberships
      properties:
        session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        tokens:
          $ref: '#/components/schemas/TokenPair'
        amr:
          $ref: '#/components/schemas/AuthMethod'
        auth_time:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        caution_until:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        invitation_accepted:
          type: boolean
          description: True when this sign-in consumed a pending owner invitation and created the owner
            member.
          example: false
        memberships:
          type: array
          description: All organisations of the account; the token is for member_id only.
          items:
            $ref: '#/components/schemas/Membership'
    RefreshSession:
      type: object
      description: Rotate a refresh token. The proof is signed by the device key, so a copied token is
        useless elsewhere.
      required:
      - refresh_token
      - device_id
      - proof
      properties:
        refresh_token:
          type: string
          description: The current refresh token.
          example: tok_example_refresh
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        proof:
          type: string
          description: Compact JWS over the refresh-token hash, a fresh jti and iat.
          example: proof.example
    SwitchMember:
      type: object
      description: Request a token for another organisation of the same account (a new token, membership
        re-read).
      required:
      - member_id
      properties:
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    DeviceGrant:
      type: object
      description: 'Device token request for unattended devices (KDS, hub): the device role applies.'
      required:
      - grant_type
      - device_id
      - assertion
      properties:
        grant_type:
          type: string
          description: Constant.
          enum:
          - device
          example: device
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        assertion:
          type: string
          description: Device-key assertion over a fresh jti and iat.
          example: assertion.example
    PinGrant:
      type: object
      description: Online token for a PIN session. Carries the device assertion and the fields of the
        session.open record with its session proof (ADR-0005 A2.1).
      required:
      - grant_type
      - device_id
      - assertion
      - session_id
      - member_id
      - pack_v
      - pin_v
      - opened_at
      - session_proof
      properties:
        grant_type:
          type: string
          description: Constant.
          enum:
          - pin
          example: pin
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        assertion:
          type: string
          description: Device-key assertion signed over these fields plus a fresh jti and iat.
          example: assertion.example
        session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        pack_v:
          type: integer
          description: Offline-pack version the session was opened under.
          minimum: 1
          example: 7
        pin_v:
          type: integer
          description: The member PIN version; must be current.
          minimum: 1
          example: 2
        opened_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        session_proof:
          type: string
          description: HMAC session proof made at PIN entry; verified with the member proof key.
          example: proof.example
    DeviceTokenRequest:
      description: 'Device token request: a device grant, or a PIN grant that also carries the session
        proof.'
      oneOf:
      - $ref: '#/components/schemas/DeviceGrant'
      - $ref: '#/components/schemas/PinGrant'
      discriminator:
        propertyName: grant_type
        mapping:
          device: '#/components/schemas/DeviceGrant'
          pin: '#/components/schemas/PinGrant'
    DeviceToken:
      type: object
      description: Access token for a device or PIN session. A pin session has no refresh token; renew
        by repeating the request.
      required:
      - access_token
      - token_type
      - expires_at
      - typ
      properties:
        access_token:
          type: string
          description: ES256 access token, 15 minutes and never past opened_at plus 16 hours for pin.
          example: tok_example_access
        token_type:
          type: string
          description: Always Bearer.
          enum:
          - Bearer
          example: Bearer
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        typ:
          type: string
          description: Token type claim.
          enum:
          - device
          - pin
          example: pin
        session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    DrainRequest:
      type: object
      description: Drain token request from a revoked device.
      required:
      - device_id
      - assertion
      properties:
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        assertion:
          type: string
          description: Device-key assertion over a fresh jti and iat.
          example: assertion.example
    DrainToken:
      type: object
      description: 'The only credential a revoked device receives: valid 5 minutes for quarantine upload
        and the wipe-order endpoint.'
      required:
      - access_token
      - expires_at
      properties:
        access_token:
          type: string
          description: ES256 drain token, not refreshable.
          example: tok_example_drain
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    DeviceNonce:
      type: object
      description: Server nonce a device signs with the key it is registering (IC-13).
      required:
      - nonce
      - expires_at
      properties:
        nonce:
          type: string
          description: Random value, single use.
          example: nonce_example_01
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    DeviceKind:
      type: string
      description: Device kind (ADR-0005 section 4).
      enum:
      - personal
      - pos
      - waiter
      - kds
      - hub
      example: pos
    DeviceState:
      type: string
      description: 'Device lifecycle state: active, then revoked, then drained, then wiped; or revoked,
        then lost.'
      enum:
      - active
      - revoked
      - drained
      - wiped
      - lost
      example: active
    KeyProtection:
      type: string
      description: Protection tier of the device key, reported by the device at registration. Information,
        not proof, and no permission depends on it (ADR-0005 A1).
      enum:
      - hardware
      - os-software
      example: hardware
    BillingCapability:
      type: string
      description: 'Whether the device may finalise legal documents: active series, dormant series (waiter),
        or none.'
      enum:
      - none
      - dormant
      - active
      example: active
    Device:
      type: object
      description: A registered device. Keys, PIN data and pack contents are never part of this resource.
      required:
      - id
      - kind
      - name
      - outlet_id
      - state
      - key_protection
      - registered_at
      - billing_capability
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/DeviceKind'
        name:
          type: string
          description: Display name.
          maxLength: 80
          example: Counter 1
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        state:
          $ref: '#/components/schemas/DeviceState'
        key_protection:
          $ref: '#/components/schemas/KeyProtection'
        registered_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        last_contact_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        billing_capability:
          $ref: '#/components/schemas/BillingCapability'
      additionalProperties: false
    DevicePage:
      type: object
      description: A page of devices.
      required:
      - items
      properties:
        items:
          type: array
          description: Devices on this page.
          items:
            $ref: '#/components/schemas/Device'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    RegisterDevice:
      type: object
      description: Register a device by a signed-in member holding device.register. Kind and outlet are
        the registering member's choice and are never taken from a later client claim.
      required:
      - id
      - kind
      - name
      - outlet_id
      - public_key
      - key_protection
      - nonce
      - nonce_signature
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/DeviceKind'
        name:
          type: string
          description: Display name.
          maxLength: 80
          example: Counter 1
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        public_key:
          $ref: '#/components/schemas/PublicJwk'
        key_protection:
          $ref: '#/components/schemas/KeyProtection'
        nonce:
          type: string
          description: Nonce from createDeviceNonce.
          example: nonce_example_01
        nonce_signature:
          type: string
          description: Signature of the nonce with the submitted key (proof of possession).
          example: sig.example
    CreateActivationCode:
      type: object
      description: Create a single-use activation code bound to an outlet and a device kind.
      required:
      - outlet_id
      - kind
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/DeviceKind'
    ActivationCode:
      type: object
      description: An activation code; the code itself is shown once.
      required:
      - id
      - code
      - outlet_id
      - kind
      - expires_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: 8 characters from a 32-symbol alphabet (40 bits), 10 minutes, single use.
          pattern: ^[0-9A-HJKMNP-TV-Z]{8}$
          example: 7QK3M9XD
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/DeviceKind'
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    ActivateDevice:
      type: object
      description: Activate a new device with a code. No OTP is spent and the manager session never touches
        the device.
      required:
      - activation_code
      - id
      - name
      - public_key
      - key_protection
      - nonce
      - nonce_signature
      properties:
        activation_code:
          type: string
          description: The code from createActivationCode.
          pattern: ^[0-9A-HJKMNP-TV-Z]{8}$
          example: 7QK3M9XD
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Display name.
          maxLength: 80
          example: Counter 1
        public_key:
          $ref: '#/components/schemas/PublicJwk'
        key_protection:
          $ref: '#/components/schemas/KeyProtection'
        nonce:
          type: string
          description: Nonce from createDeviceNonce.
          example: nonce_example_01
        nonce_signature:
          type: string
          description: Signature of the nonce with the submitted key.
          example: sig.example
    PackMember:
      type: object
      description: A member usable at the device outlet. Verifier fields appear only for device kinds
        that offer PIN login.
      required:
      - member_id
      - display_name
      - status
      - permissions
      properties:
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        display_name:
          type: string
          description: Display name; no phone number or account id.
          example: Asha
        status:
          type: string
          description: Member state.
          enum:
          - active
          - suspended
          example: active
        pin_salt:
          type: string
          description: Base64 per-member salt.
          example: c2FsdC1leGFtcGxl
        pin_verifier:
          type: string
          description: Base64 of the first vbits bits of the HKDF verifier (ADR-0005 A2.6).
          example: kg
        vbits:
          type: integer
          description: Number of verifier bits carried (default 12).
          minimum: 8
          maximum: 256
          example: 12
        pin_v:
          type: integer
          description: PIN version.
          minimum: 1
          example: 2
        permissions:
          type: array
          description: Effective permission strings at this outlet.
          items:
            type: string
            description: Permission string.
            example: order.create
    PackSeries:
      type: object
      description: A document-series code given to the device (ADR-0003 section 1a).
      required:
      - code
      - doc_type
      - state
      - tax_registration_id
      properties:
        code:
          type: string
          description: Series code, unique per tax registration.
          example: A7K
        doc_type:
          type: string
          description: Document type.
          enum:
          - tax_invoice
          - bill_of_supply
          - plain_bill
          - credit_note
          example: tax_invoice
        state:
          type: string
          description: Series state on this device.
          enum:
          - active
          - dormant
          example: active
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    OfflinePackClaims:
      type: object
      description: Payload of the signed offline pack (ADR-0005 section 6, A2.6).
      required:
      - pack_v
      - organisation_id
      - device
      - members
      - series
      - revoked_device_ids
      - intent_table_version
      - catalogue_version
      - issued_at
      - offline_valid_until
      - idle_lock_minutes
      - identity_public_keys
      - op_signing_public_key
      properties:
        pack_v:
          type: integer
          description: Pack version.
          minimum: 1
          example: 7
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device:
          type: object
          description: The device's own credential.
          required:
          - device_id
          - public_key
          - outlet_id
          - kind
          properties:
            device_id:
              $ref: ../../../common/components.yaml#/components/schemas/Id
            public_key:
              $ref: '#/components/schemas/PublicJwk'
            outlet_id:
              $ref: ../../../common/components.yaml#/components/schemas/Id
            kind:
              $ref: '#/components/schemas/DeviceKind'
        members:
          type: array
          description: Members allowed at the outlet.
          items:
            $ref: '#/components/schemas/PackMember'
        series:
          type: array
          description: Series codes given to the device.
          items:
            $ref: '#/components/schemas/PackSeries'
        revoked_device_ids:
          type: array
          description: Revoked device ids for the outlet.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
        intent_table_version:
          type: integer
          description: Version of the signed intent table.
          minimum: 1
          example: 3
        catalogue_version:
          type: integer
          description: Permission catalogue version.
          minimum: 1
          example: 1
        issued_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        offline_valid_until:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        idle_lock_minutes:
          type: integer
          description: Idle lock for shared devices.
          minimum: 1
          example: 5
        identity_public_keys:
          type: array
          description: Current and next identity public keys.
          items:
            $ref: '#/components/schemas/Jwk'
        op_signing_public_key:
          $ref: '#/components/schemas/Jwk'
    OfflinePack:
      type: object
      description: A signed offline pack. Clients verify jws and use only its payload.
      required:
      - pack_v
      - jws
      - claims
      - issued_at
      - offline_valid_until
      properties:
        pack_v:
          type: integer
          description: Pack version.
          minimum: 1
          example: 7
        jws:
          type: string
          description: Compact ES256 JWS whose payload is OfflinePackClaims.
          example: pack.jws.example
        claims:
          $ref: '#/components/schemas/OfflinePackClaims'
        issued_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        offline_valid_until:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    DeviceActivation:
      type: object
      description: A newly registered device with its first offline pack.
      required:
      - device
      - offline_pack
      properties:
        device:
          $ref: '#/components/schemas/Device'
        offline_pack:
          $ref: '#/components/schemas/OfflinePack'
    RevokeDevice:
      type: object
      description: Revoke a device. Terminal; the device keeps only the drain path.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Why the device is revoked.
          enum:
          - lost
          - stolen
          - retired
          - other
          example: lost
    StreamSequence:
      type: object
      description: Highest sequence of one device stream.
      required:
      - stream
      - seq
      properties:
        stream:
          type: string
          description: Stream name.
          example: device-ops
        seq:
          type: integer
          description: Sequence number.
          minimum: 0
          example: 1842
    WipeOrder:
      type: object
      description: Wipe order, signed by identity. The device verifies it covers every local operation
        before wiping.
      required:
      - device_id
      - drained_through
      - issued_at
      - jws
      properties:
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        drained_through:
          type: array
          description: Sequence the device is drained through, per stream.
          items:
            $ref: '#/components/schemas/StreamSequence'
        issued_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        jws:
          type: string
          description: Compact JWS signed with the pack-signing key.
          example: wipe.jws.example
    RecordDrain:
      type: object
      description: Drain report from the sync gateway.
      required:
      - drained_through
      properties:
        drained_through:
          type: array
          description: Sequence stored per device stream.
          items:
            $ref: '#/components/schemas/StreamSequence'
    AssignmentInput:
      type: object
      description: Assign a role at a scope.
      required:
      - id
      - role_id
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        role_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_ids:
          type: array
          description: Outlets the assignment covers; absent or empty means the whole organisation.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
    RoleAssignment:
      type: object
      description: A member-role-scope assignment.
      required:
      - id
      - role_id
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        role_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_ids:
          type: array
          description: Outlets the assignment covers; absent means the whole organisation.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
      additionalProperties: false
    Member:
      type: object
      description: A staff member. Mobile number only in masked form; email and ID documents never appear.
      required:
      - id
      - display_name
      - status
      - has_pin
      - role_assignments
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        display_name:
          type: string
          description: Display name.
          maxLength: 80
          example: Asha
        status:
          type: string
          description: Member state.
          enum:
          - invited
          - active
          - suspended
          example: active
        mobile_masked:
          $ref: ../../../common/components.yaml#/components/schemas/MobileMasked
        has_pin:
          type: boolean
          description: Whether a PIN is set.
          example: true
        role_assignments:
          type: array
          description: Role assignments.
          items:
            $ref: '#/components/schemas/RoleAssignment'
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    MemberPage:
      type: object
      description: A page of members.
      required:
      - items
      properties:
        items:
          type: array
          description: Members on this page.
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateMember:
      type: object
      description: Add a member. With a mobile number the person is invited; the response is identical
        whether or not the number has an account.
      required:
      - id
      - display_name
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        display_name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 80
          example: Asha
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
        role_assignments:
          type: array
          description: Initial assignments.
          items:
            $ref: '#/components/schemas/AssignmentInput'
    UpdateMember:
      type: object
      description: Change a member.
      properties:
        display_name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 80
          example: Asha K
        status:
          type: string
          description: Member state.
          enum:
          - active
          - suspended
          example: suspended
    PinResetAuthorisation:
      type: object
      description: Authorisation for a member to choose a new PIN on a device. The authoriser never sees
        or chooses the PIN.
      required:
      - id
      - expires_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    SetPin:
      type: object
      description: Set or change a PIN. The body is excluded from every log and trace.
      required:
      - device_id
      - pin
      properties:
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        pin:
          type: string
          description: 4 to 6 digits; 6 for members holding sensitive permissions; trivial PINs refused.
          pattern: ^[0-9]{4,6}$
          example: '482915'
        pin_reset_authorisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    PinSet:
      type: object
      description: Result of setting a PIN.
      required:
      - pin_v
      properties:
        pin_v:
          type: integer
          description: New PIN version.
          minimum: 1
          example: 3
    PermissionKey:
      type: string
      description: Permission string, <resource>.<action>[.<qualifier>].
      pattern: ^[a-z][a-z_]*(\.[a-z_]+)+$
      example: order.create
    Role:
      type: object
      description: 'A role: a set of permissions, nothing more.'
      required:
      - id
      - name
      - permissions
      - built_in
      - created_at
      - updated_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Role name.
          minLength: 1
          maxLength: 60
          example: Cashier
        permissions:
          type: array
          description: Permission strings.
          items:
            $ref: '#/components/schemas/PermissionKey'
        built_in:
          type: boolean
          description: The built-in owner role cannot be edited or removed from its last holder.
          example: false
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    RolePage:
      type: object
      description: A page of roles.
      required:
      - items
      properties:
        items:
          type: array
          description: Roles on this page.
          items:
            $ref: '#/components/schemas/Role'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    RoleInput:
      type: object
      description: Create or replace a role. The actor must hold every permission before and after the
        edit (G1).
      required:
      - name
      - permissions
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Role name.
          minLength: 1
          maxLength: 60
          example: Cashier
        permissions:
          type: array
          description: Permission strings.
          items:
            $ref: '#/components/schemas/PermissionKey'
    Permission:
      type: object
      description: One catalogue entry (the catalogue lives in common/permissions.yaml).
      required:
      - key
      - service
      - description_key
      - sensitive
      - strong_only
      - owner_grant
      - support_viewable
      - support_actable
      properties:
        key:
          $ref: '#/components/schemas/PermissionKey'
        service:
          type: string
          description: Owning service.
          example: tenancy
        description_key:
          type: string
          description: i18n key of the description.
          example: perm.order.create
        sensitive:
          type: boolean
          description: Reason and audit record required.
          example: false
        strong_only:
          type: boolean
          description: Never exercisable in a pin or device session.
          example: false
        owner_grant:
          type: boolean
          description: Roles containing it are managed by owners only.
          example: false
        support_viewable:
          type: boolean
          description: Readable in a support session (view mode).
          example: false
        support_actable:
          type: boolean
          description: Writable in a support session in act mode; no permission carries it in Phase 1.
          example: false
    PermissionList:
      type: object
      description: The permission catalogue.
      required:
      - items
      - catalogue_version
      properties:
        items:
          type: array
          description: Catalogue entries.
          items:
            $ref: '#/components/schemas/Permission'
        catalogue_version:
          type: integer
          description: Catalogue version.
          minimum: 1
          example: 1
    OwnerRoleAssignment:
      type: object
      description: Assign the built-in owner role (step-up, owners only).
      required:
      - id
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    TenantAuditEntry:
      type: object
      description: An entry in the organisation's own audit log, including vendor and support access.
        No secrets or personal data.
      required:
      - id
      - occurred_at
      - actor_kind
      - actor_label
      - action
      - outcome
      - show_to_owner
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        occurred_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        actor_kind:
          type: string
          description: Who acted.
          enum:
          - member
          - device
          - vendor
          - system
          example: vendor
        actor_label:
          type: string
          description: Display label; "Hostry support" for vendor actors.
          example: Hostry support
        action:
          type: string
          description: Stable action key.
          example: support.session.started
        target_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outcome:
          type: string
          description: Result.
          enum:
          - succeeded
          - refused
          - failed
          example: succeeded
        show_to_owner:
          type: boolean
          description: Marker for the Phase 2 owner screens and Phase 3 delivery (ADR-0013 V7).
          example: true
        support_session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        read_summary:
          type: string
          description: 'Summary of what a support read returned, for example "devices: 4".'
          example: 'devices: 4'
    TenantAuditPage:
      type: object
      description: A page of audit entries, newest first.
      required:
      - items
      properties:
        items:
          type: array
          description: Entries on this page.
          items:
            $ref: '#/components/schemas/TenantAuditEntry'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateApprovalRequest:
      type: object
      description: File a refused operation for approval from another binding or owner (ADR-0005 A2.2).
        The approver sees what will happen, built from the stored operation, never from requester text.
      required:
      - operation_id
      - request_body
      properties:
        operation_id:
          type: string
          description: operationId of the refused operation.
          example: createMember
        request_body:
          type: object
          description: The exact body that will be repeated with the approval token.
          additionalProperties: true
    ApprovalRequest:
      type: object
      description: A pending, approved, rejected or lapsed caution approval. The approval token is returned
        once, to the requester, when approved.
      required:
      - id
      - operation_id
      - body_hash
      - state
      - created_at
      - expires_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        operation_id:
          type: string
          description: operationId of the refused operation.
          example: createMember
        body_hash:
          type: string
          description: 'Hash the approval token is bound to (claim bh): "sha256:" followed by the 64 lower-case
            hex digits of the SHA-256 over the exact bytes of the request body as sent, with no parsing,
            re-serialisation or whitespace change. For this filing request those are the bytes of the
            request_body member exactly as received; the repeated operation must send a body that is
            byte-identical to them, and the verifier hashes the bytes it received. An empty body hashes
            the empty string. go-auth provides the helper that computes and checks it.'
          pattern: ^sha256:[0-9a-f]{64}$
          example: sha256:cf03a846706f29a88ba61a212f79e7c224142fdd5df92fc1d7ed8bb1283fb8c8
        state:
          type: string
          description: Request state.
          enum:
          - pending
          - approved
          - rejected
          - lapsed
          - used
          example: pending
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        approval_token:
          type: string
          description: 'ES256 approval token, 5 minutes, single use; present once on approval. Claims:
            typ approval, sid, op (operationId) and bh (hash of the request body). Sent on the repeated
            request in the Hostry-Approval header.'
          example: tok_example_approval
    ApprovalRequestPage:
      type: object
      description: A page of approval requests.
      required:
      - items
      properties:
        items:
          type: array
          description: Requests on this page.
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    DecideApproval:
      type: object
      description: Approve or reject a request.
      required:
      - decision
      properties:
        decision:
          type: string
          description: Decision.
          enum:
          - approve
          - reject
          example: approve
    Binding:
      type: object
      description: Account-to-device binding. Under caution for 24 hours from creation.
      required:
      - id
      - device_id
      - created_at
      - state
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        caution_until:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        state:
          type: string
          description: Binding state.
          enum:
          - active
          - rejected
          - revoked
          example: active
    BindingPage:
      type: object
      description: A page of bindings.
      required:
      - items
      properties:
        items:
          type: array
          description: Bindings on this page.
          items:
            $ref: '#/components/schemas/Binding'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    RecoveryCancellation:
      type: object
      description: Cancel a pending owner recovery.
      properties:
        reason:
          type: string
          description: Optional note.
          maxLength: 200
          example: Not requested by me.
    OwnerRecovery:
      type: object
      description: An owner recovery in its 24-hour delay.
      required:
      - id
      - state
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        state:
          type: string
          description: Recovery state.
          enum:
          - pending
          - cancelled
          - completed
          example: cancelled
        completes_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    Revocation:
      type: object
      description: A device or session revocation (tenant-id-only feed, no personal data).
      required:
      - id
      - subject_type
      - subject_id
      - organisation_id
      - revoked_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        subject_type:
          type: string
          description: What was revoked.
          enum:
          - device
          - session
          example: device
        subject_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        revoked_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    RevocationPage:
      type: object
      description: A page of revocations in order.
      required:
      - items
      properties:
        items:
          type: array
          description: Revocations on this page.
          items:
            $ref: '#/components/schemas/Revocation'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    ProofVerification:
      type: object
      description: Ask identity to verify a session or approval proof (sync gateway, ADR-0005 section
        7 questions 4 and 5).
      required:
      - kind
      - device_id
      - member_id
      - pack_v
      - pin_v
      - proof
      properties:
        kind:
          type: string
          description: Proof kind.
          enum:
          - session
          - approval
          example: session
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        pack_v:
          type: integer
          description: Pack version.
          minimum: 1
          example: 7
        pin_v:
          type: integer
          description: PIN version of the proof.
          minimum: 1
          example: 2
        opened_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        proof:
          type: string
          description: The proof to verify.
          example: proof.example
        action_hash:
          type: string
          description: Action hash, for approval proofs.
          example: sha256:cf03a846706f29a88ba61a212f79e7c224142fdd5df92fc1d7ed8bb1283fb8c8
    ProofVerdict:
      type: object
      description: Verdict of a proof check. Never reveals key material.
      required:
      - valid
      - label
      properties:
        valid:
          type: boolean
          description: Whether the proof verifies for that pin_v.
          example: true
        label:
          type: string
          description: Attribution label (computed by the cloud).
          enum:
          - verified
          - unverified
          example: verified
    PackHistoryCheck:
      type: object
      description: Was the member and/or series code issued to the device in the given pack?
      required:
      - device_id
      - pack_v
      properties:
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        pack_v:
          type: integer
          description: Pack version.
          minimum: 1
          example: 7
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        series_code:
          type: string
          description: Series code to look up.
          example: A7K
    PackHistoryVerdict:
      type: object
      description: Result of a pack-history check.
      required:
      - pack_known
      - member_in_pack
      - series_issued
      properties:
        pack_known:
          type: boolean
          description: Identity holds this pack version for the device.
          example: true
        member_in_pack:
          type: boolean
          description: The member was listed in that pack.
          example: true
        series_issued:
          type: boolean
          description: The series code was issued to the device in any pack.
          example: true
    VendorRole:
      type: string
      description: Vendor role (a set of admin.* permissions; checks are on permissions).
      enum:
      - platform_admin
      - onboarding
      - support
      - billing
      example: support
    VendorSignIn:
      type: object
      description: Vendor sign-in. Failures (wrong password, unknown email, wrong or replayed TOTP, lockout)
        are all the same 401.
      required:
      - email
      - password
      - totp_code
      properties:
        email:
          type: string
          description: Vendor user email.
          format: email
          example: staff@example.invalid
        password:
          type: string
          description: Password; never logged.
          minLength: 1
          maxLength: 256
          example: correct-horse-battery-staple
        totp_code:
          type: string
          description: Current TOTP code; accepted once.
          pattern: ^[0-9]{6}$
          example: '123456'
    VendorPrincipal:
      type: object
      description: The signed-in vendor user and what the role allows.
      required:
      - id
      - display_name
      - role
      - permissions
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        display_name:
          type: string
          description: Display name.
          example: Priya
        role:
          $ref: '#/components/schemas/VendorRole'
        permissions:
          type: array
          description: admin.* permission strings held.
          items:
            type: string
            description: Permission string.
            example: admin.org.read
    VendorSession:
      type: object
      description: Vendor-realm credential. Held server-side by the admin service and never sent to a
        browser.
      required:
      - access_token
      - expires_at
      - renewal_handle
      - session_ends_at
      - user
      properties:
        access_token:
          type: string
          description: ES256 vendor-realm access token.
          example: tok_example_vendor
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        renewal_handle:
          type: string
          description: Opaque handle used to renew the token.
          example: renew_example
        session_ends_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        user:
          $ref: '#/components/schemas/VendorPrincipal'
    VendorSessionRenewal:
      type: object
      description: Renew a vendor access token.
      required:
      - renewal_handle
      properties:
        renewal_handle:
          type: string
          description: The current renewal handle.
          example: renew_example
    BeginVendorSetup:
      type: object
      description: Start account setup from a one-time link (24 hours, single use).
      required:
      - setup_token
      properties:
        setup_token:
          type: string
          description: Token from the setup link.
          example: setup_example
    VendorSetupChallenge:
      type: object
      description: Material for TOTP enrolment.
      required:
      - email
      - totp_provisioning_uri
      - expires_at
      properties:
        email:
          type: string
          description: Account email.
          format: email
          example: staff@example.invalid
        totp_provisioning_uri:
          type: string
          description: otpauth URI for the authenticator app. Contains the TOTP secret; shown once.
          example: otpauth://totp/Hostry:staff@example.invalid?secret=EXAMPLEEXAMPLE234&issuer=Hostry
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    CompleteVendorSetup:
      type: object
      description: 'Finish setup: choose a password (at least 12 characters, no composition rules, not
        the account email) and confirm TOTP with one code.'
      required:
      - setup_token
      - password
      - totp_code
      properties:
        setup_token:
          type: string
          description: Token from the setup link.
          example: setup_example
        password:
          type: string
          description: New password.
          minLength: 12
          maxLength: 256
          example: example-passphrase-twelve
        totp_code:
          type: string
          description: One TOTP code from the new enrolment.
          pattern: ^[0-9]{6}$
          example: '123456'
    VendorUserStatus:
      type: string
      description: Account state. setup_pending until password and TOTP are both set.
      enum:
      - setup_pending
      - active
      - deactivated
      example: active
    VendorUser:
      type: object
      description: A vendor staff account. Never holds password, TOTP secret or one-time codes.
      required:
      - id
      - email
      - display_name
      - role
      - status
      - totp_enrolled
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        email:
          type: string
          description: Account email.
          format: email
          example: staff@example.invalid
        display_name:
          type: string
          description: Display name.
          example: Priya
        role:
          $ref: '#/components/schemas/VendorRole'
        status:
          $ref: '#/components/schemas/VendorUserStatus'
        totp_enrolled:
          type: boolean
          description: Whether TOTP is enrolled.
          example: true
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    VendorUserPage:
      type: object
      description: A page of vendor users.
      required:
      - items
      properties:
        items:
          type: array
          description: Users on this page.
          items:
            $ref: '#/components/schemas/VendorUser'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateVendorUser:
      type: object
      description: Create a vendor user. A one-time setup link goes out through the email sender interface;
        it is never returned.
      required:
      - id
      - email
      - display_name
      - role
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        email:
          type: string
          description: Account email.
          format: email
          example: staff@example.invalid
        display_name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 80
          example: Priya
        role:
          $ref: '#/components/schemas/VendorRole'
    UpdateVendorUser:
      type: object
      description: Change role or state. Deactivation ends that user's admin and support sessions; the
        last active platform_admin cannot be deactivated or demoted, and nobody can deactivate themselves.
      properties:
        role:
          $ref: '#/components/schemas/VendorRole'
        status:
          type: string
          description: Set to deactivated or active.
          enum:
          - active
          - deactivated
          example: deactivated
    VendorAuditEntry:
      type: object
      description: Append-only vendor audit entry. Holds no password, TOTP, OTP, token or full phone number.
      required:
      - id
      - occurred_at
      - actor_vendor_user_id
      - action
      - result
      - request_id
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        occurred_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        actor_vendor_user_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        action:
          type: string
          description: Stable action key.
          example: vendor.device.revoked
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        target_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        result:
          type: string
          description: Result.
          enum:
          - succeeded
          - refused
          - failed
          example: succeeded
        request_id:
          type: string
          description: Request id.
          example: req_0190a1b2c3d4
        source_address:
          type: string
          description: Source address of the staff member.
          example: 203.0.113.7
        support_session_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        read_summary:
          type: string
          description: 'For support reads: what was read.'
          example: 'devices: 4'
      additionalProperties: false
    VendorAuditPage:
      type: object
      description: A page of audit entries, newest first.
      required:
      - items
      properties:
        items:
          type: array
          description: Entries on this page.
          items:
            $ref: '#/components/schemas/VendorAuditEntry'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    OwnerLookup:
      type: object
      description: Exact owner-mobile lookup. Prefixes never match.
      required:
      - mobile_e164
      properties:
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
    OwnerLookupResult:
      type: object
      description: Organisation ids with a pending invitation or an owner member for that exact number.
      required:
      - organisation_ids
      properties:
        organisation_ids:
          type: array
          description: Matching organisation ids.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
          maxItems: 50
      additionalProperties: false
    InvitationStatus:
      type: string
      description: Owner invitation state.
      enum:
      - pending
      - accepted
      - expired
      - cancelled
      example: pending
    OwnerStatus:
      type: string
      description: 'Owner state of an organisation: none (no invitation and no owner member), or the state
        of the latest owner invitation. An organisation whose owner member exists reports accepted (the
        invitation was consumed); there is no separate owner value.'
      enum:
      - none
      - pending
      - accepted
      - expired
      - cancelled
      example: pending
    OwnerStatusItem:
      type: object
      description: Owner state for one organisation.
      required:
      - organisation_id
      - owner_status
      properties:
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        owner_status:
          $ref: '#/components/schemas/OwnerStatus'
        owner_accepted_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    OwnerStatusList:
      type: object
      description: Owner states for the requested organisations.
      required:
      - items
      properties:
        items:
          type: array
          description: One item per requested organisation.
          items:
            $ref: '#/components/schemas/OwnerStatusItem'
      additionalProperties: false
    CreateOwnerInvitation:
      type: object
      description: Create an owner invitation for one organisation and mobile number. A repeat for the
        same pair returns the existing pending invitation. Refused once the organisation has an owner
        member.
      required:
      - mobile_e164
      - owner_name
      properties:
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
        owner_name:
          type: string
          description: Owner display name.
          minLength: 1
          maxLength: 80
          example: Asha
    OwnerInvitation:
      type: object
      description: A pending record that lets one number request an OTP and become the owner member. Not
        an account, not a login.
      required:
      - id
      - organisation_id
      - status
      - mobile_masked
      - expires_at
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        status:
          $ref: '#/components/schemas/InvitationStatus'
        mobile_masked:
          $ref: ../../../common/components.yaml#/components/schemas/MobileMasked
        owner_name:
          type: string
          description: Owner display name.
          example: Asha
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        accepted_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    OwnerInvitationList:
      type: object
      description: Invitations of one organisation, newest first.
      required:
      - items
      properties:
        items:
          type: array
          description: Invitations.
          items:
            $ref: '#/components/schemas/OwnerInvitation'
      additionalProperties: false
    VendorDevice:
      type: object
      description: 'Closed device view for vendor staff: no key, PIN data or pack contents.'
      required:
      - id
      - kind
      - outlet_id
      - state
      - registered_at
      - billing_capable
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/DeviceKind'
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        state:
          $ref: '#/components/schemas/DeviceState'
        registered_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        last_contact_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        billing_capable:
          type: boolean
          description: Whether the device may finalise legal documents.
          example: true
        key_protection:
          $ref: '#/components/schemas/KeyProtection'
      additionalProperties: false
    VendorDevicePage:
      type: object
      description: A page of devices of one organisation.
      required:
      - items
      properties:
        items:
          type: array
          description: Devices on this page.
          items:
            $ref: '#/components/schemas/VendorDevice'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    RequesterVerification:
      type: string
      description: How the requester was verified.
      enum:
      - callback_to_registered_number
      - owner_request_in_app
      - other
      example: callback_to_registered_number
    VendorRevoke:
      type: object
      description: Revoke one active device on a verified request. Terminal; no un-revoke and no wipe.
      required:
      - ticket_reference
      - reason
      - verification_method
      - confirm
      properties:
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        verification_method:
          $ref: '#/components/schemas/RequesterVerification'
        verification_note:
          type: string
          description: Required when the method is other.
          maxLength: 500
          example: Verified by the accountant on the registered number.
        confirm:
          type: boolean
          const: true
          description: 'Must be true: the one confirmation.'
        approval_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    VendorRevokeResult:
      type: object
      description: Outcome of a vendor revoke.
      required:
      - device
      - outcome
      - changed
      properties:
        device:
          $ref: '#/components/schemas/VendorDevice'
        outcome:
          type: string
          description: 'revoked: state changed now. already_revoked: no change (also for drained, wiped
            or lost devices); no wipe order was issued or hastened.'
          enum:
          - revoked
          - already_revoked
          example: revoked
        changed:
          type: boolean
          description: Whether this call changed state.
          example: true
      additionalProperties: false
    StartSupportSession:
      type: object
      description: Start a read-only support session for one organisation.
      required:
      - organisation_id
      - ticket_reference
      - reason
      properties:
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        duration_minutes:
          type: integer
          description: Session length; default 30, maximum 60.
          minimum: 1
          maximum: 60
          example: 30
        mode:
          type: string
          description: view is the only mode in Phase 1; act returns 422 mode_not_supported.
          enum:
          - view
          - act
          example: view
    SupportSession:
      type: object
      description: A support session record.
      required:
      - id
      - organisation_id
      - vendor_user_id
      - mode
      - status
      - ticket_reference
      - started_at
      - ends_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        vendor_user_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        mode:
          type: string
          description: Mode.
          enum:
          - view
          example: view
        status:
          type: string
          description: Session state.
          enum:
          - active
          - ended
          - expired
          example: active
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        started_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        ends_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        ended_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    SupportToken:
      type: object
      description: 'Tenant-realm token of type support for one organisation: realm tenant, support_viewable
        permissions only, 15 minutes, never past the session end. Held server-side by the admin service.'
      required:
      - access_token
      - expires_at
      properties:
        access_token:
          type: string
          description: 'ES256 support token. Claims: realm tenant, typ support, tid (the one organisation),
            sid (support session id), mode (view in Phase 1; act later), ticket (the ticket reference),
            grants limited to support_viewable permissions, exp.'
          example: tok_example_support
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    SupportSessionStarted:
      type: object
      description: A started support session and its first token.
      required:
      - session
      - token
      properties:
        session:
          $ref: '#/components/schemas/SupportSession'
        token:
          $ref: '#/components/schemas/SupportToken'
    ApprovalKind:
      type: string
      description: 'What the two-person approval authorises. org_suspend, org_reinstate and org_close
        are executed by tenancy and tax_rule_set_publish by billing, with a vendor approval grant from
        the approval decision (ADR-0014 A1.3); they lapse after 24 hours, and tax_rule_set_publish
        concerns no organisation.'
      enum:
      - sign_in_code
      - owner_recovery
      - device_revoke_over_quota
      - org_suspend
      - org_reinstate
      - org_close
      - tax_rule_set_publish
      example: sign_in_code
    CreateVendorApproval:
      type: object
      description: File a request that needs a second vendor user (ADR-0005 A2.3). With fewer than two
        eligible users it is refused (second_approver_unavailable); no single-person override exists.
      required:
      - kind
      - ticket_reference
      - reason
      - verification_method
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        subject_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        rule_set_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        rule_set_content_hash:
          type: string
          description: Content hash of the signed tax rule set (tax_rule_set_publish only), part of the
            subject hash the grant binds.
          pattern: ^sha256:[0-9a-f]{64}$
          example: sha256:cf03a846706f29a88ba61a212f79e7c224142fdd5df92fc1d7ed8bb1283fb8c8
        effective_date:
          type: string
          format: date
          description: Business date the rule set takes effect (tax_rule_set_publish only), part of the
            subject hash.
          example: '2026-12-01'
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
        new_mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        verification_method:
          $ref: '#/components/schemas/RequesterVerification'
    VendorApproval:
      type: object
      description: A two-person approval record. Phone numbers appear only masked.
      required:
      - id
      - kind
      - state
      - requested_by
      - ticket_reference
      - verification_method
      - created_at
      - expires_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        state:
          type: string
          description: Approval state.
          enum:
          - pending
          - approved
          - rejected
          - expired
          - cancelled
          - completed
          example: pending
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        subject_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        mobile_masked:
          $ref: ../../../common/components.yaml#/components/schemas/MobileMasked
        requested_by:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        approved_by:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        verification_method:
          $ref: '#/components/schemas/RequesterVerification'
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        completes_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    VendorApprovalPage:
      type: object
      description: A page of approvals.
      required:
      - items
      properties:
        items:
          type: array
          description: Approvals on this page.
          items:
            $ref: '#/components/schemas/VendorApproval'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    ApproveVendorApproval:
      type: object
      description: Approve with a fresh TOTP. The approver must be a different vendor user holding the
        kind's approve permission, on an account at least 7 days old.
      required:
      - totp_code
      properties:
        totp_code:
          type: string
          description: Fresh TOTP code, accepted once.
          pattern: ^[0-9]{6}$
          example: '123456'
    CodeHalf:
      type: object
      description: Half of a vendor-assisted sign-in code, shown once. The requester gets characters 1
        to 4, the approver 5 to 8.
      required:
      - half
      - position
      properties:
        half:
          type: string
          description: Four characters.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}$
          example: 7QK3
        position:
          type: string
          description: Which half.
          enum:
          - first
          - second
          example: first
    ApprovalDecision:
      type: object
      description: Result of an approval decision. The approver receives their half once; sign_in_code
        approvals only.
      required:
      - approval
      properties:
        approval:
          $ref: '#/components/schemas/VendorApproval'
        code_half:
          $ref: '#/components/schemas/CodeHalf'
        grant:
          $ref: '#/components/schemas/VendorApprovalGrant'
    VendorApprovalGrant:
      type: object
      description: 'Signed, single-use grant (vendor realm, type vendor_approval, 5 minutes) for the
        kinds executed by another service (ADR-0014 A1.3). Its claims are the approval id, kind,
        organisation or none, requester, approver and a subject hash over the fields named per kind:
        organisation id and target status for org_suspend, org_reinstate and org_close; rule-set id,
        content hash and effective date for tax_rule_set_publish. The admin service passes it to the
        executing service and never to the browser. If the executor refuses, the approval stays approved
        and a fresh grant can be issued until it lapses.'
      required:
      - token
      - expires_at
      properties:
        token:
          type: string
          description: The signed grant.
          example: grant.example
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    RejectVendorApproval:
      type: object
      description: Reject or cancel an approval.
      required:
      - reason
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
  responses:
    InvalidSessionProof:
      description: The session proof or device assertion did not verify. Every failure looks the same,
        is counted per member and device, and is audited.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: urn:hostry:problem:invalid_session_proof
                title: Invalid session proof
                status: 401
                code: invalid_session_proof
    DeviceRevoked:
      description: The device is revoked. The answer is signed so the device may enter drain mode.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            revoked:
              value:
                type: urn:hostry:problem:device_revoked
                title: Device revoked
                status: 403
                code: device_revoked
    ApprovalRequired:
      description: The operation is blocked while the binding is under caution (24 hours) or needs an
        approval token (ADR-0005 A2.2). File the request with createApprovalRequest and repeat with the
        approval token.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            approval:
              value:
                type: urn:hostry:problem:approval_required
                title: Approval required
                status: 403
                code: approval_required
    GrantNotPermitted:
      description: Refused by the grant limits G1 to G6 (ADR-0005 A2.4), enforced from stored assignments,
        not from token grants.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            grant:
              value:
                type: urn:hostry:problem:grant_not_permitted
                title: Grant not permitted
                status: 403
                code: grant_not_permitted
    ActivationInvalid:
      description: The activation code is unknown, expired, used, or the proof of key possession failed.
        One answer for all of these.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            code:
              value:
                type: urn:hostry:problem:activation_code_invalid
                title: Activation code invalid
                status: 422
                code: activation_code_invalid
    RegistrationUnverified:
      description: The outlet's tax registration is not verified, so no series can be issued. The device
        may still register without billing.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            unverified:
              value:
                type: urn:hostry:problem:registration_unverified
                title: Tax registration not verified
                status: 409
                code: registration_unverified
    WipeNotReady:
      description: The wipe order is issued no sooner than 15 minutes after the drain completed (server
        clock).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            notready:
              value:
                type: urn:hostry:problem:wipe_order_not_ready
                title: Wipe order not ready
                status: 409
                code: wipe_order_not_ready
    VendorSignInFailed:
      description: Sign-in refused. Wrong password, unknown email, wrong or replayed TOTP, lockout and
        per-address limit all return this same answer.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            failed:
              value:
                type: urn:hostry:problem:vendor.sign_in_failed
                title: Sign-in failed
                status: 401
                code: vendor.sign_in_failed
    VendorUserConflict:
      description: The change would leave no active platform_admin, or a user would deactivate or demote
        themselves.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            last:
              value:
                type: urn:hostry:problem:last_platform_admin
                title: The last active platform admin cannot be deactivated or demoted
                status: 409
                code: last_platform_admin
            self:
              value:
                type: urn:hostry:problem:cannot_deactivate_self
                title: You cannot deactivate yourself
                status: 409
                code: cannot_deactivate_self
    SetupLinkInvalid:
      description: The setup link was used already, expired (24 hours), or is unknown.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: urn:hostry:problem:setup_link_invalid
                title: Setup link invalid
                status: 422
                code: setup_link_invalid
    InvitationConflict:
      description: The invitation is not pending, or the organisation already has an owner member (no
        vendor can add or replace owners).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            notpending:
              value:
                type: urn:hostry:problem:invitation_not_pending
                title: Invitation is not pending
                status: 409
                code: invitation_not_pending
            owner:
              value:
                type: urn:hostry:problem:owner_exists
                title: The organisation already has an owner
                status: 409
                code: owner_exists
    VendorApprovalRequired:
      description: The revoke is over the quota (2 per organisation, 10 per vendor user, rolling 24 hours);
        a second holder of admin.device.revoke must approve first (ADR-0005 A2.5).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            quota:
              value:
                type: urn:hostry:problem:vendor_approval_required
                title: A second vendor approver is required
                status: 409
                code: vendor_approval_required
    ModeNotSupported:
      description: Act mode is not available in Phase 1.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            mode:
              value:
                type: urn:hostry:problem:mode_not_supported
                title: Act mode is not supported
                status: 422
                code: mode_not_supported
                errors:
                - field: mode
                  code: mode_not_supported
                  message: only view is supported
    SupportSessionConflict:
      description: The vendor user already has an active support session, or the session has ended.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            active:
              value:
                type: urn:hostry:problem:support_session_active
                title: A support session is already active
                status: 409
                code: support_session_active
            ended:
              value:
                type: urn:hostry:problem:support_session_ended
                title: The support session has ended
                status: 409
                code: support_session_ended
    ApprovalConflict:
      description: The approval is not in a state that allows this, the approver is the requester or too
        new, or fewer than two eligible vendor users exist.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            second:
              value:
                type: urn:hostry:problem:second_approver_unavailable
                title: No second approver is available
                status: 409
                code: second_approver_unavailable
            state:
              value:
                type: urn:hostry:problem:approval_not_pending
                title: The approval is not pending
                status: 409
                code: approval_not_pending
    SwitchOwnerRole:
      description: The owner role is assigned only through assignOwnerRole.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            owner:
              value:
                type: urn:hostry:problem:use_owner_role_operation
                title: Use the owner role operation
                status: 422
                code: use_owner_role_operation
