openapi: 3.1.0
info:
  title: Hostry admin API
  version: 1.0.0
  description: 'Browser-facing API of the vendor-side admin service (ADR-0013). Served on the admin origin
    under /v1 and consumed only by admin-web. It accepts the session cookie only (HttpOnly, Secure, SameSite=Strict,
    __Host- prefix); a bearer token of any realm is refused. State-changing requests also need the per-session
    CSRF token in X-CSRF-Token and a matching Origin; CORS is off. No token of any kind ever appears in
    a response body, a header to the browser or browser storage: the admin service keeps the vendor access
    token and any support token in memory against the session. Every operation is one named panel need
    built on the generated identity and tenancy clients (no pass-through), re-validates the upstream answer
    against its closed schema and the deny list (full phone number, email of customers, key material),
    and passes the browser''s Idempotency-Key down to each service. The service has no database and writes
    no audit record: the serving service records each vendor action in its own transaction and identity
    assembles the vendor audit log. The panel is online only; writes are never queued.'
  x-status: stable
  x-example-worlds:
    base: "Vendor users Priya 4a66 (support, active, TOTP enrolled) and Arun 4a78 (platform_admin, active, account older than 7 days). Organisation 4a60 (trial) with brand 4a6a, outlet 4a61 (restaurant, state 33), registration 4a6b (GSTIN 33ABCDE1234F1Z7, unverified), device 4a5e (pos, active, billing capable), and a pending owner invitation 4a67 for +919876543210 (owner name Asha, created 13:05:11, expires 2026-12-08). No session beyond the caller, no support session, no approval. The caller is signed in as Priya, with the role needed for the operation."
    empty: "No organisation exists and no verified holder of GSTIN 33ABCDE1234F1Z7."
    session-open: "Base with a signed-in admin session for Priya (cookie and CSRF token csrf_example_token)."
    account-setup-pending: "Priya 4a66 in status setup_pending with setup token setup_example valid and no TOTP enrolled."
    org-no-owner: "Organisation 4a60 exists with no members and no owner invitation."
    device-revoked: "Base after device 4a5e was revoked at 13:15:11 by Priya for ticket SUP-2041 (vendor audit entry 4a8a vendor.device.revoked)."
    support-session-active: "Support session 4a68 (view mode) started by Priya for organisation 4a60, ticket SUP-2041, 13:05:11 to 13:35:11, active. The organisation is as in the identity base world and the tenancy series-issued world: registration 4a6b verified at 13:10:11 (certificate_seen), series A7K (tax_invoice 4a6c) and A7M (credit_note 4a95) active for device 4a5e, members Asha 4a64 (owner) and Ravi 4a9e, roles Owner 4a9a, Cashier 4a65 and Waiter 4a9b."
    approval-pending: "Base plus vendor approval 4a6d (kind device_revoke_over_quota, organisation 4a60, subject device 4a5e, requested by Priya 4a66, ticket SUP-2041) pending, created 13:05:11, expiring 2026-11-25T13:05:11. The caller is Arun 4a78 (platform_admin), who may approve and cancel it."
    signin-code-approved: "Base plus vendor approval 4a6d (kind sign_in_code, organisation 4a60, +919876543210, requested by Priya 4a66) approved by Arun 4a78; the caller is Priya, who has not claimed her code half."
servers:
- url: /
tags:
- name: admin
  description: Admin service (vendor side).
- name: support
  description: Support session (view mode) and the read-only configuration tabs of one organisation.
security:
- sessionCookie: []
paths:
  /v1/sessions:
    post:
      operationId: signIn
      summary: Sign in with email, password and TOTP
      description: Five failures in 15 minutes lock the account for 15 minutes; per-address limits also
        apply; a TOTP code is accepted once. Lockout looks like any other failure.
      tags:
      - admin
      x-permission: public
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorSignIn
            example:
              email: staff@example.invalid
              password: correct-horse-battery-staple
              totp_code: '123456'
      responses:
        '201':
          description: Signed in. The session cookie is set (HttpOnly, Secure, SameSite). A replay of
            the same Idempotency-Key within the idle window returns the same body and sets no second cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              example:
                user:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                  display_name: Priya
                  role: support
                  permissions:
                  - admin.org.read
                  - admin.device.read
                  - admin.device.revoke
                  - admin.support.session.start
                  - admin.audit.read_own
                  - admin.approval.create
                  - admin.approval.read
                  - admin.approval.decide
                csrf_token: csrf_example_token
                idle_timeout_seconds: 1800
                idle_expires_at: '2026-11-24T13:10:11.120Z'
                absolute_expires_at: '2026-11-25T01:05:11.120Z'
          headers:
            Set-Cookie:
              description: __Host-hostry-admin=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/ . Set
                on the first success only.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/SignInFailed'
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/sessions/current:
    get:
      operationId: getSession
      summary: The current session (page reload)
      tags:
      - admin
      x-permission: authenticated
      x-example-world: session-open
      responses:
        '200':
          description: The signed-in user, clocks and CSRF token; includes the active support session,
            if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              example:
                user:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                  display_name: Priya
                  role: support
                  permissions:
                  - admin.org.read
                  - admin.device.read
                  - admin.device.revoke
                  - admin.support.session.start
                  - admin.audit.read_own
                  - admin.approval.create
                  - admin.approval.read
                  - admin.approval.decide
                csrf_token: csrf_example_token
                idle_timeout_seconds: 1800
                idle_expires_at: '2026-11-24T13:10:11.120Z'
                absolute_expires_at: '2026-11-25T01:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
    delete:
      operationId: signOut
      summary: Sign out
      tags:
      - admin
      x-permission: authenticated
      x-example-world: session-open
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      responses:
        '204':
          description: Cookie cleared and session dropped server-side; replaying the old cookie is refused.
            Any support session of the user ends.
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
  /v1/account-setups:
    post:
      operationId: beginAccountSetup
      summary: Begin account setup from a one-time link
      tags:
      - admin
      x-permission: public
      x-example-world: account-setup-pending
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/BeginVendorSetup
            example:
              setup_token: setup_example
      responses:
        '201':
          description: TOTP enrolment material (shown once). Until password and TOTP are set, nothing
            else is reachable.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorSetupChallenge
              example:
                email: staff@example.invalid
                totp_provisioning_uri: otpauth://totp/Hostry:staff@example.invalid?secret=EXAMPLEEXAMPLE234&issuer=Hostry
                expires_at: '2026-11-24T13:10:11.120Z'
        '422':
          $ref: '#/components/responses/SetupLinkInvalid'
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/account-setup-completions:
    post:
      operationId: completeAccountSetup
      summary: Finish account setup
      tags:
      - admin
      x-permission: public
      x-example-world: account-setup-pending
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/CompleteVendorSetup
            example:
              setup_token: setup_example
              password: example-passphrase-twelve
              totp_code: '123456'
      responses:
        '200':
          description: Account active. Reusing the link, or using it after 24 hours, is refused.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorUser
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                email: staff@example.invalid
                display_name: Priya
                role: support
                status: active
                totp_enrolled: true
                created_at: '2026-11-24T13:05:11.120Z'
        '422':
          $ref: '#/components/responses/SetupLinkInvalid'
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
  /v1/vendor-users:
    get:
      operationId: listVendorUsers
      summary: List vendor staff
      tags:
      - admin
      x-permission: admin.user.manage
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/VendorLimit
      responses:
        '200':
          description: A page of vendor users.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorUserPage
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                  email: staff@example.invalid
                  display_name: Priya
                  role: support
                  status: active
                  totp_enrolled: true
                  created_at: '2026-11-24T13:05:11.120Z'
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a78
                  email: admin@example.invalid
                  display_name: Arun
                  role: platform_admin
                  status: active
                  totp_enrolled: true
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      operationId: createVendorUser
      summary: Create a vendor user
      tags:
      - admin
      x-permission: admin.user.manage
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/CreateVendorUser
            example:
              id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a88
              email: new.staff@example.invalid
              display_name: Karthik
              role: support
      responses:
        '201':
          description: User in setup_pending; the setup link goes out by email and is never returned.
            Until setup is finished every admin API refuses the user.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorUser
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a88
                email: new.staff@example.invalid
                display_name: Karthik
                role: support
                status: setup_pending
                totp_enrolled: false
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/vendor-users/{vendor_user_id}:
    patch:
      operationId: updateVendorUser
      summary: Change role or deactivate a vendor user
      tags:
      - admin
      x-permission: admin.user.manage
      parameters:
      - name: vendor_user_id
        in: path
        required: true
        description: Vendor user ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/UpdateVendorUser
            example:
              status: deactivated
      responses:
        '200':
          description: Updated. Deactivation drops that user's admin sessions in this same operation and
            ends any support session; their next request is refused.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorUser
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                email: staff@example.invalid
                display_name: Priya
                role: support
                status: deactivated
                totp_enrolled: true
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/VendorUserConflict'
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/vendor-users/{vendor_user_id}/totp-resets:
    post:
      operationId: resetVendorUserTotp
      summary: Reset a vendor user's TOTP
      tags:
      - admin
      x-permission: admin.user.manage
      parameters:
      - name: vendor_user_id
        in: path
        required: true
        description: Vendor user ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: User returns to setup_pending and must enrol again at next sign-in; their admin
            sessions are dropped.
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorUser
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                email: staff@example.invalid
                display_name: Priya
                role: support
                status: setup_pending
                totp_enrolled: false
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/organisations:
    get:
      operationId: listOrganisations
      summary: List and search organisations
      tags:
      - admin
      x-permission: admin.org.read
      parameters:
      - name: q
        in: query
        required: false
        description: Name contains (any case), an organisation id, an exact GSTIN, or an exact owner mobile
          (10 digits or +91 form). Partial GSTIN or phone never matches.
        schema:
          type: string
        example: Example
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/OrganisationStatus
        example: trial
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/VendorLimit
      responses:
        '200':
          description: Newest first. Loads from tenancy even when identity is down (owner_status unknown).
            Directory reads are not audited per read. Full mobile numbers never appear.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationList'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  name: Example Hospitality
                  status: trial
                  outlet_count: 1
                  created_at: '2026-11-24T13:05:11.120Z'
                  owner_status: pending
                owner_status_available: true
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      operationId: createOrganisation
      summary: Create an organisation, first outlet and owner invitation
      description: Forbidden for support and billing staff. Creates no document series and no entitlements.
        The mobile number is held in memory only and asked for again after a page reload.
      tags:
      - admin
      x-permission: admin.org.create
      x-example-world: empty
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganisationForm'
            example:
              name: Example Hospitality
              outlet:
                name: Main Restaurant
                kind: restaurant
                state_code: '33'
              tax_registration:
                legal_name: Example Hospitality Pvt Ltd
                regime: regular
                gstin: 33ABCDE1234F1Z7
              owner:
                name: Asha
                mobile_e164: '+919876543210'
      responses:
        '201':
          description: 'Step 1 (tenancy) then step 2 (identity), each idempotent under the same key. state
            complete: both exist. state incomplete: the organisation exists, identity failed; replay the
            same request or call createOwnerInvitation. No undo, no second organisation. Same key twice
            returns the same organisation id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
              example:
                state: complete
                created:
                  organisation:
                    id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                    name: Example Hospitality
                    status: trial
                    created_at: '2026-11-24T13:05:11.120Z'
                    updated_at: '2026-11-24T13:05:11.120Z'
                  brand:
                    id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                    name: Example Hospitality
                    is_default: true
                    created_at: '2026-11-24T13:05:11.120Z'
                  outlet:
                    id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                    brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                    name: Main Restaurant
                    kind: restaurant
                    status: active
                    state_code: '33'
                    tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                    timezone: Asia/Kolkata
                    created_at: '2026-11-24T13:05:11.120Z'
                  tax_registration:
                    id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                    legal_name: Example Hospitality Pvt Ltd
                    regime: regular
                    gstin: 33ABCDE1234F1Z7
                    state_code: '33'
                    verification:
                      state: unverified
                    status: open
                    created_at: '2026-11-24T13:05:11.120Z'
                owner_invitation:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a67
                  organisation_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  status: pending
                  mobile_masked: +91*******210
                  owner_name: Asha
                  expires_at: '2026-12-08T13:05:11.120Z'
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '409':
          $ref: '#/components/responses/GstinInUse'
        '422':
          $ref: '#/components/responses/FormValidation'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /v1/organisations/{organisation_id}:
    get:
      operationId: getOrganisation
      summary: Organisation detail
      tags:
      - admin
      x-permission: admin.org.read
      parameters:
      - name: organisation_id
        in: path
        required: true
        description: Organisation ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
      responses:
        '200':
          description: Brands, outlets, registrations and owner-invitation status; no members, devices
            or settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetailView'
              example:
                organisation:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  name: Example Hospitality
                  status: trial
                  outlet_count: 1
                  created_at: '2026-11-24T13:05:11.120Z'
                brands:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                  name: Example Hospitality
                  is_default: true
                outlets:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  name: Main Restaurant
                  kind: restaurant
                  state_code: '33'
                  status: active
                registrations:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                  legal_name: Example Hospitality Pvt Ltd
                  regime: regular
                  gstin: 33ABCDE1234F1Z7
                  state_code: '33'
                  verification_state: unverified
                  status: open
                owner_status: pending
                onboarding_state: complete
                owner_invitations:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a67
