  /v1/approvals:
    post:
      operationId: fileVendorApproval
      summary: File a two-person approval
      description: "Files a request that a second vendor user must approve (ADR-0005 A2.3; ADR-0014 A1.3). Kinds: sign_in_code, owner_recovery, device_revoke_over_quota (the 409 vendor_approval_required of revokeOrganisationDevice is resolved by filing this with the device as subject, then repeating the revoke with the approval_id once approved), org_suspend, org_reinstate, org_close and tax_rule_set_publish. The gate permission is admin.approval.create; the service then checks the kind-specific permission (x-permission-by-kind). Refused second_approver_unavailable with fewer than two eligible users, in every environment. Passes through to the identity service with the admin service token and the signed-in vendor user's access token; the browser never sees either."
      tags:
      - admin
      x-permission: admin.approval.create
      x-permission-by-kind:
        sign_in_code: admin.signin_code.create
        owner_recovery: admin.recovery.create
        device_revoke_over_quota: admin.device.revoke
        org_suspend: admin.org.lifecycle.request
        org_reinstate: admin.org.lifecycle.request
        org_close: admin.org.lifecycle.request
        tax_rule_set_publish: admin.taxrules.publish
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing
          request together with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../identity/v1/openapi.yaml#/components/schemas/CreateVendorApproval
            example:
              kind: device_revoke_over_quota
              organisation_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
              subject_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
              ticket_reference: SUP-2041
              reason: Owner phoned to report a lost tablet.
              verification_method: callback_to_registered_number
      responses:
        '201':
          description: "Pending approval. A replay of the same Idempotency-Key returns the same approval."
          content:
            application/json:
              schema:
                $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorApproval
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6d
                kind: device_revoke_over_quota
                state: pending
                organisation_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                subject_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                requested_by: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a66
                ticket_reference: SUP-2041
                verification_method: callback_to_registered_number
                created_at: '2026-11-24T13:05:11.120Z'
                expires_at: '2026-11-25T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/ApprovalConflict'
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    get:
      operationId: listVendorApprovals
      summary: List approvals
      description: "Approvals the signed-in vendor user requested or may approve, newest first. Passes through to the identity service with the admin service token and the signed-in vendor user's access token; the browser never sees either."
