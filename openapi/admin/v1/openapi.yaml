        admin service writes no audit record. Validates again; stores the CA sign-off record and a content hash; the
        version, including its effective date, is immutable from here. 422 validation if it fails.
      tags:
      - admin
      x-permission: admin.taxrules.manage
      parameters:
      - name: rule_set_id
        in: path
        required: true
        description: Rule set id.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 72bdd3f5-68b5-59b0-8e62-2075a1f43c47
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing request together
          with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../billing/v1/openapi.yaml#/components/schemas/SignTaxRuleSet
            example:
              signoff:
                reviewer_name: A. Reviewer
                signed_on: '2026-11-20'
                reference_note: CA advice note 2026-11 ref 12
      responses:
        '200':
          description: The signed version.
          content:
            application/json:
              schema:
                $ref: ../../billing/v1/openapi.yaml#/components/schemas/TaxRuleSetMaster
              example:
                id: 72bdd3f5-68b5-59b0-8e62-2075a1f43c47
                version: 2
                revision: 1
                name: GST restaurant services 2026 B
                effective_date: '2026-12-15'
                calc_v: 1
                state: signed
                review_status: reviewed
                rules:
                - tax_class: fnb_standard
                  regime: regular
                  specified_premises: false
                  order_channel: dine_in
                  doc_type: tax_invoice
                  gst_applies: true
                  cgst_bp: 250
                  sgst_bp: 250
                  igst_bp: 0
                created_at: '2026-11-24T13:05:11.120Z'
                signoff:
                  reviewer_name: A. Reviewer
                  signed_on: '2026-11-20'
                  reference_note: CA advice note 2026-11 ref 12
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
      x-example-world: rule-set-draft
  /v1/tax-rule-sets/{rule_set_id}/validation:
    post:
      operationId: validateTaxRuleSet
      summary: Validate a draft against the BR-A1-82 checks and the conformance vectors
      description: Named panel operation (ADR-0013 V4) on billing validateTaxRuleSet, called with the admin service
        token and the signed-in vendor user's access token and the browser's Idempotency-Key where it writes. The
        serving service records the vendor audit entry in its own transaction and answers with the browser-safe result;
        the admin service writes no audit record. Every combination in use has a mapping, rates are whole basis points,
        components are two equal halves, and every vector in api-specs/tax/conformance passes against the draft rates
        (ADR-0014 R6.1).
      tags:
      - admin
      x-permission: admin.taxrules.manage
      parameters:
      - name: rule_set_id
        in: path
        required: true
        description: Rule set id.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 72bdd3f5-68b5-59b0-8e62-2075a1f43c47
      - name: X-CSRF-Token
        in: header
        required: true
        description: Per-session CSRF token from signIn or getSession. Required on every state-changing request together
          with a matching Origin.
        schema:
          type: string
        example: csrf_example_token
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: The outcome; valid or not, the call succeeds.
          content:
            application/json:
              schema:
                $ref: ../../billing/v1/openapi.yaml#/components/schemas/TaxRuleSetValidation
              example:
                valid: true
                errors: []
                vectors_total: 65
                vectors_passed: 65
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
      x-example-world: rule-set-draft
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-hostry-admin
      description: Opaque 256-bit session id. Idle and absolute limits are configuration (default 30 minutes
        idle, 12 hours absolute). A signed-out or expired cookie is refused.
  schemas:
    AdminSession:
      type: object
      description: The signed-in vendor user and the session clocks. The CSRF token is for the X-CSRF-Token
        header; it is not a credential. No access token is ever included.
      required:
      - user
      - csrf_token
      - idle_timeout_seconds
      - idle_expires_at
      - absolute_expires_at
      properties:
        user:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorPrincipal
        csrf_token:
          type: string
          description: Per-session CSRF token, returned on sign-in and on getSession.
          example: csrf_example_token
        idle_timeout_seconds:
          type: integer
          description: Idle timeout (configuration; default 1800).
          minimum: 1
          example: 1800
        idle_expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        absolute_expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        support_session:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/SupportSession
    ApprovalDecisionView:
      type: object
      description: Result of an approval decision as the browser sees it. The vendor approval grant of
        the executing kinds stays in the admin service and is never included.
      required:
      - approval
      properties:
        approval:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/VendorApproval
        code_half:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/CodeHalf
    OwnerStatus:
      type: string
      description: 'Owner state: none, the latest invitation state, or unknown when identity is unavailable
        (the list still loads from tenancy).'
      enum:
      - none
      - pending
      - accepted
      - expired
      - cancelled
      - unknown
      example: pending
    OrganisationSummary:
      type: object
      description: One row of the organisation list. No phone number anywhere.
      required:
      - id
      - name
      - status
      - outlet_count
      - created_at
      - owner_status
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Display name.
          example: Example Hospitality
        status:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/OrganisationStatus
        outlet_count:
          type: integer
          description: Number of outlets.
          minimum: 0
          example: 1
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        owner_status:
          $ref: '#/components/schemas/OwnerStatus'
      additionalProperties: false
    OrganisationList:
      type: object
      description: A page of organisations, newest first, 25 per page (maximum 100).
      required:
      - items
      - owner_status_available
      properties:
        items:
          type: array
          description: Organisations on this page.
          items:
            $ref: '#/components/schemas/OrganisationSummary'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
        owner_status_available:
          type: boolean
          description: False when identity was unavailable; owner_status is then unknown on every row
            and the panel shows a notice.
          example: true
      additionalProperties: false
    OnboardingState:
      type: string
      description: 'complete: organisation and owner invitation both exist. incomplete: the organisation
        exists with no owner and no pending invitation; derived, never a stored flag. unknown: identity
        unavailable.'
      enum:
      - complete
      - incomplete
      - unknown
      example: complete
    OrganisationDetailView:
      type: object
      description: Structure, registrations and owner-invitation status. No members, devices or settings.
      required:
      - organisation
      - brands
      - outlets
      - registrations
      - owner_status
      - onboarding_state
      - owner_invitations
      properties:
        organisation:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/DirectoryOrganisation
        brands:
          type: array
          description: Brands.
          items:
            $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/DirectoryBrand
        outlets:
          type: array
          description: Outlets (name, kind, state).
          items:
            $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/DirectoryOutlet
        registrations:
          type: array
          description: Tax registrations.
          items:
            $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/DirectoryRegistration
        owner_status:
          $ref: '#/components/schemas/OwnerStatus'
        onboarding_state:
          $ref: '#/components/schemas/OnboardingState'
        owner_invitations:
          type: array
          description: Owner invitations, newest first.
          items:
            $ref: ../../identity/v1/openapi.yaml#/components/schemas/OwnerInvitation
      additionalProperties: false
    NewOwner:
      type: object
      description: The owner to invite. This is the one place a full number is typed; it passes through
        the admin service in memory only and is never stored there.
      required:
      - name
      - mobile_e164
      properties:
        name:
          type: string
          description: Owner display name.
          minLength: 1
          maxLength: 80
          example: Asha
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
    CreateOrganisationForm:
      type: object
      description: 'The single form: organisation, first outlet, tax registration, optional GSTIN verification
        and the owner. Timezone is IST; business-day settings are not asked.'
      required:
      - name
      - outlet
      - tax_registration
      - owner
      properties:
        name:
          type: string
          description: Organisation display name.
          minLength: 1
          maxLength: 120
          example: Example Hospitality
        outlet:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/NewOutlet
        tax_registration:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/NewRegistration
        verification:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/VerificationInput
        owner:
          $ref: '#/components/schemas/NewOwner'
    OnboardingResult:
      type: object
      description: Outcome of onboarding. Success is shown only when state is complete.
      required:
      - state
      - created
      properties:
        state:
          type: string
          description: complete when the organisation and the owner invitation both exist; incomplete
            when identity failed after the organisation was created.
          enum:
          - complete
          - incomplete
          example: complete
        created:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/OrganisationCreated
        owner_invitation:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/OwnerInvitation
        retry_hint:
          type: string
          description: 'When incomplete: replay the same request with the same Idempotency-Key, or call
            createOwnerInvitation on the organisation.'
          enum:
          - replay_request
          - create_owner_invitation
          example: replay_request
      additionalProperties: false
    NewOwnerInvitation:
      type: object
      description: Create an owner invitation (the retry path of an incomplete onboarding, or a re-issue
        after expiry).
      required:
      - name
      - mobile_e164
      properties:
        name:
          type: string
          description: Owner display name.
          minLength: 1
          maxLength: 80
          example: Asha
        mobile_e164:
          $ref: ../../../common/components.yaml#/components/schemas/MobileE164
    StartSupport:
      type: object
      description: Start a read-only support session.
      required:
      - organisation_id
      - ticket_reference
      - reason
      properties:
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        ticket_reference:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        duration_minutes:
          type: integer
          description: Session length; default 30, maximum 60.
          minimum: 1
          maximum: 60
          example: 30
        mode:
          type: string
          description: view only; act is refused with mode_not_supported.
          enum:
          - view
          - act
          example: view
    SupportSessionView:
      type: object
      description: 'The active support session for the banner: organisation, countdown, read-only. The
        support token stays in the admin service.'
      required:
      - session
      - seconds_remaining
      properties:
        session:
          $ref: ../../identity/v1/openapi.yaml#/components/schemas/SupportSession
        seconds_remaining:
          type: integer
          description: Countdown for the banner.
          minimum: 0
          example: 1800
      additionalProperties: false
    SupportOrganisation:
      type: object
      description: Organisation profile and status.
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Display name.
          example: Example Hospitality
        status:
          $ref: ../../tenancy/v1/openapi.yaml#/components/schemas/OrganisationStatus
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    ExecuteLifecycle:
      type: object
      description: Execution of an approved organisation lifecycle action (suspend, reinstate or close). The browser
        names the approval; the admin service holds the matching single-use grant.
      required:
      - approval_id
      - ticket
      - reason
      properties:
        approval_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
          description: Id of the approved vendor approval (fileVendorApproval, approveVendorApproval) of the matching
            kind for this organisation.
        ticket:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        owner_export_offered:
          type: boolean
          description: 'Close only: recorded confirmation that the owner was offered an export (BR-A1-72).'
          example: true
    ExecutePublication:
      type: object
      description: Publication of a signed tax rule set after its tax_rule_set_publish approval was approved.
      required:
      - approval_id
      properties:
        approval_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
          description: Id of the approved tax_rule_set_publish approval whose subject is this rule set, its content
            hash and its effective date.
        note:
          type: string
          description: Optional note for the vendor log, at most 200 characters, no personal data.
          maxLength: 200
          example: Notified rate change
  responses:
    ApprovalConflict:
      description: The approval is not in a state that allows this, the approver is the requester or too
        new, or fewer than two eligible vendor users exist.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            second:
              value:
                type: urn:hostry:problem:second_approver_unavailable
                title: No second approver is available
                status: 409
                code: second_approver_unavailable
            state:
              value:
                type: urn:hostry:problem:approval_not_pending
                title: The approval is not pending
                status: 409
                code: approval_not_pending
    SignInFailed:
      description: Sign-in refused. Wrong password, unknown email, wrong TOTP, replayed TOTP and lockout
        all give this same answer and an audit entry vendor.sign_in.failed.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            failed:
              value:
                type: urn:hostry:problem:sign_in_failed
                title: Sign-in failed
                status: 401
                code: sign_in_failed
    UpstreamUnavailable:
      description: A service the operation needs is unavailable. Nothing partial is shown; retry.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            up:
              value:
                type: urn:hostry:problem:upstream_unavailable
                title: A required service is unavailable
                status: 503
                code: upstream_unavailable
    SupportSessionRequired:
      description: No active support session for this organisation (none started, ended, expired, or a
        vendor token alone was used). No stale data is returned.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            none:
              value:
                type: urn:hostry:problem:support_session_required
                title: An active support session is required
                status: 403
                code: support_session_required
            ended:
              value:
                type: urn:hostry:problem:support_session_ended
                title: The support session has ended
                status: 409
                code: support_session_ended
    SupportSessionConflict:
      description: A support session is already active for this vendor user; end it first.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            active:
              value:
                type: urn:hostry:problem:support_session_active
                title: A support session is already active
                status: 409
                code: support_session_active
    ModeNotSupported:
      description: Act mode is not available in Phase 1.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            mode:
              value:
                type: urn:hostry:problem:mode_not_supported
                title: Act mode is not supported
                status: 422
                code: mode_not_supported
    GstinInUse:
      description: A verified holder of the GSTIN exists; nothing was created.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            gstin:
              value:
                type: urn:hostry:problem:gstin_in_use
                title: GSTIN already registered to another organisation
                status: 409
                code: gstin_in_use
    InvitationConflict:
      description: The invitation is not pending, or the organisation already has an owner member (resend,
        cancel and invite another owner are refused).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            notpending:
              value:
                type: urn:hostry:problem:invitation_not_pending
                title: Invitation is not pending
                status: 409
                code: invitation_not_pending
            owner:
              value:
                type: urn:hostry:problem:owner_exists
                title: The organisation already has an owner
                status: 409
                code: owner_exists
    VendorUserConflict:
      description: The change would leave no active platform_admin, or a user would deactivate or demote
        themselves.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            last:
              value:
                type: urn:hostry:problem:last_platform_admin
                title: The last active platform admin cannot be deactivated or demoted
                status: 409
                code: last_platform_admin
            self:
              value:
                type: urn:hostry:problem:cannot_deactivate_self
                title: You cannot deactivate yourself
                status: 409
                code: cannot_deactivate_self
    SetupLinkInvalid:
      description: The setup link was used already, expired (24 hours), or is unknown.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            invalid:
              value:
                type: urn:hostry:problem:setup_link_invalid
                title: Setup link invalid
                status: 422
                code: setup_link_invalid
    RevokeRefused:
      description: The revoke needs a second approver (quota), or the device state does not allow it.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            quota:
              value:
                type: urn:hostry:problem:vendor_approval_required
                title: A second vendor approver is required
                status: 409
                code: vendor_approval_required
    FormValidation:
      description: Invalid input; nothing is created.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            gstin:
              value:
                type: urn:hostry:problem:validation
                title: Validation failed
                status: 422
                code: validation
                errors:
                - field: tax_registration.gstin
                  code: gstin_state_mismatch
                  message: state code does not match the outlet state
    ForbiddenOrCsrf:
      description: The role lacks the permission, or the CSRF token is missing or invalid, or the Origin
        does not match. Nothing changed.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            forbidden:
              value:
                type: urn:hostry:problem:forbidden
                title: Permission denied
                status: 403
                code: forbidden
            csrf:
              value:
                type: urn:hostry:problem:csrf_failed
                title: Request refused
                status: 403
                code: csrf_failed
    ExecuteConflict:
      description: The approval is not executable by this caller (not approved, not theirs, used or expired), the organisation
        has a trading day in progress (suspend and close), or the state does not allow the action (rule set not signed).
        Nothing changed; the approval stays approved unless used.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            approval:
              value:
                type: urn:hostry:problem:approval_not_executable
                title: The approval cannot be executed
                status: 409
                code: approval_not_executable
            trading:
              value:
                type: urn:hostry:problem:open_trading_day
                title: A trading day is in progress
                status: 409
                code: open_trading_day
            unsigned:
              value:
                type: urn:hostry:problem:not_signed
                title: The rule set is not signed
                status: 409
                code: not_signed
            state:
              value:
                type: urn:hostry:problem:conflict
                title: The state does not allow this
                status: 409
                code: conflict
