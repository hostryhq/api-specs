        strong-session edits; the rest are edited on devices with settings.outlet.edit.
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        number_at:
          type: string
          description: 'settle (default): the bill takes its number at the first payment or Issue invoice after
            a recorded pre-bill; print: at the first Present (ADR-0014 A1.5).'
          enum:
          - settle
          - print
          example: settle
        price_mode:
          type: string
          description: exclusive (default) or inclusive menu prices.
          enum:
          - exclusive
          - inclusive
          example: exclusive
        round_off:
          type: boolean
          description: Round the total to the nearest rupee as a separate line.
        service_charge_bp:
          type: integer
          description: Service charge in basis points; 0 is off (default off, CCPA 2022).
          minimum: 0
          maximum: 2500
          example: 0
        discount_limit_bp:
          type: integer
          description: Cashier discount limit in basis points of the bill (default 1000).
          minimum: 0
          maximum: 10000
          example: 1000
        rebill_allowance_per_shift:
          type: integer
          description: Re-bills a cashier may do per shift without approval (default 3).
          minimum: 0
          example: 3
        comp_allowance:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        open_item_limit:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        manual_entry_max_days_back:
          type: integer
          description: Days back a bill-book entry may be dated (default 2).
          minimum: 0
          maximum: 7
          example: 2
        shift_required:
          type: boolean
          description: Track cash shifts (default on).
        handover_count:
          type: boolean
          description: Offer a counted handover when the cashier changes (default on).
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - outlet_id
      - number_at
      - price_mode
      - round_off
      - service_charge_bp
      - discount_limit_bp
      - rebill_allowance_per_shift
      - comp_allowance
      - open_item_limit
      - manual_entry_max_days_back
      - shift_required
      - handover_count
