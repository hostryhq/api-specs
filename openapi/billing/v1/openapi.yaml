openapi: 3.1.0
info:
  title: Hostry billing API
  version: 1.0.0
  description: 'Money and legal documents: bills, credit notes, payments, refunds, shifts, the business day with
    its Z revisions, the document register, tax profile and settings, the platform tax rule sets, internal-consumption
    records and the sales, tax and tender reports (ADR-0014 R1, R3, R5, R6, R7 and Amendment A1). Documents are
    created on devices as sync ops (bill.finalize allocates the number on the device); this API is the cloud read
    side plus the online-only strong-session settings. billing recomputes every bill and credit note with the same
    calc_v and ruleset_v and records verified, mismatch, stale_rules, profile_mismatch or manual_entry; a bill is
    never altered or rejected, the remedy is a credit note (R6.6). billing never allocates, changes or reuses a
    number. The tenant is always the caller''s organisation from the token; outlet-scoped calls take X-Outlet-Id.
    Operations under /internal/v1/vendor serve the admin service: they need the admin service token plus the vendor
    user''s token, and publication needs a vendor approval grant (A1.3, A1.4). The word billing always means a tenant''s
    sales documents; Hostry''s own subscription ledger is in tenancy. Amounts are Money (paise); quantities are
    thousandths; rates are basis points.'
  x-status: stable
  x-example-worlds:
    base: Organisation 4a60 with outlet 4a61 and verified registration 4a6b (regular). Bill 7001 (A7K/2627/000123,
      tax_invoice, paid by cash payment 7021, verified), credit note 7011, refund 7061, shift 7051 closed, business
      day bbac closed with no revisions (Z/2026-11-24/P1), internal consumption 7081, series A7K registered, published
      rule set c799 (unreviewed) in force, outlet billing config at defaults (number_at settle), orders reports
      no open check. No exception, no gap, no draft rule set. The caller is an owner (strong session) or, on /internal/v1/vendor
      routes, the admin service with a vendor user holding the needed permission.
    payments-exceed: Base plus an open exception 7091 (payments_exceed_total on bill 7001) after a second payment
      was taken on another device.
    rule-set-draft: Base plus draft rule set 3c47 (version 2, revision 1, effective 2026-12-15, unreviewed, one
      rule).
    rule-set-signed: Base plus rule set 3c47 signed (reviewed, sign-off recorded, effective 2026-12-15) and a valid
      single-use vendor approval grant for it; the caller is the approver, a second platform admin.
servers:
- url: /
tags:
- name: billing
  description: Documents, register, reports, settings.
- name: vendor
  description: Tax rule set master and publication (admin service only).
- name: internal
  description: Operations for other Hostry services.
security:
- bearerAuth: []
paths:
  /v1/bills:
    get:
      operationId: listBills
      summary: List bills (the bill register)
      description: 'Report 2. Newest first by finalisation. A late document carries late: true. The bill-book bills
        are those with source_kind manual_book.'
      tags:
      - billing
      x-permission: report.view.outlet
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      - name: business_date
        in: query
        required: false
        description: Filter by business date.
        schema:
          type: string
          format: date
        example: '2026-11-24'
      - name: invoice_from
        in: query
        required: false
        description: First invoice date.
        schema:
          type: string
          format: date
        example: '2026-11-24'
      - name: invoice_to
        in: query
        required: false
        description: Last invoice date.
        schema:
          type: string
          format: date
        example: '2026-11-24'
      - name: number
        in: query
        required: false
        description: Exact bill number.
        schema:
          type: string
        example: A7K/2627/000123
      - name: source_kind
        in: query
        required: false
        description: Filter by source.
        schema:
          type: string
          enum:
          - check
          - counter
          - manual_book
        example: check
      - name: verification
        in: query
        required: false
        description: Filter by verification result.
        schema:
          type: string
          enum:
          - pending
          - verified
          - mismatch
          - stale_rules
          - profile_mismatch
          - manual_entry
        example: mismatch
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of bills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f7001
