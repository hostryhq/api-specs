components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 tenant-realm access token issued by identity (ADR-0005). One tenant per token. Support
        tokens are accepted only together with the admin service token.
    vendorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 vendor-realm access token. Refused by every tenant-facing operation.
    serviceAuth:
      type: apiKey
      in: header
      name: Hostry-Service-Token
      description: 60-second ES256 service token (ADR-0005 section 9). Operations under /internal/v1 accept it only
        from the callers in x-service-callers.
  schemas:
    BillDocType:
      type: string
      description: 'Sale document type, following the regime of the registration (ADR-0002 S7): tax_invoice (regular),
        bill_of_supply (composition or exempt), plain_bill (unregistered).'
      enum:
      - tax_invoice
      - bill_of_supply
      - plain_bill
      example: tax_invoice
    SourceKind:
      type: string
      description: 'What the bill was made from: a check, a counter sale with no check, or a late entry from a paper
        bill book (ADR-0014 A1.6). Later products add folio and order.'
      enum:
      - check
      - counter
      - manual_book
      example: check
    PaymentStatus:
      type: string
      description: 'Derived: unpaid, partly_paid or paid (payments net of cash change against the total).'
      enum:
      - unpaid
      - partly_paid
      - paid
      example: paid
    VerificationStatus:
      type: string
      description: pending until billing has recomputed it; verified; mismatch (flagged high, owner notified); stale_rules
        (device used an older rule set than the one in force that day); profile_mismatch (document type does not
        match the registration's regime); manual_entry (a bill-book entry, compared with the typed total).
      enum:
      - pending
      - verified
      - mismatch
      - stale_rules
      - profile_mismatch
      - manual_entry
      example: verified
    Verification:
      type: object
      description: Result of recomputing a document with its own calc_v and ruleset_v (R6.6). Never changes the
        document.
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        calc_v:
          type: integer
          description: Calculation version used.
          minimum: 1
          example: 1
        ruleset_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        difference:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        checked_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - status
      - calc_v
    BillLine:
      type: object
      description: 'A bill line, a self-contained snapshot: it needs nothing from orders or catalog (R2).'
      properties:
        line_no:
          type: integer
          description: Position on the bill, from 1.
          minimum: 1
          example: 1
        order_line_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        item_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        item_name:
          type: string
          description: Item name snapshot, English.
          example: Paneer Tikka
        variant_name:
          type: string
          description: Variant name snapshot.
          example: Full
        category_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        category_name:
          type: string
          description: Category name snapshot, for the category report.
          example: Starters
        qty_milli:
          type: integer
          description: Quantity in thousandths.
          format: int64
          minimum: 1
          example: 2000
        unit_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        modifier_delta:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        line_discount:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        bill_discount_alloc:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        net:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        comp:
          type: boolean
          description: 'True for a complimentary line: printed at zero with (Comp), list value kept, no tax.'
        tax_class:
          type: string
          description: Tax class snapshot.
          example: fnb_standard
        hsn_sac:
          type: string
          description: HSN or SAC snapshot, up to 8 digits; absent until the CA advises.
          pattern: ^[0-9]{4,8}$
          example: '996331'
      required:
      - line_no
      - item_id
      - item_name
      - category_name
      - qty_milli
      - unit_price
      - modifier_delta
      - line_discount
      - bill_discount_alloc
      - net
      - comp
      - tax_class
    TaxLine:
      type: object
      description: 'One tax group of a document: (tax class, effective rate). Tax is computed per group, not per
        line (RM-B4). The non-GST group carries no tax.'
      properties:
        tax_class:
          type: string
          description: Tax class.
          example: fnb_standard
        rate_bp:
          type: integer
          description: Total GST rate in basis points (500 is 5.00 percent).
          minimum: 0
          example: 500
        gst_applies:
          type: boolean
          description: False for the non-GST group.
        charge_alloc:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        taxable:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        cgst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        sgst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        igst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
      required:
      - tax_class
      - rate_bp
      - gst_applies
      - charge_alloc
      - taxable
      - cgst
      - sgst
      - igst
    Payment:
      type: object
      description: 'A recorded payment: how the guest paid. Nothing is authorised or verified by Hostry (RM-Y9).
        A mixed tender is several payments.'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        bill_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        target_kind:
          type: string
          description: What it pays; bill in Phase 2, order for advances in Phase 3.
          enum:
          - bill
          example: bill
        tender:
          type: string
          description: Tender kind; other is an outlet-defined named tender; on_account is reserved for Phase 5.
          enum:
          - cash
          - upi
          - card
          - other
          - eco
          example: cash
        tender_name:
          type: string
          description: Name of an other tender, for example Coupon.
          maxLength: 30
          example: Coupon
        amount:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        tendered:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        change:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        reference:
          type: string
          description: UPI transaction reference (up to 40 characters) or the last four digits of a card (never
            more).
          maxLength: 40
          example: '4821'
        member_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        shift_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        business_date:
          type: string
          description: Business date the payment was taken on.
          format: date
          example: '2026-11-24'
        paid_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - bill_id
      - target_kind
      - tender
      - amount
      - member_id
      - device_id
      - business_date
      - paid_at
    Bill:
      type: object
      description: A numbered sale document, immutable once created by bill.finalize (summary).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        number:
          type: string
          description: <code>/<FY>/<running>, at most 16 characters; for a manual_book bill the book's own number.
          maxLength: 16
          example: A7K/2627/000123
        doc_type:
          $ref: '#/components/schemas/BillDocType'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        check_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        order_type:
          type: string
          description: dine_in, takeaway or counter.
          enum:
          - dine_in
          - takeaway
          - counter
          example: dine_in
        eco:
          type: boolean
          description: True for an aggregator (ECO) order.
        business_date:
          type: string
          description: Business date, kept for ever (A1.1 item 3).
          format: date
          example: '2026-11-24'
        invoice_date:
          type: string
          description: IST calendar date of finalisation; decides the financial year and the tax reports.
          format: date
          example: '2026-11-24'
        finalized_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        cashier_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        waiter_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        calc_v:
          type: integer
          description: Calculation version.
          minimum: 1
          example: 1
        ruleset_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        price_mode:
          type: string
          description: exclusive or inclusive.
          enum:
          - exclusive
          - inclusive
          example: exclusive
        total:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        round_off:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        paid:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        credited:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        verification:
          $ref: '#/components/schemas/Verification'
        late:
          type: boolean
          description: True when the bill is a late document of a closed business day (A1.1 item 5).
      required:
      - id
      - outlet_id
      - number
      - doc_type
      - source_kind
      - order_type
      - eco
      - business_date
      - invoice_date
      - finalized_at
      - device_id
      - calc_v
      - price_mode
      - total
      - round_off
      - paid
      - payment_status
      - credited
      - verification
      - late
    BillDetail:
