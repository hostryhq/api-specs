          description: Shown and totalled by this name.
          maxLength: 30
          example: Coupon
        enabled:
          type: boolean
          description: Whether it is offered.
      required:
      - id
      - outlet_id
      - kind
      - name
      - enabled
    OutletBillingConfig:
      type: object
      description: Everything billing holds about how an outlet bills.
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        tax_profiles:
          type: array
          description: One per financial year, newest first.
          items:
            $ref: '#/components/schemas/OutletTaxProfile'
        settings:
          $ref: '#/components/schemas/BillingSettings'
        tenders:
          type: array
          description: Tenders.
          items:
            $ref: '#/components/schemas/TenderKind'
      required:
      - outlet_id
      - tax_profiles
      - settings
      - tenders
    SetOutletTaxProfile:
      type: object
      description: Edit of the GST profile; also carries the price mode, which RM-T2 places in the same strong session.
      properties:
        financial_year:
          type: string
          description: Four-digit FY.
          pattern: ^[0-9]{4}$
          example: '2627'
        specified_premises:
          type: boolean
          description: Specified-premises flag for that FY.
        fssai_number:
          type: string
          description: 14 digits.
          pattern: ^[0-9]{14}$
          example: '12345678901234'
        price_mode:
          type: string
          description: exclusive or inclusive.
          enum:
          - exclusive
          - inclusive
          example: exclusive
      required:
      - financial_year
      - specified_premises
    SetNumberingMode:
      type: object
      description: Change of the numbering trigger.
      properties:
        number_at:
          type: string
          description: settle or print.
          enum:
          - settle
          - print
          example: print
      required:
      - number_at
    SetDiscountLimit:
      type: object
      description: Change of the cashier discount limit.
      properties:
        discount_limit_bp:
          type: integer
          description: Limit in basis points of the bill, 0 to 10000.
          minimum: 0
          maximum: 10000
          example: 1500
      required:
      - discount_limit_bp
    ConfigChange:
      type: object
      description: Result of a strong-session setting change; the op was emitted to the outlet stream.
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        op_id:
          type: string
          description: Identity of the emitted op.
          example: cloud-1/outlet:0190a1b2/731
      required:
      - outlet_id
      - updated_at
      - op_id
    TaxRule:
      type: object
      description: One mapping of (tax class, regime, specified-premises flag, order channel) to rate components
        and a document type. Components for an intra-state supply are two equal halves; igst_bp is 0 in Phase 2
        (RM-T8). Maps one-to-one to the tax_rule entity.
      properties:
        tax_class:
          type: string
          description: Tax class key.
          pattern: ^[a-z][a-z0-9_]{1,31}$
          example: fnb_standard
        regime:
          type: string
          description: Registration regime.
          enum:
          - regular
          - composition
          - unregistered
          example: regular
        specified_premises:
          type: boolean
          description: Specified-premises flag of the outlet for the FY.
        order_channel:
          type: string
          description: Order channel; eco supplies may carry their own rule.
          enum:
          - dine_in
          - takeaway
          - counter
          - eco
          example: dine_in
        doc_type:
          $ref: '#/components/schemas/BillDocType'
        gst_applies:
          type: boolean
          description: False for non-GST items (for example alcohol) and for composition and unregistered.
        cgst_bp:
          type: integer
          description: CGST in basis points.
          minimum: 0
          maximum: 2800
          example: 250
        sgst_bp:
          type: integer
          description: SGST in basis points; equals cgst_bp.
          minimum: 0
          maximum: 2800
          example: 250
        igst_bp:
          type: integer
          description: IGST in basis points; must be 0 in Phase 2.
          minimum: 0
          maximum: 0
          example: 0
        sac:
          type: string
          description: SAC or HSN code, up to 8 digits; not shipped until the CA advises (RM-T7).
          pattern: ^[0-9]{4,8}$
      required:
      - tax_class
      - regime
      - specified_premises
      - order_channel
      - doc_type
      - gst_applies
      - cgst_bp
      - sgst_bp
      - igst_bp
    TaxRuleSet:
      type: object
      description: 'A published tax rule set as a tenant sees it: immutable, no end date until superseded, so a
        device always has a rule (R6.3). Rates are Hostry''s data, never typed by an owner.'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        version:
          type: integer
          description: Platform-wide version number, rising.
          minimum: 1
          example: 1
        name:
          type: string
          description: Label.
          maxLength: 80
          example: GST restaurant services 2026
        effective_date:
          type: string
          description: First IST invoice date the version applies to.
          format: date
          example: '2026-11-24'
        calc_v:
          type: integer
          description: Calculation version the set is meant for.
          minimum: 1
          example: 1
        review_status:
          type: string
          description: unreviewed marks a draft rule set built before CA sign-off (ADR-0014 Data needed 1); a production
            publication needs a sign-off record.
          enum:
          - reviewed
          - unreviewed
          example: unreviewed
        content_hash:
          type: string
          description: SHA-256 of the canonical rules, lowercase hex.
          example: a3f5c0de9d1b7e44c2f9a8b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6
        published_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        rules:
          type: array
          description: Mappings.
          items:
            $ref: '#/components/schemas/TaxRule'
      required:
      - id
      - version
      - name
      - effective_date
      - calc_v
      - review_status
      - content_hash
      - published_at
      - rules
    TaxRuleSetPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of TaxRuleSet items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/TaxRuleSet'
    SignOff:
      type: object
      description: The CA sign-off record (reviewer, date and a reference note); immutable once signed.
      properties:
        reviewer_name:
          type: string
          description: Reviewer's name.
          maxLength: 80
          minLength: 2
          example: A. Reviewer
        signed_on:
          type: string
          description: Date of sign-off.
          format: date
          example: '2026-11-24'
        reference_note:
          type: string
          description: Where the advice is recorded, at least 10 characters.
          maxLength: 200
          minLength: 10
          example: CA advice note 2026-11 ref 12
      required:
      - reviewer_name
      - signed_on
      - reference_note
    TaxRuleSetMaster:
      type: object
      description: 'A rule-set version in the vendor master: draft (editable), signed (immutable, sign-off recorded)
        or published (emitted to every organisation).'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        version:
          type: integer
          description: Platform-wide version number, assigned at creation.
          minimum: 1
          example: 2
        revision:
          type: integer
          description: Edit counter of a draft; the ETag is its string form.
          minimum: 1
          example: 1
        name:
          type: string
          description: Label.
          maxLength: 80
          example: GST restaurant services 2026 B
        effective_date:
          type: string
          description: Effective date; immutable from signing.
          format: date
          example: '2026-11-24'
        calc_v:
          type: integer
          description: Calculation version.
          minimum: 1
          example: 1
        state:
          type: string
          description: draft, signed or published. A published version is never edited, withdrawn or deleted (BR-A1-81).
          enum:
          - draft
          - signed
          - published
          example: draft
        review_status:
          type: string
          description: reviewed (sign-off recorded) or unreviewed.
          enum:
          - reviewed
          - unreviewed
          example: unreviewed
        signoff:
          $ref: '#/components/schemas/SignOff'
        content_hash:
          type: string
          description: Hash stored at signing.
          example: a3f5c0de9d1b7e44c2f9a8b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6
        rules:
          type: array
          description: Mappings.
          items:
            $ref: '#/components/schemas/TaxRule'
        organisations_total:
          type: integer
          description: Organisations the version was queued for (published only).
          minimum: 0
          example: 0
        organisations_acknowledged:
          type: integer
          description: Acknowledged emits (BR-A1-84); counts only, no tenant data.
          minimum: 0
          example: 0
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        published_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - version
      - revision
      - name
      - effective_date
      - calc_v
      - state
      - review_status
      - rules
      - created_at
    TaxRuleSetMasterPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of TaxRuleSetMaster items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/TaxRuleSetMaster'
    TaxRuleSetDraft:
      type: object
      description: Content of a draft.
      properties:
        name:
          type: string
          description: Label.
          maxLength: 80
          example: GST restaurant services 2026 B
        effective_date:
          type: string
          description: Effective date.
          format: date
          example: '2026-11-24'
        calc_v:
          type: integer
          description: Calculation version.
          minimum: 1
          example: 1
        rules:
          type: array
          description: Mappings.
          items:
            $ref: '#/components/schemas/TaxRule'
      required:
      - name
      - effective_date
      - calc_v
      - rules
    TaxRuleSetValidation:
      type: object
      description: Outcome of the BR-A1-82 checks and the shared conformance vectors.
      properties:
        valid:
          type: boolean
          description: True when every check and every vector passes.
        errors:
          type: array
          description: Failed checks.
          items:
            type: object
            description: One failed check.
            properties:
              code:
                type: string
                description: Stable code, for example mapping_missing, odd_rate, unequal_halves, vector_failed.
                example: mapping_missing
              detail:
                type: string
                description: Which mapping or vector.
                example: fnb_standard/regular/false/dine_in
            required:
            - code
            - detail
        vectors_total:
          type: integer
          description: Conformance vectors run.
          minimum: 0
          example: 48
        vectors_passed:
          type: integer
          description: Vectors passed.
          minimum: 0
          example: 48
      required:
      - valid
      - errors
      - vectors_total
      - vectors_passed
    SignTaxRuleSet:
      type: object
      description: Sign-off of a validated draft.
      properties:
        signoff:
          $ref: '#/components/schemas/SignOff'
      required:
      - signoff
    PublishTaxRuleSet:
      type: object
      description: Publication request; the grant header carries the approval.
      properties:
        note:
          type: string
          description: Optional note for the vendor log, at most 200 characters, no personal data.
          maxLength: 200
          example: Notified rate change
    EntityDigest:
      type: object
      description: Hash of the canonical state of one entity for a business day.
      properties:
        entity:
          type: string
          description: Synced entity name.
          example: bill
        row_count:
          type: integer
          description: Rows included.
          minimum: 0
          example: 12
        hash:
          type: string
          description: Lowercase hex SHA-256 of the canonical rows.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      required:
      - entity
      - row_count
      - hash
    ProjectionDigest:
      type: object
      description: 'Digest of this service''s projection of one outlet business day, to compare with a device''s
        local state (ADR-0014 tests T2, T9, T11). x-provisional: the canonical-row rule belongs to go-common/sync.'
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        business_date:
          type: string
          description: Business date digested.
          format: date
          example: '2026-11-24'
        algorithm:
          type: string
          description: Digest algorithm id.
          enum:
          - sha256-canon-v1
          example: sha256-canon-v1
        state_hash:
          type: string
          description: SHA-256 over the entity digests in entity-name order.
          example: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
        entities:
          type: array
          description: Per-entity digests, entity name ascending.
          items:
            $ref: '#/components/schemas/EntityDigest'
        computed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - outlet_id
      - business_date
      - algorithm
      - state_hash
      - entities
      - computed_at
  responses:
    PreconditionFailed:
      description: If-Match did not match the current revision.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:precondition_failed
            title: Stale version
            status: 412
            code: precondition_failed
    GrantRefused:
      description: Grant missing (grant.required), used, expired or for another subject (grant.subject_mismatch).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:grant.used
            title: Approval grant refused
            status: 403
            code: grant.used
    LeadTooShort:
      description: The effective date is less than the lead time (deployment configuration, at least 24 hours) ahead
        when publication executes.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:effective_date_too_soon
            title: Effective date too soon
            status: 422
            code: effective_date_too_soon
    NotSigned:
      description: The version is not in the state this operation needs.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:not_signed
            title: Rule set not signed
            status: 409
            code: not_signed
    OpenChecks:
      description: number_at changes only with no open check on the outlet (RM-O21).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:open_checks_exist
            title: Open checks exist
            status: 409
            code: open_checks_exist
    StrongSessionRequired:
      description: The permission is strong_only and the session is a pin or device session.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:strong_session_required
            title: Strong session required
            status: 403
            code: strong_session_required
