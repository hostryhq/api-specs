          to:
            type: string
            description: Last business date included.
            format: date
            example: '2026-11-24'
          basis:
            type: string
            description: 'Date basis of the report: business_date for operational reports.'
            enum:
            - business_date
            example: business_date
          items:
            type: array
            description: Rows, oldest first.
            items:
              $ref: '#/components/schemas/PresentLogRow'
          totals:
            type: object
            description: Totals over the whole range, not only this page.
            properties:
              presents:
                type: integer
                description: Presents in range.
                minimum: 0
                example: 1
              presents_without_bill:
                type: integer
                description: Presented checks that did not end billed.
                minimum: 0
                example: 1
            required:
            - presents
            - presents_without_bill
        required:
        - outlet_id
        - from
        - to
        - basis
        - items
        - totals
    OpenCheckRow:
      type: object
      description: 'An open or carried-over check (report 11): not billed, not cancelled at the report moment.'
      properties:
        check_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        seating_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        table_name:
          type: string
          description: Table name snapshot.
          example: T4
        label:
          type: string
          description: Check label.
          example: Guest 2
        opened_business_date:
          type: string
          description: Business date the check was opened.
          format: date
          example: '2026-11-24'
        carried_over:
          type: boolean
          description: True when opened on an earlier business date.
        presented:
          type: boolean
          description: Whether a pre-bill was presented.
        line_count:
          type: integer
          description: Lines not cancelled.
          minimum: 0
          example: 3
        list_total:
          $ref: ../../../common/components.yaml#/components/schemas/Money
      required:
      - check_id
      - seating_id
      - table_name
      - label
      - opened_business_date
      - carried_over
      - presented
      - line_count
      - list_total
    OpenChecksReport:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: 'An open or carried-over check (report 11): not billed, not cancelled at the report moment.'
        properties:
          outlet_id:
            $ref: ../../../common/components.yaml#/components/schemas/Id
          from:
            type: string
            description: First business date included.
            format: date
            example: '2026-11-24'
          to:
            type: string
            description: Last business date included.
            format: date
            example: '2026-11-24'
          basis:
            type: string
            description: 'Date basis of the report: business_date for operational reports.'
            enum:
            - business_date
            example: business_date
          items:
            type: array
            description: Rows, oldest first.
            items:
              $ref: '#/components/schemas/OpenCheckRow'
          totals:
            type: object
            description: Totals over the whole range, not only this page.
            properties:
              count:
                type: integer
                description: Open checks.
                minimum: 0
                example: 1
              list_total:
                $ref: ../../../common/components.yaml#/components/schemas/Money
            required:
            - count
            - list_total
        required:
        - outlet_id
        - from
        - to
        - basis
        - items
        - totals
    EntityDigest:
      type: object
      description: Hash of the canonical state of one entity for a business day.
      properties:
        entity:
          type: string
          description: Synced entity name.
          example: order_line
        row_count:
          type: integer
          description: Rows included.
          minimum: 0
          example: 120
        hash:
          type: string
          description: Lowercase hex SHA-256 of the canonical rows.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      required:
      - entity
      - row_count
      - hash
    ProjectionDigest:
      type: object
      description: 'Digest of this service''s projection of one outlet business day, to compare with a device''s
        local state (ADR-0014 test T9). x-provisional: the canonical-row rule belongs to go-common/sync.'
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        business_date:
          type: string
          description: Business date digested.
          format: date
          example: '2026-11-24'
        algorithm:
          type: string
          description: Digest algorithm id.
          enum:
          - sha256-canon-v1
          example: sha256-canon-v1
        state_hash:
          type: string
          description: SHA-256 over the entity digests in entity-name order.
          example: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
        entities:
          type: array
          description: Per-entity digests, entity name ascending.
          items:
            $ref: '#/components/schemas/EntityDigest'
        computed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - outlet_id
      - business_date
      - algorithm
      - state_hash
      - entities
      - computed_at
    OpenCheckCount:
      type: object
      description: How many checks of the outlet are open (not billed, cancelled or closed internally).
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        open_checks:
          type: integer
          description: Open checks.
          minimum: 0
          example: 0
        as_of:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - outlet_id
      - open_checks
      - as_of
