openapi: 3.1.0
info:
  title: Hostry sync gateway and hub API
  version: 1.0.0
  x-status: stable
  description: Wire contract of Sync Protocol v1 (ADR-0002, with Amendments A1, A2 and A2.8) and the internal cloud emit operation
    (ADR-0014 A2.2). Device operations are spoken by the cloud sync gateway and by the LAN hub (the hub does not offer quarantine-upload
    and the admin read-backs; it answers 404). Paths of the protocol sit under /sync/v1, an exception to the /v1 rule (ADR-0002
    S10); the emit operation is under /internal/v1. Rules that JSON Schema cannot state (canonical form, hashing, chain, seal,
    endorsement, attestation, LAN handshake proofs and session token, size limit, the sync.op event) are in sync/protocol-v1.md and are normative;
    shared vectors are in sync/conformance/v1.json.
  x-example-worlds:
    base: Organisation 4a60, brand 4a6a, outlet 4a61, device 4a5e (pos) that has recorded two menu.availability.set ops (seq
      1 and 2) on stream outlet:4a61 and signed a seal at seq 2 with the key whose public half is in the conformance example
      pack; the gateway is epoch cloud-1 and holds both ops. Member Asha 4a64 is the actor. For emitOps the caller is the
      catalog service and no emit with the example key exists yet.
servers:
- url: /
tags:
- name: sync
  description: Device and hub sync.
- name: admin
  description: Member-token read-backs and quarantine decisions (cloud only).
- name: internal
  description: Operations for other Hostry services.
security:
- deviceBearer: []
- lanSession: []
paths:
  /sync/v1/lan/hello:
    post:
      operationId: helloLan
      tags:
      - sync
      x-permission: public
      summary: 'LAN handshake, step 1: the device presents its credential and a nonce; the hub answers with its own and a proof.'
      description: 'LAN only (the cloud answers 404). Spoken over TLS 1.3 to a hub that presents a self-signed certificate nobody checks; the device
        has computed `spki` (SHA-256 of the certificate''s DER SubjectPublicKeyInfo) and sends nothing but this call until it has verified the answer
        (ADR-0002 A3.1 items 3 and 4). The device checks: the hub credential''s signature against the identity keys in its own pack (current or next),
        kind `hub`, same tenant and outlet, `not_after`, not in its revoked list, `hub_proof`, and that the proof''s `spki` is the one it saw. Any failure
        and the device closes the connection. The hub keeps `nonce_h` for 30 seconds for step 2. Each call is a new handshake: an Idempotency-Key is accepted and ignored (a replayed answer would be a replayed nonce).
        Wire form, messages and vectors: sync/protocol-v1.md (LAN handshake) and sync/conformance/v1.json (`lan_handshake`).'
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanHelloRequest'
            example:
              credential: cred.jws.example
              nonce_d: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
      responses:
        '200':
          description: The hub's credential, nonce and proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanHelloResponse'
              example:
                credential: cred.jws.example
                nonce_h: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8
                hub_proof: proof.sig.example
        '401':
          description: The device's credential is not acceptable to the hub (signature, kind, outlet, `not_after`, revoked, or a `store` the hub refuses).
          content:
            application/problem+json:
              schema:
                $ref: ../../../common/components.yaml#/components/schemas/Problem
              example:
                type: urn:hostry:problem:lan_credential_refused
                title: The credential is not acceptable
                status: 401
                code: lan_credential_refused
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /sync/v1/lan/session:
    post:
      operationId: openLanSession
      tags:
      - sync
      x-permission: public
      summary: 'LAN handshake, step 2: the device proves itself and receives the session token.'
      description: 'The device has verified the hub (helloLan) and now signs its own proof over the same nonces, both device ids and the `spki` it saw.
        The hub checks the device credential, the proof, and that the proof''s `spki` is its own certificate''s; a relay on the Wi-Fi presented its own
        certificate to the device, so the two values differ and the hub refuses (401 `lan_proof_invalid`, nothing else is sent). The token is 256 random
        bits, kept in hub memory only, bound to the device id, valid 15 minutes (900 seconds). Every other LAN call carries it in the
        `Hostry-Lan-Session` header; `401 lan_session_expired` means a new handshake. The hub drops a device''s sessions when a pack refresh lists the
        device revoked. A restart of the hub (new TLS key) also ends every session.'
      security: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanSessionRequest'
            example:
              nonce_d: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
              nonce_h: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8
              device_proof: proof.sig.example
      responses:
        '200':
          description: The LAN session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanSession'
              example:
                token: AwoRGB8mLTQ7QklQV15lbHN6gYiPlp2kq7K5wMfO1dw
                expires_in: 900
        '401':
          description: Proof invalid (including a different `spki`), unknown or lapsed `nonce_h`.
          content:
            application/problem+json:
              schema:
                $ref: ../../../common/components.yaml#/components/schemas/Problem
              example:
                type: urn:hostry:problem:lan_proof_invalid
                title: The proof is not valid
                status: 401
                code: lan_proof_invalid
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /sync/v1/hello:
    post:
      operationId: helloSync
      tags:
      - sync
      x-permission: sync.push
      summary: 'Handshake: upstream time, restore epoch and the upstream vector.'
      description: Idempotent. Also compares the caller's epoch and vector with the upstream (ADR-0002 A2.2 re-offer). A hub
        answers with the epoch it last heard from the cloud.
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelloRequest'
            example:
              protocol: 1
              app_version: 1.0.0
              schema_version: 1
              vector:
                0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e/outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61: 2
              epoch: cloud-1
      responses:
        '200':
          description: Handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
              example:
                protocol: 1
                role: cloud
                node_id: cloud-1
                time: '2026-11-24T13:05:11.120Z'
                epoch: cloud-1
                vector:
                  0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e/outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61: 2
                min_supported_version: 1.0.0
                snapshot_required: false
                streams:
                - outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
        '401':
          description: Unauthorized. On a hub the problem code `lan_session_expired` means the LAN session token is missing, unknown or past its 15
            minutes, and the device runs helloLan again (ADR-0002 A3.1 item 5). The same applies to every other operation on a hub.
          content:
            application/problem+json:
              schema:
                $ref: ../../../common/components.yaml#/components/schemas/Problem
              examples:
                unauthorized:
                  value:
                    type: urn:hostry:problem:unauthorized
                    title: Unauthorized
                    status: 401
                    code: unauthorized
                lan_session_expired:
                  value:
                    type: urn:hostry:problem:lan_session_expired
                    title: The LAN session has expired
                    status: 401
                    code: lan_session_expired
  /sync/v1/push:
    post:
      operationId: pushOps
      tags:
      - sync
      x-permission: sync.push
      summary: Deliver ops in per-origin sequence order; each (origin, stream) group ends at a sealed op.
      description: 'Idempotent: a replay returns the same vector and holds, because the vector makes every request safe to
        repeat. Idempotency-Key is accepted and ignored. Content-Encoding gzip is allowed. An op whose `body` is over 262144
        bytes, or whose `pii` is over 16384 bytes, is refused as malformed and quarantined as an opaque body (protocol-v1,
        size limit).'
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
            example:
              items:
              - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                seq: 1
                h: 7a12848dfd8c7c9dce262261d97432158905aeb5f99798239d4583528921b057
                body: '{"actor":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64","at":"2026-11-24T13:05:11.120Z","clk":"sync","hlc":"01a1ee565e000000","intent":"menu.availability.set","intent_v":1,"muts":[{"e":"item_outlet","f":{"available":false},"id":"a7ac8341-e6c5-58a2-8a75-d00c40f77035","k":"set"}],"origin":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e","ph":"9b47040fc954b008feead3268b905c243a183232441bf09e34e467054c975a12","seq":1,"stream":"outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61","tenant_id":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60","v":1}'
              - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                seq: 2
                h: 0b71e1e03d843c58287105ce8d23ee7fa18798cbf0acd98b1e3ed1f16984f8e4
                body: '{"actor":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64","at":"2026-11-24T13:06:11.120Z","clk":"sync","hlc":"01a1ee565e000001","intent":"menu.availability.set","intent_v":1,"muts":[{"e":"item_outlet","f":{"available":true},"id":"a7ac8341-e6c5-58a2-8a75-d00c40f77035","k":"set"}],"origin":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e","ph":"7a12848dfd8c7c9dce262261d97432158905aeb5f99798239d4583528921b057","seq":2,"stream":"outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61","tenant_id":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60","v":1}'
              seals:
              - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                seq: 2
                h: 0b71e1e03d843c58287105ce8d23ee7fa18798cbf0acd98b1e3ed1f16984f8e4
                kid: dev-4a5e-1
                sig: n-oto2B6z6BdDxfEgHunsutAtpicbslkAvPbrPeEAEYm1es3xZwn9JeNWEnPeYGWHpwpC3hBROmAsWZXM0Bdaw
      responses:
        '200':
          description: Stored ops, the new vector, own held slots and refusals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
              example:
                epoch: cloud-1
                vector:
                  0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e/outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61: 2
                held: []
                refused: []
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/pull:
    post:
      operationId: pullOps
      tags:
      - sync
      x-permission: sync.push
      summary: Slots above the caller's vector, up to a seal boundary; held slots as placeholders.
      description: Items carry `pii` for a pos, waiter, personal or hub caller of the same outlet and never for a caller whose credential kind
        is kds, which gets the commitments in the sealed body only (ADR-0014 A3.1). One rule on the envelope; the hub applies it too.
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequest'
            example:
              vector: {}
              streams:
              - outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
              limit: 500
      responses:
        '200':
          description: A batch of ops with seals, credentials and endorsements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
              example:
                epoch: cloud-1
                items:
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  seq: 1
                  h: 7a12848dfd8c7c9dce262261d97432158905aeb5f99798239d4583528921b057
                  body: '{"actor":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64","at":"2026-11-24T13:05:11.120Z","clk":"sync","hlc":"01a1ee565e000000","intent":"menu.availability.set","intent_v":1,"muts":[{"e":"item_outlet","f":{"available":false},"id":"a7ac8341-e6c5-58a2-8a75-d00c40f77035","k":"set"}],"origin":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e","ph":"9b47040fc954b008feead3268b905c243a183232441bf09e34e467054c975a12","seq":1,"stream":"outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61","tenant_id":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60","v":1}'
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  seq: 2
                  h: 0b71e1e03d843c58287105ce8d23ee7fa18798cbf0acd98b1e3ed1f16984f8e4
                  body: '{"actor":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64","at":"2026-11-24T13:06:11.120Z","clk":"sync","hlc":"01a1ee565e000001","intent":"menu.availability.set","intent_v":1,"muts":[{"e":"item_outlet","f":{"available":true},"id":"a7ac8341-e6c5-58a2-8a75-d00c40f77035","k":"set"}],"origin":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e","ph":"7a12848dfd8c7c9dce262261d97432158905aeb5f99798239d4583528921b057","seq":2,"stream":"outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61","tenant_id":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60","v":1}'
                seals:
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  seq: 2
                  h: 0b71e1e03d843c58287105ce8d23ee7fa18798cbf0acd98b1e3ed1f16984f8e4
                  kid: dev-4a5e-1
                  sig: n-oto2B6z6BdDxfEgHunsutAtpicbslkAvPbrPeEAEYm1es3xZwn9JeNWEnPeYGWHpwpC3hBROmAsWZXM0Bdaw
                more: false
                own_held: []
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/snapshot:
    get:
      operationId: getSnapshot
      tags:
      - sync
      x-permission: sync.push
      summary: Materialised rows, void set and vector, for bootstrap (simplest form).
      description: A row carries `pii_c` (pii field to commitment) always and `pii` (values and salts, as in Item.pii) only for a caller whose
        credential kind is pos, waiter, personal or hub; a kds caller gets no `pii` (ADR-0014 A3.1).
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
              example:
                epoch: cloud-1
                vector:
                  0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e/outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61: 2
                rows:
                - e: item_outlet
                  id: a7ac8341-e6c5-58a2-8a75-d00c40f77035
                  f:
                    available: true
                  gone: false
                voids: []
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/poke:
    get:
      operationId: pokeWait
      tags:
      - sync
      x-permission: sync.push
      summary: Long poll that carries no data; returns a counter that moves when the node has new ops.
      description: The proof of concept uses a long poll instead of a WebSocket; the device then pulls.
      parameters:
      - name: after
        in: query
        required: false
        description: Last counter seen.
        schema:
          type: integer
          format: int64
        example: 41
      - name: wait
        in: query
        required: false
        description: Seconds to wait (default 25).
        schema:
          type: integer
          minimum: 0
          maximum: 59
        example: 25
      responses:
        '200':
          description: Counter.
          content:
            application/json:
              schema:
                type: object
                description: The change counter.
                required:
                - n
                properties:
                  n:
                    type: integer
                    format: int64
                    description: Counter.
              example:
                n: 42
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/quarantine-upload:
    post:
      operationId: uploadQuarantine
      tags:
      - sync
      x-permission: sync.drain
      summary: Cloud only. The single endpoint a drain token may call (ADR-0005 section 4, ADR-0002 A1.3).
      description: 'Drain token of a revoked device: its own-origin ops only; the last upload has no items and carries the signed `drain_statement` (ADR-0005 A3.3). Recovery drain token (subject `recovers:<old
        device id>`, held by the new device): the old origin''s unconfirmed ops with stored seals and one attestation per
        stream. Everything uploaded is stored in quarantine without judging its content. Any other token, endpoint or origin:
        401/403, nothing stored.'
      security:
      - drainBearer: []
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
            example:
              items:
              - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                seq: 1
                h: 7a12848dfd8c7c9dce262261d97432158905aeb5f99798239d4583528921b057
                body: '{"actor":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64","at":"2026-11-24T13:05:11.120Z","clk":"sync","hlc":"01a1ee565e000000","intent":"menu.availability.set","intent_v":1,"muts":[{"e":"item_outlet","f":{"available":false},"id":"a7ac8341-e6c5-58a2-8a75-d00c40f77035","k":"set"}],"origin":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e","ph":"9b47040fc954b008feead3268b905c243a183232441bf09e34e467054c975a12","seq":1,"stream":"outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61","tenant_id":"0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60","v":1}'
              seals: []
              attestations: []
      responses:
        '200':
          description: Stored in quarantine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
              example:
                epoch: cloud-1
                vector:
                  0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e/outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61: 1
                held:
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  seq: 1
                  code: pending
                refused: []
                drained: true
        '403':
          description: The token is not a drain token for this origin.
          content:
            application/problem+json:
              schema:
                $ref: ../../../common/components.yaml#/components/schemas/Problem
              example:
                type: urn:hostry:problem:forbidden
                title: Permission denied
                status: 403
                code: forbidden
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/quarantine:
    get:
      operationId: listQuarantine
      tags:
      - admin
      x-permission: sync.quarantine.read
      summary: Cloud only, member token. The held list with reasons (never sent to devices).
      security:
      - memberBearer: []
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineList'
              example:
                items:
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
                  stream: outlet:0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  seq: 3
                  reason: unsealed_tail
                  received_at: '2026-11-24T13:07:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /sync/v1/exceptions:
    get:
      operationId: listExceptions
      tags:
      - admin
      x-permission: sync.exceptions.read
      summary: Cloud only, member token. Flagged ops with their marks. The only place flags and attribution labels are readable;
        never reachable with a device token (ADR-0002 A1.2 item 2).
      security:
      - memberBearer: []
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionList'
              example:
                items:
                - origin: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e
