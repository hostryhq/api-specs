  /v1/tax-registrations/{registration_id}/closure:
    put:
      operationId: closeTaxRegistration
      summary: Close a tax registration and its series
      description: 'ADR-0003 A1.1 item 6, ADR-0014 A2.5 item 1: a verified GSTIN is fixed, so a different GSTIN is a new registration
        and the old one is closed here together with all its series. Every open series becomes closed; this operation never
        sets closed_unreconciled, because tenancy cannot know what a device still holds. The series reads "closed, awaiting
        device" until the device states its last number (series.close) and billing publishes billing.series.reconciled, which
        fills tail_confirmed_at and last_number. 409 registration_in_use while an outlet still references the registration:
        move the outlet first with changeOutletTaxRegistration. Closing is terminal and idempotent. Publishes
        tenancy.series.closed for every series it closes.'
