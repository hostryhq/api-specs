openapi: 3.1.0
info:
  title: Hostry tenancy API
  version: 1.0.0
  description: Organisations, brands, outlets and properties, tax registrations, the document-series registry,
    organisation settings, link control plane and the vendor directory (ADR-0003 with Amendment A1; ADR-0013
    V3, V4). The tenant is always the caller's organisation from the token; no tenant id appears in tenant-realm
    paths or bodies. Operations under /internal/v1 are for other services and the admin service and declare
    x-service-callers; vendor operations there take the organisation from the path and need the admin
    service token plus the vendor user's access token. Link routes exist only when LINKS_ENABLED is true
    (default false) and carry no data crossing in Phase 1. Reads marked support_viewable in the permission
    catalogue also serve a support token (view mode), which is accepted only together with the admin service
    token.
  x-status: stable
  x-example-worlds:
    base: "Organisation 4a60 (trial) with default brand 4a6a, outlet 4a61 (restaurant, state 33) and registration 4a6b (GSTIN 33ABCDE1234F1Z7, unverified, open). No series, no links, settings 7 days / 5 minutes, state table with 29 and 33. The caller is the organisation owner in a strong session. LINKS_ENABLED is false."
    empty: "No organisation exists and no verified holder of GSTIN 33ABCDE1234F1Z7. The caller is a vendor user with the admin service token."
    registration-verified: "The base world with registration 4a6b verified (certificate_seen at 13:10:11) and no series issued yet. Device 4a5e exists in identity."
    series-issued: "The registration-verified world after identity issued series for device 4a5e: tax_invoice 4a6c (code A7K) and credit_note 4a95 (code A7M), both active since 13:15:11."
    registration-spare-verified: "The base world plus a second open registration 4a93 (GSTIN 29ABCDE1234F1ZW, state 29, verified at 13:10:11) that no outlet references and that has no series."
    link-none: "The base world with LINKS_ENABLED true, organisation 4a63 (Example Restaurants, outlet 4a94, registration with verified GSTIN 33AAAAA0000A1Z9) existing, and no link."
    link-proposed-to-caller: "LINKS_ENABLED true. The caller is organisation 4a63 (outlet 4a94). Organisation 4a60 proposed link 4a62 (template on_premises_outlet, grant 4a72 test.echo.read outbound from 4a60 for outlet 4a61, pending) at 13:05:11; invitation code 7QK3M9XD7QK3M9XD is unused and unexpired. 4a60 has a verified registration 4a6b."
    link-accepted: "LINKS_ENABLED true. The caller is the proposer 4a60. Link 4a62 was accepted by 4a63 at 13:10:11 and awaits confirmation; grant 4a72 is pending."
    link-active: "LINKS_ENABLED true. The caller is the proposer 4a60. Link 4a62 is active (accepted 13:10:11, confirmed 13:20:11) with grant 4a72 active; activity holds link.proposed, link.accepted and link.confirmed. The service token of getLinkDecision acts for 4a63."
    link-suspended: "The link-active world after the caller suspended link 4a62; the caller is the suspending party."
    link-amendment-pending: "LINKS_ENABLED true. The caller is the acceptor 4a63. Link 4a62 is active; proposer 4a60 proposed amendment 4a73 (add grant test.echo.post outbound) at 13:05:11 and it is pending."
servers:
- url: /
tags:
- name: tenancy
  description: Tenancy service.
- name: links
  description: Link control plane (propose, accept, confirm, suspend, revoke). Registered only when LINKS_ENABLED
    is true.
- name: vendor
  description: Vendor directory and onboarding operations (admin service only).
- name: internal
  description: Operations for other Hostry services.
security:
- bearerAuth: []
paths:
  /v1/organisations/current:
    get:
      operationId: getCurrentOrganisation
      summary: Get the caller's organisation
      tags:
      - tenancy
      x-permission: organisation.read
      responses:
        '200':
          description: The organisation named by the token (also served to a support token for its one
            organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                name: Example Hospitality
                status: trial
                created_at: '2026-11-24T13:05:11.120Z'
                updated_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
    patch:
      operationId: updateCurrentOrganisation
      summary: Rename the organisation
      tags:
      - tenancy
      x-permission: organisation.manage
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganisation'
            example:
              name: Example Hospitality
      responses:
        '200':
          description: The updated organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                name: Example Hospitality
                status: trial
                created_at: '2026-11-24T13:05:11.120Z'
                updated_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/brands:
    get:
      operationId: listBrands
      summary: List brands
      tags:
      - tenancy
      x-permission: brand.read
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of brands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                  name: Example Hospitality
                  is_default: true
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
    post:
      operationId: createBrand
      summary: Create a brand
      tags:
      - tenancy
      x-permission: brand.manage
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrand'
            example:
              id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a91
              name: Example Bakery
      responses:
        '201':
          description: Brand created. A replay returns the same brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a91
                name: Example Bakery
                is_default: false
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/brands/{brand_id}:
    get:
      operationId: getBrand
      summary: Get a brand
      tags:
      - tenancy
      x-permission: brand.read
      parameters:
      - name: brand_id
        in: path
        required: true
        description: Brand ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                name: Example Hospitality
                is_default: true
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /v1/outlets:
    get:
      operationId: listOutlets
      summary: List outlets and properties
      tags:
      - tenancy
      x-permission: outlet.read
      x-outlet-scoped: true
      parameters:
      - name: kind
        in: query
        required: false
        description: Filter by kind.
        schema:
          $ref: '#/components/schemas/OutletKind'
        example: restaurant
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of outlets; a scoped member lists only granted outlets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                  name: Main Restaurant
                  kind: restaurant
                  status: active
                  state_code: '33'
                  tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                  timezone: Asia/Kolkata
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
    post:
      operationId: createOutlet
      summary: Create an outlet or property
      tags:
      - tenancy
      x-permission: outlet.create
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutlet'
            example:
              id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
              name: Garden Restaurant
              kind: restaurant
              state_code: '33'
              tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
      responses:
        '201':
          description: Outlet created. A replay returns the same outlet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
                brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                name: Garden Restaurant
                kind: restaurant
                status: active
                state_code: '33'
                tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                timezone: Asia/Kolkata
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/outlets/{outlet_id}:
    get:
      operationId: getOutlet
      summary: Get an outlet or property
      tags:
      - tenancy
      x-permission: outlet.read
      x-outlet-scoped: true
      parameters:
      - name: outlet_id
        in: path
        required: true
        description: Outlet or property ID (one ID space).
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
      responses:
        '200':
          description: The outlet. Another tenant's or an out-of-scope outlet is 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                name: Main Restaurant
                kind: restaurant
                status: active
                state_code: '33'
                tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                timezone: Asia/Kolkata
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
    patch:
      operationId: updateOutlet
      summary: Change an outlet
      tags:
      - tenancy
      x-permission: outlet.manage
      x-outlet-scoped: true
      parameters:
      - name: outlet_id
        in: path
        required: true
        description: Outlet or property ID (one ID space).
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutlet'
            example:
              name: Main Restaurant
      responses:
        '200':
          description: The updated outlet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                name: Main Restaurant
                kind: restaurant
                status: active
                state_code: '33'
                tax_registration_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                timezone: Asia/Kolkata
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/tax-registrations:
    get:
      operationId: listTaxRegistrations
      summary: List tax registrations
      tags:
      - tenancy
      x-permission: tax_registration.read
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of registrations with their verification state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRegistrationPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                  legal_name: Example Hospitality Pvt Ltd
                  regime: regular
                  gstin: 33ABCDE1234F1Z7
                  state_code: '33'
                  verification:
                    state: unverified
                  status: open
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
    post:
      operationId: createTaxRegistration
      summary: Create a tax registration
      tags:
      - tenancy
      x-permission: tax_registration.manage
      x-step-up: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxRegistration'
            example:
              id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a93
              legal_name: Example Hospitality Karnataka Pvt Ltd
              regime: regular
              gstin: 29ABCDE1234F1ZW
              state_code: '29'
      responses:
        '201':
          description: Registration created unverified. Identical response whether or not another organisation
            claims the GSTIN. GSTIN format and check character validated; unregistered takes no GSTIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRegistration'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a93
                legal_name: Example Hospitality Karnataka Pvt Ltd
                regime: regular
                gstin: 29ABCDE1234F1ZW
                state_code: '29'
                verification:
                  state: unverified
                status: open
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/tax-registrations/{registration_id}:
    get:
      operationId: getTaxRegistration
      summary: Get a tax registration
      tags:
      - tenancy
      x-permission: tax_registration.read
      parameters:
      - name: registration_id
        in: path
        required: true
        description: Tax registration ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
      responses:
        '200':
          description: The registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRegistration'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                legal_name: Example Hospitality Pvt Ltd
                regime: regular
                gstin: 33ABCDE1234F1Z7
                state_code: '33'
                verification:
                  state: unverified
                status: open
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
    patch:
      operationId: updateTaxRegistration
      summary: Correct an unverified registration
      description: '409 once the registration is verified: a different GSTIN is a new registration and
        the old one is closed with its series.'
      tags:
      - tenancy
      x-permission: tax_registration.manage
      x-step-up: true
      parameters:
      - name: registration_id
        in: path
        required: true
        description: Tax registration ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxRegistration'
            example:
              legal_name: Example Hospitality Pvt Ltd
      responses:
        '200':
          description: The corrected registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRegistration'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6b
                legal_name: Example Hospitality Pvt Ltd
                regime: regular
                gstin: 33ABCDE1234F1Z7
                state_code: '33'
                verification:
                  state: unverified
                status: open
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/tax-registrations/{registration_id}/closure:
    put:
      operationId: closeTaxRegistration
      summary: Close a tax registration and its series
      description: 'ADR-0003 A1.1 item 6: a verified GSTIN is fixed, so a different GSTIN is a new registration
        and the old one is closed here, together with all its series (status closed; a series with an
        unreconciled tail is closed with the unreconciled marker instead). 409 registration_in_use while
        an active outlet still references the registration. Closing is terminal and idempotent. Publishes
        no event in v1.'
      tags:
      - tenancy
      x-permission: tax_registration.manage
      x-example-world: registration-spare-verified
      x-step-up: true
      parameters:
      - name: registration_id
        in: path
        required: true
        description: Tax registration ID.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a93
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseRegistration'
            example:
              reason: Moved the Bengaluru outlets to a new GSTIN.
      responses:
        '200':
          description: Registration closed with its series. A replay returns the same registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRegistration'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a93
                legal_name: Example Hospitality Karnataka Pvt Ltd
                regime: regular
                gstin: 29ABCDE1234F1ZW
                state_code: '29'
                verification:
                  state: verified
                  method: certificate_seen
                  verified_at: '2026-11-24T13:10:11.120Z'
                status: closed
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/states:
    get:
      operationId: listStates
      summary: GST state reference table
      tags:
      - tenancy
      x-permission: authenticated
      responses:
        '200':
          description: Platform reference data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateList'
              example:
                items:
                - code: '29'
                  name: Karnataka
                - code: '33'
                  name: Tamil Nadu
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
  /v1/organisation-settings:
    get:
      operationId: getOrganisationSettings
      summary: Get organisation settings
      tags:
      - tenancy
      x-permission: settings.read
      responses:
        '200':
          description: Offline window and idle lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationSettings'
              example:
                offline_window_days: 7
                idle_lock_minutes: 5
                updated_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
    put:
      operationId: updateOrganisationSettings
      summary: Replace organisation settings
      tags:
      - tenancy
      x-permission: settings.manage
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
