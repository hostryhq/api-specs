components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 tenant-realm access token issued by identity (ADR-0005). One tenant per token.
        Support tokens are accepted only together with the admin service token.
    vendorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 vendor-realm access token. Refused by every tenant-facing operation.
    serviceAuth:
      type: apiKey
      in: header
      name: Hostry-Service-Token
      description: 60-second ES256 service token (ADR-0005 section 9). Operations under /internal/v1 accept
        it only from the callers in x-service-callers.
  schemas:
    OrganisationStatus:
      type: string
      description: Organisation lifecycle state. Phase 1 only reads and shows it; no operation changes
        it.
      enum:
      - trial
      - active
      - suspended
      - closed
      example: trial
    Organisation:
      type: object
      description: 'The organisation: the tenant, the isolation boundary and the owner of everything its
        staff create.'
      required:
      - id
      - name
      - status
      - created_at
      - updated_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 120
          example: Example Hospitality
        status:
          $ref: '#/components/schemas/OrganisationStatus'
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    UpdateOrganisation:
      type: object
      description: Rename the organisation.
      required:
      - name
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 120
          example: Example Hospitality
    Brand:
      type: object
      description: A trading name inside an organisation, the scope for shared masters. The default brand
        is created automatically.
      required:
      - id
      - name
      - is_default
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Brand name.
          minLength: 1
          maxLength: 120
          example: Example Hospitality
        is_default:
          type: boolean
          description: True for the automatically created default brand.
          example: true
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    BrandPage:
      type: object
      description: A page of brands.
      required:
      - items
      properties:
        items:
          type: array
          description: Brands on this page.
          items:
            $ref: '#/components/schemas/Brand'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateBrand:
      type: object
      description: Create a brand.
      required:
      - id
      - name
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Brand name.
          minLength: 1
          maxLength: 120
          example: Example Bakery
    OutletKind:
      type: string
      description: Outlet or property kind (one entity, one ID space; extensible).
      enum:
      - restaurant
      - bakery_outlet
      - production_unit
      - stall
      - property
      - service_point
      example: restaurant
    OutletStatus:
      type: string
      description: Outlet state.
      enum:
      - active
      - inactive
      example: active
    Outlet:
      type: object
      description: 'An outlet or property: one physical place with its own business date, devices, staff
        assignments and tax registration.'
      required:
      - id
      - brand_id
      - name
      - kind
      - status
      - state_code
      - tax_registration_id
      - timezone
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        brand_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Outlet name.
          minLength: 1
          maxLength: 120
          example: Main Restaurant
        kind:
          $ref: '#/components/schemas/OutletKind'
        status:
          $ref: '#/components/schemas/OutletStatus'
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        located_in_outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        timezone:
          type: string
          description: Always Asia/Kolkata in Phase 1.
          enum:
          - Asia/Kolkata
          example: Asia/Kolkata
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    OutletPage:
      type: object
      description: A page of outlets in the caller's scope.
      required:
      - items
      properties:
        items:
          type: array
          description: Outlets on this page.
          items:
            $ref: '#/components/schemas/Outlet'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateOutlet:
      type: object
      description: Create an outlet. The brand defaults to the default brand; the registration must belong
        to the organisation.
      required:
      - id
      - name
      - kind
      - state_code
      - tax_registration_id
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        brand_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Outlet name.
          minLength: 1
          maxLength: 120
          example: Main Restaurant
        kind:
          $ref: '#/components/schemas/OutletKind'
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        located_in_outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    UpdateOutlet:
      type: object
      description: Change an outlet.
      properties:
        name:
          type: string
          description: Outlet name.
          minLength: 1
          maxLength: 120
          example: Main Restaurant
        status:
          $ref: '#/components/schemas/OutletStatus'
    TaxRegime:
      type: string
      description: GST regime.
      enum:
      - regular
      - composition
      - unregistered
      example: regular
    VerificationMethod:
      type: string
      description: How the GSTIN was verified by Hostry staff.
      enum:
      - certificate_seen
      - gst_portal_lookup
      - other
      example: certificate_seen
    Verification:
      type: object
      description: GSTIN verification state (ADR-0003 A1.1).
      required:
      - state
      properties:
        state:
          type: string
          description: unverified until vendor staff verify; verified registrations are the only ones
            that can get series.
          enum:
          - unverified
          - verified
          - rejected
          example: unverified
        method:
          $ref: '#/components/schemas/VerificationMethod'
        verified_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        rejected_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    TaxRegistration:
      type: object
      description: A tax registration owned by the organisation; each outlet references exactly one. Kind
        unregistered has no GSTIN.
      required:
      - id
      - legal_name
      - regime
      - state_code
      - verification
      - status
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        legal_name:
          type: string
          description: Legal name.
          minLength: 1
          maxLength: 200
          example: Example Hospitality Pvt Ltd
        regime:
          $ref: '#/components/schemas/TaxRegime'
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        verification:
          $ref: '#/components/schemas/Verification'
        status:
          type: string
          description: Registration state.
          enum:
          - open
          - closed
          example: open
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    TaxRegistrationPage:
      type: object
      description: A page of tax registrations.
      required:
      - items
      properties:
        items:
          type: array
          description: Registrations on this page.
          items:
            $ref: '#/components/schemas/TaxRegistration'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CreateTaxRegistration:
      type: object
      description: Create a registration. A GSTIN already claimed by another organisation is accepted
        as unverified with the same response as any new registration; the tenant never learns who else
        holds it (ADR-0003 A1.1).
      required:
      - id
      - legal_name
      - regime
      - state_code
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        legal_name:
          type: string
          description: Legal name.
          minLength: 1
          maxLength: 200
          example: Example Hospitality Pvt Ltd
        regime:
          $ref: '#/components/schemas/TaxRegime'
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
    UpdateTaxRegistration:
      type: object
      description: Correct a registration while it is unverified. After verification a different GSTIN
        is a new registration.
      properties:
        legal_name:
          type: string
          description: Legal name.
          minLength: 1
          maxLength: 200
          example: Example Hospitality Pvt Ltd
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
    StateEntry:
      type: object
      description: One row of the GST state reference table.
      required:
      - code
      - name
      properties:
        code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        name:
          type: string
          description: State or union territory name.
          example: Tamil Nadu
    StateList:
      type: object
      description: The state reference table (platform reference data).
      required:
      - items
      properties:
        items:
          type: array
          description: States.
          items:
            $ref: '#/components/schemas/StateEntry'
    OrganisationSettings:
      type: object
      description: Organisation-wide settings read by support sessions and used to build offline packs.
      required:
      - offline_window_days
      - idle_lock_minutes
      - updated_at
      properties:
        offline_window_days:
          type: integer
          description: Offline window for PIN login and approvals (1 to 30, default 7).
          minimum: 1
          maximum: 30
          example: 7
        idle_lock_minutes:
          type: integer
          description: Idle lock for shared devices.
          minimum: 1
          maximum: 120
          example: 5
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    UpdateOrganisationSettings:
      type: object
      description: Replace the settings.
      required:
      - offline_window_days
      - idle_lock_minutes
      properties:
        offline_window_days:
          type: integer
          description: Offline window (1 to 30).
          minimum: 1
          maximum: 30
          example: 7
        idle_lock_minutes:
          type: integer
          description: Idle lock minutes.
          minimum: 1
          maximum: 120
          example: 5
    DocType:
      type: string
      description: Document type.
      enum:
      - tax_invoice
      - bill_of_supply
      - plain_bill
      - credit_note
      example: tax_invoice
    DocumentSeries:
      type: object
      description: A series code under a tax registration (unique per registration and per GSTIN; never
        issued twice).
      required:
      - id
      - tax_registration_id
      - code
      - doc_type
      - outlet_id
      - device_id
      - status
      - issued_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: Series code, 3 characters from capitals and digits without I, O, 0 and 1 (ADR-0002
            S7). Printed as <code>/<FY>/<running>.
          pattern: ^[A-HJ-NP-Z2-9]{3}$
          example: A7K
        doc_type:
          $ref: '#/components/schemas/DocType'
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        status:
          type: string
          description: Series state.
          enum:
          - dormant
          - active
          - closed
          - closed_unreconciled
          example: active
        issued_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        closed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        tail_confirmed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
          description: When billing confirmed that its register holds every number up to last_number (billing.series.reconciled). Empty at closure; a series that is closed and has no tail_confirmed_at reads "closed, awaiting device" (ADR-0014 A2.5 item 2).
        last_number:
          type: integer
          description: The last running number the device stated when it closed the series (control intent series.close, or its drain record). Empty at closure and until reconciled.
          minimum: 0
      additionalProperties: false
    DocumentSeriesPage:
      type: object
      description: A page of series in the caller's outlet scope.
      required:
      - items
      properties:
        items:
          type: array
          description: Series on this page.
          items:
            $ref: '#/components/schemas/DocumentSeries'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    CloseSeries:
      type: object
      description: Close a series whose device never reconciled. The reason is the record for the auditor.
      required:
      - reason
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
    IssueSeries:
      type: object
      description: Issue series codes for a device under the outlet's registration (identity is the only
        caller). The registration is read from the stored outlet, never from the request.
      required:
      - outlet_id
      - device_id
      - doc_types
      - state
      properties:
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        doc_types:
          type: array
          description: Document types to issue.
          items:
            $ref: '#/components/schemas/DocType'
          minItems: 1
          maxItems: 4
        state:
          type: string
          description: active for pos, dormant for waiter.
          enum:
          - active
          - dormant
          example: active
    SeriesIssuance:
      type: object
      description: Issued codes. A repeat for the same device and outlet returns the same codes.
      required:
      - items
      properties:
        items:
          type: array
          description: Issued series.
          items:
            $ref: '#/components/schemas/DocumentSeries'
    CloseDeviceSeries:
      type: object
      description: Close a device's series when it is re-bound, reinstalled, restored or revoked.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Why.
          enum:
          - rebound
          - reinstalled
          - restored
          - revoked
          example: reinstalled
    SeriesClosure:
      type: object
      description: Result of closing a device's series.
      required:
      - closed
      properties:
        closed:
          type: integer
          description: Number of series closed.
          minimum: 0
          example: 2
    LinkTemplate:
      type: string
      description: Named default scope set for the consent screen; authorisation looks at grants, never
        the template.
      enum:
      - on_premises_outlet
      - service_provider
      - supplier_buyer
      example: on_premises_outlet
    LinkStatus:
      type: string
      description: Link state. Only active authorises anything; accepted waits for the proposer to confirm
        the accepting organisation.
      enum:
      - proposed
      - accepted
      - active
      - suspended
      - declined
      - expired
      - revoked
      example: active
    LinkScope:
      type: string
      description: 'Link scope from the platform catalogue (Phase 1: test-only scopes). Tenants cannot
        invent scopes.'
      pattern: ^[a-z][a-z_]*(\.[a-z_]+)+$
      example: test.echo.read
    GrantInput:
      type: object
      description: A scope the proposer offers or asks for.
      required:
      - scope
      - direction
      properties:
        scope:
          $ref: '#/components/schemas/LinkScope'
        direction:
          type: string
          description: 'outbound: the caller is the grantor; inbound: the counterparty grants.'
          enum:
          - outbound
          - inbound
          example: outbound
        outlet_ids:
          type: array
          description: Outlets the grant is limited to; a grant whose data is synced to devices must name
            at least one.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
    LinkGrant:
      type: object
      description: A directional grant; the grantor owns the data or account the scope touches.
      required:
      - id
      - scope
      - direction
      - status
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        scope:
          $ref: '#/components/schemas/LinkScope'
        direction:
          type: string
          description: 'outbound: the caller grants.'
          enum:
          - outbound
          - inbound
          example: outbound
        outlet_ids:
          type: array
          description: Outlet constraint.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
        status:
          type: string
          description: Grant state.
          enum:
          - pending
          - active
          - removed
          example: active
    CounterpartyRegistration:
      type: object
      description: What the proposer sees before confirming (ADR-0003 A1.3).
      required:
      - legal_name
      - state_code
      - gstin_verified
      properties:
        legal_name:
          type: string
          description: Legal name.
          example: Example Restaurants LLP
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        gstin_verified:
          type: boolean
          description: Whether Hostry verified the GSTIN.
          example: true
    LinkCounterparty:
      type: object
      description: The other organisation, shown only once it has accepted (or, to the acceptor, about
        the proposer). Contains no member, device or contact data.
      required:
      - display_name
      - registrations
      properties:
        display_name:
          type: string
          description: Organisation display name.
          example: Example Restaurants
        registrations:
          type: array
          description: Registrations of the outlets placed in the link (all open registrations if none
            were named).
          items:
            $ref: '#/components/schemas/CounterpartyRegistration'
    Link:
      type: object
      description: A consented, revocable relationship between two organisations. It never gives access
        to tables.
      required:
      - id
      - template
      - status
      - role
      - grants
      - proposed_at
      - expires_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        template:
          $ref: '#/components/schemas/LinkTemplate'
        status:
          $ref: '#/components/schemas/LinkStatus'
        role:
          type: string
          description: Which side the caller is.
          enum:
          - proposer
          - acceptor
          example: proposer
        counterparty_organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        counterparty:
          $ref: '#/components/schemas/LinkCounterparty'
        grants:
          type: array
          description: Grants of this link.
          items:
            $ref: '#/components/schemas/LinkGrant'
        proposed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        expires_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        accepted_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        confirmed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    LinkPage:
      type: object
      description: A page of links.
      required:
      - items
      properties:
        items:
          type: array
          description: Links on this page.
          items:
            $ref: '#/components/schemas/Link'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    ProposeLink:
      type: object
      description: Propose a link. The inviter learns nothing about the counterparty until it accepts
        (no tenant enumeration).
      required:
      - id
      - template
      - grants
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        template:
          $ref: '#/components/schemas/LinkTemplate'
        grants:
          type: array
          description: Scopes offered and asked for.
          items:
            $ref: '#/components/schemas/GrantInput'
          minItems: 1
          maxItems: 20
        outlet_ids:
          type: array
          description: The caller's outlets placed in the link.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
    LinkProposal:
      type: object
      description: The proposed link and its one-time invitation code.
      required:
      - link
      properties:
        link:
          $ref: '#/components/schemas/Link'
        invitation_code:
          type: string
          description: At least 80 bits from a CSPRNG (16 characters of a 32-symbol alphabet), single
            use, 14 days. Shown once; also the QR payload. Absent on an idempotent replay and never stored, so a lost code is replaced with reissueLinkInvitation.
          pattern: ^[0-9A-HJKMNP-TV-Z]{16}$
          example: 7QK3M9XD7QK3M9XD
          x-one-time-secret:
            withheld_flag: secret_withheld
        secret_withheld:
          type: boolean
          description: True on a replay of the same Idempotency-Key, where the invitation code is withheld because it is never stored (ADR-0003 Note N1 R1); use reissueLinkInvitation for a new one. Absent on the first response. The contract harness compares a replay with every field except invitation_code and this flag.
          example: true
    AcceptLink:
      type: object
      description: Accept a link with its invitation code. The code is used up at acceptance; the acceptor
        is told its own details will be shown to the proposer.
      required:
      - invitation_code
      properties:
        invitation_code:
          type: string
          description: The invitation code.
          pattern: ^[0-9A-HJKMNP-TV-Z]{16}$
          example: 7QK3M9XD7QK3M9XD
        outlet_ids:
          type: array
          description: The caller's outlets placed in the link.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
    ConfirmLink:
      type: object
      description: Confirm who accepted. The id must be the one shown to the proposer, so a swap between
        viewing and confirming is refused.
      required:
      - counterparty_organisation_id
      properties:
        counterparty_organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
    LinkReason:
      type: object
      description: Reason for a decline, suspension or revocation (kept in link activity without payload
        data).
      required:
      - reason
      properties:
        reason:
          type: string
          description: Short reason.
          minLength: 3
          maxLength: 200
          example: contract ended
    LinkAmendmentInput:
      type: object
      description: Add a scope or raise a limit; both parties must accept.
      required:
      - id
      - add_grants
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        add_grants:
          type: array
          description: Grants to add.
          items:
            $ref: '#/components/schemas/GrantInput'
          minItems: 1
          maxItems: 20
    LinkAmendment:
      type: object
      description: An amendment awaiting the other party.
      required:
      - id
      - link_id
      - add_grants
      - status
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        link_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        add_grants:
          type: array
          description: Grants to add.
          items:
            $ref: '#/components/schemas/GrantInput'
        status:
          type: string
          description: Amendment state.
          enum:
          - pending
          - accepted
          - declined
          example: pending
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
    DecideAmendment:
      type: object
      description: Accept or decline an amendment.
      required:
      - decision
      properties:
        decision:
          type: string
          description: Decision.
          enum:
          - accept
          - decline
          example: accept
    LinkActivity:
      type: object
      description: One state change or cross-link call. No payload.
      required:
      - id
      - link_id
      - occurred_at
      - side
      - action
      - outcome
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        link_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        occurred_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        side:
          type: string
          description: Which party acted.
          enum:
          - proposer
          - acceptor
          - system
          example: proposer
        action:
          type: string
          description: Stable action key.
          example: link.confirmed
        scope:
          $ref: '#/components/schemas/LinkScope'
        object_ref:
          type: string
          description: Opaque object reference.
          example: posting_01
        outcome:
          type: string
          description: Result.
          enum:
          - succeeded
          - refused
          example: succeeded
    LinkActivityPage:
      type: object
      description: A page of link activity, readable by both parties, append-only.
      required:
      - items
      properties:
        items:
          type: array
          description: Entries on this page.
          items:
            $ref: '#/components/schemas/LinkActivity'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
    LinkDecision:
      type: object
      description: Decision for go-auth, cacheable for at most 30 seconds and dropped on tenancy.link.*
        events.
      required:
      - allowed
      - cache_seconds
      properties:
        allowed:
          type: boolean
          description: Whether the link is active and the grantee holds the scope.
          example: true
        reason:
          type: string
          description: Why not, when refused.
          enum:
          - link_not_active
          - scope_not_granted
          - outlet_not_granted
          - limit_exceeded
          example: link_not_active
        data_owner_organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_ids:
          type: array
          description: Outlets the grant allows.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
        cache_seconds:
          type: integer
          description: Maximum cache time.
          minimum: 0
          maximum: 30
          example: 30
    DirectoryOrganisation:
      type: object
      description: Directory view of an organisation (closed). Holds no member, device, phone or email
        data.
      required:
      - id
      - name
      - status
      - outlet_count
      - created_at
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Display name.
          example: Example Hospitality
        status:
          $ref: '#/components/schemas/OrganisationStatus'
        outlet_count:
          type: integer
          description: Number of outlets.
          minimum: 0
          example: 1
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      additionalProperties: false
    DirectoryPage:
      type: object
      description: A page of the directory, newest first.
      required:
      - items
      properties:
        items:
          type: array
          description: Organisations on this page.
          items:
            $ref: '#/components/schemas/DirectoryOrganisation'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when there are no more results.
      additionalProperties: false
    DirectoryBrand:
      type: object
      description: Brand in the directory.
      required:
      - id
      - name
      - is_default
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Brand name.
          example: Example Hospitality
        is_default:
          type: boolean
          description: Default brand marker.
          example: true
      additionalProperties: false
    DirectoryOutlet:
      type: object
      description: 'Outlet in the directory: name, kind, state only.'
      required:
      - id
      - name
      - kind
      - state_code
      - status
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Outlet name.
          example: Main Restaurant
        kind:
          $ref: '#/components/schemas/OutletKind'
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        status:
          $ref: '#/components/schemas/OutletStatus'
      additionalProperties: false
    DirectoryRegistration:
      type: object
      description: 'Registration in the directory: legal name, GSTIN, regime, verification.'
      required:
      - id
      - legal_name
      - regime
      - state_code
      - verification_state
      - status
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        legal_name:
          type: string
          description: Legal name.
          example: Example Hospitality Pvt Ltd
        regime:
          $ref: '#/components/schemas/TaxRegime'
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        verification_state:
          type: string
          description: Verification state.
          enum:
          - unverified
          - verified
          - rejected
          example: unverified
        status:
          type: string
          description: Registration state.
          enum:
          - open
          - closed
          example: open
      additionalProperties: false
    OrganisationDetail:
      type: object
      description: 'Directory detail: structure only. No members, devices or settings.'
      required:
      - organisation
      - brands
      - outlets
      - registrations
      properties:
        organisation:
          $ref: '#/components/schemas/DirectoryOrganisation'
        brands:
          type: array
          description: Brands.
          items:
            $ref: '#/components/schemas/DirectoryBrand'
        outlets:
          type: array
          description: Outlets.
          items:
            $ref: '#/components/schemas/DirectoryOutlet'
        registrations:
          type: array
          description: Registrations.
          items:
            $ref: '#/components/schemas/DirectoryRegistration'
      additionalProperties: false
    NewOutlet:
      type: object
      description: The first outlet.
      required:
      - name
      - kind
      - state_code
      properties:
        name:
          type: string
          description: Outlet name.
          minLength: 1
          maxLength: 120
          example: Main Restaurant
        kind:
          $ref: '#/components/schemas/OutletKind'
        state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
    NewRegistration:
      type: object
      description: The tax registration the outlet bills under. GSTIN required unless regime is unregistered,
        forbidden when it is.
      required:
      - legal_name
      - regime
      properties:
        legal_name:
          type: string
          description: Legal name.
          minLength: 1
          maxLength: 200
          example: Example Hospitality Pvt Ltd
        regime:
          $ref: '#/components/schemas/TaxRegime'
        gstin:
          $ref: ../../../common/components.yaml#/components/schemas/Gstin
    VerificationInput:
      type: object
      description: Verification recorded in the same submit; needs admin.registration.verify, otherwise
        the registration starts unverified.
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
        note:
          type: string
          description: Required when the method is other.
          maxLength: 500
          example: Certificate seen on the onboarding call.
    CreateOrganisation:
      type: object
      description: One request that creates the tenant, its default brand, the first outlet and one tax
        registration the outlet references. No plan, entitlement, subscription, series code or owner invitation.
      required:
      - name
      - outlet
      - tax_registration
      properties:
        name:
          type: string
          description: Organisation display name.
          minLength: 1
          maxLength: 120
          example: Example Hospitality
        outlet:
          $ref: '#/components/schemas/NewOutlet'
        tax_registration:
          $ref: '#/components/schemas/NewRegistration'
        verification:
          $ref: '#/components/schemas/VerificationInput'
    OrganisationCreated:
      type: object
      description: The created records. Ids are server-issued UUIDv7; a tenant_id is never reused.
      required:
      - organisation
      - brand
      - outlet
      - tax_registration
      properties:
        organisation:
          $ref: '#/components/schemas/Organisation'
        brand:
          $ref: '#/components/schemas/Brand'
        outlet:
          $ref: '#/components/schemas/Outlet'
        tax_registration:
          $ref: '#/components/schemas/TaxRegistration'
    VerifyRegistration:
      type: object
      description: Mark a registration verified. A GSTIN has at most one verified holder.
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
        note:
          type: string
          description: Required when the method is other.
          maxLength: 500
          example: Certificate seen on the onboarding call.
    RejectRegistration:
      type: object
      description: Reject a registration. The reason is the record for the auditor.
      required:
      - reason
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
    ChangeOutletTaxRegistration:
      type: object
      description: Move an outlet to another registration of the same organisation. The reason is the record for the auditor.
      required:
      - tax_registration_id
      - reason
      properties:
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
          description: The target registration.
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
    CloseRegistration:
      type: object
      description: Close a registration and its series. The reason is the record for the auditor.
      required:
      - reason
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
    PlanVersionState:
      type: string
      description: draft is editable; active is immutable and sellable; retired stays on existing subscriptions (BR-A1-10,
        BR-A1-15).
      enum:
      - draft
      - active
      - retired
      example: draft
    Cycle:
      type: string
      description: Billing cycle; none is the pilot.
      enum:
      - none
      - monthly
      - annual
      example: monthly
    PlanPrice:
      type: object
      description: A list price for one cycle, in paise excluding GST.
      properties:
        cycle:
          $ref: '#/components/schemas/Cycle'
        list_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
      required:
      - cycle
      - list_price
    PlanVersionDraft:
      type: object
      description: Content of a plan version. Plans, versions, prices and feature keys are data, never code (BR-A1-11).
      properties:
        feature_keys:
          type: array
          description: Feature keys granted; an app ignores a key it does not know.
          items:
            type: string
            description: Feature key, lower_snake with dots.
            pattern: ^[a-z][a-z0-9_.]{1,48}$
            example: restaurant.core
          maxItems: 40
        included_outlets:
          type: integer
          description: Outlets included; the only metered quantity (BR-A1-13).
          minimum: 0
          example: 1
        prices:
          type: array
          description: List price per cycle.
          items:
            $ref: '#/components/schemas/PlanPrice'
          maxItems: 3
      required:
      - feature_keys
      - included_outlets
      - prices
    PlanVersion:
      allOf:
      - $ref: '#/components/schemas/PlanVersionDraft'
      - type: object
        description: A numbered version with its state.
        properties:
          version:
            type: integer
            description: Version number within the plan, from 1.
            minimum: 1
            example: 1
          state:
            $ref: '#/components/schemas/PlanVersionState'
          created_at:
            $ref: ../../../common/components.yaml#/components/schemas/Timestamp
          activated_at:
            $ref: ../../../common/components.yaml#/components/schemas/Timestamp
          retired_at:
            $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        required:
        - version
        - state
        - created_at
    Plan:
      type: object
      description: 'A plan: a key and its versions. Seeded drafts: pilot, table_service and an extra-outlet add-on become
        sellable only after the founder activates them (A1-Q1, A1-Q2).'
      properties:
        key:
          type: string
          description: Unique lower_snake key.
          pattern: ^[a-z][a-z0-9_]{1,31}$
          example: table_service
        name_key:
          type: string
          description: i18n key of the plan name.
          example: plan.table_service
        versions:
          type: array
          description: Versions, newest first.
          items:
            $ref: '#/components/schemas/PlanVersion'
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - key
      - name_key
      - versions
      - created_at
    PlanPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of Plan items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/Plan'
    CreatePlan:
      type: object
      description: A new plan with its first draft version.
      properties:
        key:
          type: string
          description: Unique lower_snake key.
          pattern: ^[a-z][a-z0-9_]{1,31}$
          example: table_service
        name_key:
          type: string
          description: i18n key of the plan name.
          example: plan.table_service
        version:
          $ref: '#/components/schemas/PlanVersionDraft'
      required:
      - key
      - name_key
      - version
    BillingConfiguration:
      type: object
      description: 'Hostry''s own GST configuration for charges, versioned and effective-dated (BR-A1-30). Hostry''s
        GST invoices are issued from the founder''s books; this only drives the GST shown on a charge. x-provisional:
        SAC and registration facts are CA-pending (A1-Q3).'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        effective_from:
          type: string
          description: First date the configuration applies to charges raised.
          format: date
          example: '2026-11-24'
        hostry_state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        sac:
          type: string
          description: SAC code; seeded 997331 as a placeholder until the CA answers.
          pattern: ^[0-9]{4,8}$
          example: '997331'
        gst_rate_bp:
          type: integer
          description: GST rate in basis points (default 1800).
          minimum: 0
          maximum: 2800
          example: 1800
        gst_registered:
          type: boolean
          description: When false no GST is added to a charge.
        payment_tolerance_paise:
          type: integer
          description: A charge counts as paid within this many paise of the total (default 99).
          minimum: 0
          example: 99
        payment_terms_days:
          type: integer
          description: Days from the first charge to its due date (default 7).
          minimum: 0
          example: 7
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - effective_from
      - hostry_state_code
      - sac
      - gst_rate_bp
      - gst_registered
      - payment_tolerance_paise
      - payment_terms_days
      - created_at
    BillingConfigurationPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of BillingConfiguration items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/BillingConfiguration'
    CreateBillingConfiguration:
      type: object
      description: A new configuration version.
      properties:
        effective_from:
          type: string
          description: First date the configuration applies to charges raised.
          format: date
          example: '2026-11-24'
        hostry_state_code:
          $ref: ../../../common/components.yaml#/components/schemas/StateCode
        sac:
          type: string
          description: SAC code; seeded 997331 as a placeholder until the CA answers.
          pattern: ^[0-9]{4,8}$
          example: '997331'
        gst_rate_bp:
          type: integer
          description: GST rate in basis points (default 1800).
          minimum: 0
          maximum: 2800
          example: 1800
        gst_registered:
          type: boolean
          description: When false no GST is added to a charge.
        payment_tolerance_paise:
          type: integer
          description: A charge counts as paid within this many paise of the total (default 99).
          minimum: 0
          example: 99
        payment_terms_days:
          type: integer
          description: Days from the first charge to its due date (default 7).
          minimum: 0
          example: 7
      required:
      - effective_from
      - hostry_state_code
      - sac
      - gst_rate_bp
      - gst_registered
      - payment_tolerance_paise
      - payment_terms_days
    Addon:
      type: object
      description: An add-on line, for example an extra outlet.
      properties:
        name:
          type: string
          description: Add-on key.
          pattern: ^[a-z][a-z0-9_]{1,31}$
          example: extra_outlet
        quantity:
          type: integer
          description: Quantity.
          minimum: 1
          example: 1
        agreed_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
      required:
      - name
      - quantity
      - agreed_price
    SubscriptionState:
      type: string
      description: 'Stored state: pilot, active or cancelled. overdue is derived and shown separately (BR-A1-26).'
      enum:
      - pilot
      - active
      - cancelled
      example: active
    Subscription:
      type: object
      description: A subscription row. One is current per organisation; earlier rows are history. The ledger holds no
        personal data (BR-A1-27).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        plan_key:
          type: string
          description: Plan key.
          example: table_service
        plan_version:
          type: integer
          description: Plan version.
          minimum: 1
          example: 1
        cycle:
          $ref: '#/components/schemas/Cycle'
        agreed_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        addons:
          type: array
          description: Add-on lines.
          items:
            $ref: '#/components/schemas/Addon'
        start_date:
          type: string
          description: Start date.
          format: date
          example: '2026-11-24'
        paid_through:
          type: string
          description: Paid-through date; for a pilot the review date.
          format: date
          example: '2026-11-24'
        state:
          $ref: '#/components/schemas/SubscriptionState'
        overdue:
          type: boolean
          description: 'Derived: an open charge past its due date.'
        cancel_at_period_end:
          type: boolean
          description: Cancellation requested; no charge after paid_through.
        outlets_over_limit:
          type: boolean
          description: Soft limit notice in Phase 2 (A1-Q9).
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        superseded_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - organisation_id
      - plan_key
      - plan_version
      - cycle
      - agreed_price
      - addons
      - start_date
      - state
      - overdue
      - cancel_at_period_end
      - created_at
    SubscriptionHistory:
      type: object
      description: The current subscription and the earlier rows.
      properties:
        current:
          $ref: '#/components/schemas/Subscription'
        history:
          type: array
          description: Earlier rows, newest first.
          items:
            $ref: '#/components/schemas/Subscription'
      required:
      - history
    StartSubscription:
      type: object
      description: Assign a plan version or a pilot. Below-list price needs admin.subscription.adjust and a reason;
        a pilot has no charge and a review date (default 90 days).
      properties:
        plan_key:
          type: string
          description: Plan key.
          example: table_service
        plan_version:
          type: integer
          description: Active version to assign.
          minimum: 1
          example: 1
        cycle:
          $ref: '#/components/schemas/Cycle'
        start_date:
          type: string
          description: Start date.
          format: date
          example: '2026-11-24'
        agreed_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        addons:
          type: array
          description: Add-on lines.
          items:
            $ref: '#/components/schemas/Addon'
        review_date:
          type: string
          description: Pilot review date.
          format: date
          example: '2026-11-24'
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
      required:
      - plan_key
      - plan_version
      - cycle
      - start_date
    ChangeSubscription:
      type: object
      description: A plan or price change; takes effect from the next charge as a new row, no proration (BR-A1-23).
      properties:
        plan_key:
          type: string
          description: Plan key.
          example: table_service
        plan_version:
          type: integer
          description: Active version.
          minimum: 1
          example: 1
        cycle:
          $ref: '#/components/schemas/Cycle'
        effective_from:
          type: string
          description: First day of the next charge period.
          format: date
          example: '2026-11-24'
        agreed_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        addons:
          type: array
          description: Add-on lines.
          items:
            $ref: '#/components/schemas/Addon'
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
      required:
      - plan_key
      - plan_version
      - cycle
      - effective_from
    CancelSubscription:
      type: object
      description: Record the owner's cancellation request.
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
    ChargeStatus:
      type: string
      description: open, paid (derived from payments within tolerance), waived or cancelled (reversing rows).
      enum:
      - open
      - paid
      - waived
      - cancelled
      example: open
    InvoiceReference:
      type: object
      description: Number and date of the invoice raised in the founder's books; set once, never edited; the panel does
        not check it (BR-A1-34).
      properties:
        number:
          type: string
          description: Invoice number as in the books.
          pattern: ^[A-Za-z0-9][A-Za-z0-9/._-]{0,39}$
          example: HQ/2627/0042
        date:
          type: string
          description: Invoice date.
          format: date
          example: '2026-11-24'
      required:
      - number
      - date
    Charge:
      type: object
      description: A charge, append-only (BR-A1-31). GST comes from the billing configuration at the moment it is raised
        and is stored here; there is no round-off and no invoice rendering.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        subscription_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        kind:
          type: string
          description: period or extra (an extra charge carries a reason).
          enum:
          - period
          - extra
          example: period
        period_start:
          type: string
          description: First day covered.
          format: date
          example: '2026-11-24'
        period_end:
          type: string
          description: Last day covered.
          format: date
          example: '2026-11-24'
        taxable:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        cgst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        sgst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        igst:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        total:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        due_date:
          type: string
          description: Due date (BR-A1-33).
          format: date
          example: '2026-11-24'
        invoice_reference:
          $ref: '#/components/schemas/InvoiceReference'
        status:
          $ref: '#/components/schemas/ChargeStatus'
        outstanding:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        note:
          type: string
          description: Free-text note for staff, at most 200 characters, no personal data.
          maxLength: 200
        reason:
          type: string
          description: Reason for an extra, waived or cancelled charge.
          maxLength: 500
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - organisation_id
      - subscription_id
      - kind
      - period_start
      - period_end
      - taxable
      - cgst
      - sgst
      - igst
      - total
      - due_date
      - status
      - outstanding
      - created_at
    ChargePage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of Charge items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/Charge'
    RaiseCharge:
      type: object
      description: Raise a charge for the next period, or an extra charge.
      properties:
        kind:
          type: string
          description: period or extra.
          enum:
          - period
          - extra
          example: period
        period_start:
          type: string
          description: First day covered.
          format: date
          example: '2026-11-24'
        period_end:
          type: string
          description: Last day covered.
          format: date
          example: '2026-11-24'
        taxable:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        note:
          type: string
          description: Staff note.
          maxLength: 200
      required:
      - kind
      - period_start
      - period_end
    SetInvoiceReference:
      type: object
      description: The invoice reference from the books.
      properties:
        invoice_reference:
          $ref: '#/components/schemas/InvoiceReference'
      required:
      - invoice_reference
    ReasonBody:
      type: object
      description: A reason for an adjustment.
      properties:
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
      required:
      - reason
    PaymentMethod:
      type: string
      description: Payment method; gateway_link is reserved and not available in A1.
      enum:
      - upi
      - bank_transfer
      - cash
      - cheque
      example: upi
    LedgerPayment:
      type: object
      description: A recorded payment, append-only and idempotent by key (BR-A1-43). A correction is a reversing row.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        charge_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        amount:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        method:
          $ref: '#/components/schemas/PaymentMethod'
        reference:
          type: string
          description: UTR or cheque number, up to 40 characters.
          maxLength: 40
          example: UTR1234567890
        received_on:
          type: string
          description: Date received, not in the future.
          format: date
          example: '2026-11-24'
        recorded_by:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        reversal_of:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        reason:
          type: string
          description: Reason, for a reversing row.
          maxLength: 500
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - charge_id
      - amount
      - method
      - received_on
      - recorded_by
      - created_at
    LedgerPaymentPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of LedgerPayment items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/LedgerPayment'
    RecordPayment:
      type: object
      description: Record a payment by hand. A payment above the outstanding amount is refused 422 overpayment.
      properties:
        amount:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        method:
          $ref: '#/components/schemas/PaymentMethod'
        reference:
          type: string
          description: UTR or cheque number.
          maxLength: 40
          example: UTR1234567890
        received_on:
          type: string
          description: Date received.
          format: date
          example: '2026-11-24'
      required:
      - amount
      - method
      - received_on
    LedgerListKind:
      type: string
      description: Work lists for staff; nothing is sent automatically (BR-A1-50).
      enum:
      - overdue_charges
      - charges_to_raise
      - charges_without_invoice_reference
      - pilots_ending
      - retired_version_subscriptions
      - outlets_over_limit
      example: overdue_charges
    LedgerListRow:
      type: object
      description: One row of a work list.
      properties:
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        organisation_name:
          type: string
          description: Organisation name from the directory.
          example: Example Hospitality
        subject_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        due_date:
          type: string
          description: Due date or review date.
          format: date
          example: '2026-11-24'
        age_days:
          type: integer
          description: Days past due, for the overdue list; buckets 1-7, 8-15, 16-30, over 30 are derived by the client.
          minimum: 0
          example: 3
        amount:
          $ref: ../../../common/components.yaml#/components/schemas/Money
      required:
      - organisation_id
      - organisation_name
    LedgerListRowPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of LedgerListRow items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/LedgerListRow'
    LifecycleRequest:
      type: object
      description: Execution of an approved lifecycle action. The grant header carries the approval; the subject hash
        covers the organisation and the target status.
      properties:
        ticket:
          $ref: ../../../common/components.yaml#/components/schemas/TicketReference
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
        owner_export_offered:
          type: boolean
          description: 'Close only: recorded confirmation that the owner was offered an export (BR-A1-72).'
      required:
      - ticket
      - reason
    LifecycleResult:
      type: object
      description: The organisation after the action.
      properties:
        organisation_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        status:
          $ref: '#/components/schemas/OrganisationStatus'
        changed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - organisation_id
      - status
      - changed_at
    MyPlan:
      type: object
      description: 'The owner''s read-only "My plan" screen (Could, BR-A1-90): the caller''s own organisation only.'
      properties:
        plan_key:
          type: string
          description: Plan key.
          example: table_service
        plan_name_key:
          type: string
          description: i18n key of the plan name.
          example: plan.table_service
        plan_version:
          type: integer
          description: Version.
          minimum: 1
          example: 1
        cycle:
          $ref: '#/components/schemas/Cycle'
        agreed_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        start_date:
          type: string
          description: Start date.
          format: date
          example: '2026-11-24'
        paid_through:
          type: string
          description: Paid-through date or pilot review date.
          format: date
          example: '2026-11-24'
        state:
          $ref: '#/components/schemas/SubscriptionState'
        overdue:
          type: boolean
          description: Shown to the owner as a label only; it gates nothing (ADR-0008 S5).
        charges:
          type: array
          description: Charges, newest first.
          items:
            type: object
            description: A charge as the owner sees it.
            properties:
              period_start:
                type: string
                description: First day covered.
                format: date
                example: '2026-11-24'
              period_end:
                type: string
                description: Last day covered.
                format: date
                example: '2026-11-24'
              total:
                $ref: ../../../common/components.yaml#/components/schemas/Money
              due_date:
                type: string
                description: Due date.
                format: date
                example: '2026-11-24'
              invoice_number:
                type: string
                description: Invoice number when set.
                example: HQ/2627/0042
              status:
                $ref: '#/components/schemas/ChargeStatus'
            required:
            - period_start
            - period_end
            - total
            - due_date
            - status
        payments:
          type: array
          description: Payments, newest first.
          items:
            type: object
            description: A payment as the owner sees it.
            properties:
              received_on:
                type: string
                description: Date received.
                format: date
                example: '2026-11-24'
              amount:
                $ref: ../../../common/components.yaml#/components/schemas/Money
              method:
                $ref: '#/components/schemas/PaymentMethod'
            required:
            - received_on
            - amount
            - method
      required:
      - plan_key
      - plan_name_key
      - plan_version
      - cycle
      - agreed_price
      - start_date
      - state
      - overdue
      - charges
      - payments
    ManualBookSeries:
      type: object
      description: 'A paper bill book registered as an entry-only series of kind manual_book (ADR-0014 A1.6 item 4).
        Billing devices of the outlet receive it entry-only: numbers are typed, never allocated. One supply has one
        invoice number, so Hostry never gives a book page a second number. x-provisional: whether a paper book may run
        as a parallel series under the same GSTIN is a CA question (P2B-6).'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: The book's own prefix, unique per GSTIN together with the device-series codes.
          pattern: ^[A-Z0-9]{1,6}$
          example: BKB
        outlet_ids:
          type: array
          description: Outlets whose billing devices may enter from this book.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
          maxItems: 50
        status:
          type: string
          description: active or closed.
          enum:
          - active
          - closed
          example: active
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - tax_registration_id
      - code
      - outlet_ids
      - status
      - created_at
    ManualBookSeriesPage:
      allOf:
      - $ref: ../../../common/components.yaml#/components/schemas/PageCursor
      - type: object
        description: A page of ManualBookSeries items.
        required:
        - items
        properties:
          items:
            type: array
            description: Items, in the order stated by the operation.
            items:
              $ref: '#/components/schemas/ManualBookSeries'
    RegisterManualBook:
      type: object
      description: Register a bill book.
      properties:
        tax_registration_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: The book's prefix.
          pattern: ^[A-Z0-9]{1,6}$
          example: BKB
        outlet_ids:
          type: array
          description: Outlets that may enter from it.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
          maxItems: 50
      required:
      - tax_registration_id
      - code
      - outlet_ids
  responses:
    GstinInUse:
      description: A verified holder of this GSTIN already exists. Only vendor operations may say so;
        a tenant-realm request gets the same response as any new registration.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            gstin:
              value:
                type: urn:hostry:problem:gstin_in_use
                title: GSTIN already registered to another organisation
                status: 409
                code: gstin_in_use
    RegistrationValidation:
      description: Invalid input; nothing is created.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            gstin:
              value:
                type: urn:hostry:problem:validation
                title: Validation failed
                status: 422
                code: validation
                errors:
                - field: tax_registration.gstin
                  code: gstin_state_mismatch
                  message: state code does not match the outlet state
    RegistrationUnverified:
      description: The registration is not verified, so no series is issued. The device may still register
        without billing.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            unver:
              value:
                type: urn:hostry:problem:registration_unverified
                title: Tax registration not verified
                status: 409
                code: registration_unverified
    SeriesCapReached:
      description: At most 200 codes per registration per IST day (and an alert at 75 percent of the code
        space).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            cap:
              value:
                type: urn:hostry:problem:series_cap_reached
                title: Daily series cap reached
                status: 429
                code: series_cap_reached
    LinkConflict:
      description: The link is not in a state that allows this, or the invitation code is used, expired
        or unknown (one answer for all of these).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            state:
              value:
                type: urn:hostry:problem:link_state_conflict
                title: The link is not in a state that allows this
                status: 409
                code: link_state_conflict
            code:
              value:
                type: urn:hostry:problem:invitation_code_invalid
                title: Invitation code invalid
                status: 409
                code: invitation_code_invalid
    StepUpRequired:
      description: The operation needs a strong session with a fresh OTP (auth_time within 10 minutes);
        a pin session never qualifies.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            step:
              value:
                type: urn:hostry:problem:step_up_required
                title: A fresh sign-in is required
                status: 403
                code: step_up_required
    ApprovalRequired:
      description: Blocked while the binding is under caution or needs an approval token (ADR-0005 A2.2).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          examples:
            approval:
              value:
                type: urn:hostry:problem:approval_required
                title: Approval required
                status: 403
                code: approval_required
    OpenTradingDay:
      description: An outlet has a business day in progress (open, dated today or yesterday IST); suspension and closure
        are refused at request and again at execution (ADR-0014 A1.2). The approval stays approved and a fresh grant
        may be issued until the request lapses.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:open_trading_day
            title: Trading day in progress
            status: 409
            code: open_trading_day
    GrantRefused:
      description: Grant missing (grant.required), malformed or not for this operation (grant.invalid, for signature, kid, typ, realm, aud, kind, organisation or approver), expired (grant.expired), for another subject (grant.subject_mismatch) or used (grant.used).
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:grant.used
            title: Approval grant refused
            status: 403
            code: grant.used
    Overpayment:
      description: The panel keeps no unapplied credit in A1.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:overpayment
            title: Payment exceeds outstanding
            status: 422
            code: overpayment
    StrongSessionRequired:
      description: The permission is strong_only and the session is a pin or device session.
      content:
        application/problem+json:
          schema:
            $ref: ../../../common/components.yaml#/components/schemas/Problem
          example:
            type: urn:hostry:problem:strong_session_required
            title: Strong session required
            status: 403
            code: strong_session_required
