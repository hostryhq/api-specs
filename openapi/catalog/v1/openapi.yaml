components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 tenant-realm access token issued by identity (ADR-0005). One tenant per token. Support
        tokens are accepted only together with the admin service token.
    vendorBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 vendor-realm access token. Refused by every tenant-facing operation.
    serviceAuth:
      type: apiKey
      in: header
      name: Hostry-Service-Token
      description: 60-second ES256 service token (ADR-0005 section 9). Operations under /internal/v1 accept it only
        from the callers in x-service-callers.
  schemas:
    TaxClass:
      type: string
      description: 'Item tax class key chosen from the classes the published tax rule set defines (never a rate).
        Phase 2 classes: fnb_standard, fnb_non_gst, exempt.'
      pattern: ^[a-z][a-z0-9_]{1,31}$
      example: fnb_standard
    VegMark:
      type: string
      description: Veg mark shown on the order screen and printed on nothing.
      enum:
      - veg
      - non_veg
      - egg
      - none
      example: veg
    CatalogStatus:
      type: string
      description: active is orderable, hidden is kept but not shown on the order screen, archived is a tombstone
        (kept in history and reports, RM-M7).
      enum:
      - active
      - hidden
      - archived
      example: active
    Category:
      type: object
      description: A menu category (brand stream, lww). Archiving needs no active items (RM-M7).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        brand_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name_en:
          type: string
          description: English name (required).
          maxLength: 60
          example: Starters
        name_ta:
          type: string
          description: Tamil name, optional.
          maxLength: 60
          example: தொடக்கம்
        name_ml:
          type: string
          description: Malayalam name, optional.
          maxLength: 60
          example: സ്റ്റാർട്ടറുകൾ
        default_station_code:
          type: string
          description: Station code new items inherit; resolved per outlet through Station.code.
          maxLength: 20
          example: KITCHEN
        default_tax_class:
          $ref: '#/components/schemas/TaxClass'
        sort_order:
          type: integer
          description: Display order.
          minimum: 0
          example: 10
        status:
          $ref: '#/components/schemas/CatalogStatus'
      required:
      - id
      - brand_id
      - name_en
      - default_tax_class
      - sort_order
      - status
    ItemVariant:
      type: object
      description: A named price point of an item; exactly one variant per item is the default (RM-M3).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        item_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Variant name, for example Half or Full.
          maxLength: 40
          example: Full
        price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        is_default:
          type: boolean
          description: Whether this variant is preselected.
        sort_order:
          type: integer
          description: Display order.
          minimum: 0
          example: 1
      required:
      - id
      - item_id
      - name
      - price
      - is_default
      - sort_order
    Item:
      type: object
      description: A menu item with its variants. An item with variants has no price of its own; a priced item without
        variants has one default variant named after the item (RM-M2, RM-M3).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        brand_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        category_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name_en:
          type: string
          description: English name (required).
          maxLength: 80
          example: Paneer Tikka
        name_ta:
          type: string
          description: Tamil name, optional.
          maxLength: 80
          example: பனீர் டிக்கா
        name_ml:
          type: string
          description: Malayalam name, optional.
          maxLength: 80
          example: പനീർ ടിക്ക
        kitchen_name:
          type: string
          description: Kitchen short name, at most 20 characters; defaults to the name.
          maxLength: 20
          example: Paneer Tikka
        station_code:
          type: string
          description: Station code override; empty means the category default.
          maxLength: 20
          example: KITCHEN
        veg_mark:
          $ref: '#/components/schemas/VegMark'
        tax_class:
          $ref: '#/components/schemas/TaxClass'
        code:
          type: string
          description: Item code, digits, unique per brand; optional.
          pattern: ^[0-9]{1,8}$
          example: '101'
        status:
          $ref: '#/components/schemas/CatalogStatus'
        sort_order:
          type: integer
          description: Display order.
          minimum: 0
          example: 1
        variants:
          type: array
          description: Variants, default first.
          items:
            $ref: '#/components/schemas/ItemVariant'
        modifier_group_ids:
          type: array
          description: Modifier groups offered on this item, in display order.
          items:
            $ref: ../../../common/components.yaml#/components/schemas/Id
      required:
      - id
      - brand_id
      - category_id
      - name_en
      - kitchen_name
      - veg_mark
      - tax_class
      - status
      - sort_order
      - variants
      - modifier_group_ids
    Modifier:
      type: object
      description: A modifier option. The price delta may be negative; the line total never goes below zero. Modifier
        prices are taxed with the line (RM-M3).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Option name.
          maxLength: 40
          example: Extra cheese
        price_delta:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        sort_order:
          type: integer
          description: Display order.
          minimum: 0
          example: 1
      required:
      - id
      - name
      - price_delta
      - sort_order
    ModifierGroup:
      type: object
      description: A modifier group with selection bounds.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Group name.
          maxLength: 40
          example: Add-ons
        min_select:
          type: integer
          description: Minimum options a line must carry.
          minimum: 0
          example: 0
        max_select:
          type: integer
          description: Maximum options a line may carry.
          minimum: 1
          example: 2
        modifiers:
          type: array
          description: Options.
          items:
            $ref: '#/components/schemas/Modifier'
      required:
      - id
      - name
      - min_select
      - max_select
      - modifiers
    ItemOutlet:
      type: object
      description: 'Per-outlet overlay of an item: availability (sold out), optional outlet price and station (outlet
        stream, lww; the outlet price is lww + review).'
      properties:
        item_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        available:
          type: boolean
          description: False while sold out; resets at the start of the next business date by default (RM-M8).
        outlet_price:
          $ref: ../../../common/components.yaml#/components/schemas/Money
        station_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        quick_item:
          type: boolean
          description: One of the outlet's up to 12 quick items (RM-M10).
      required:
      - item_id
      - outlet_id
      - available
      - quick_item
    Station:
      type: object
      description: A kitchen or bar station (RM-K1).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        code:
          type: string
          description: Short code, unique per outlet; DEFAULT is seeded.
          maxLength: 20
          example: KITCHEN
        name:
          type: string
          description: Station name.
          maxLength: 30
          example: Kitchen
        output:
          type: string
          description: Where tickets go.
          enum:
          - printer
          - kds
          - both
          example: both
        printer_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        language:
          type: string
          description: Language of printed tickets.
          enum:
          - en
          - ta
          - ml
          example: ta
      required:
      - id
      - outlet_id
      - code
      - name
      - output
      - language
    Floor:
      type: object
      description: A section of the floor (RM-F1).
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Section name.
          maxLength: 30
          example: Ground floor
        sort_order:
          type: integer
          description: Display order.
          minimum: 0
          example: 1
      required:
      - id
      - outlet_id
      - name
      - sort_order
    DiningTable:
      type: object
      description: A table (RM-F1). Its status is derived from open seatings and never stored.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        floor_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Table name, at most 8 characters.
          maxLength: 8
          example: T1
        seats:
          type: integer
          description: Seats, 1 to 50.
          minimum: 1
          maximum: 50
          example: 4
        active:
          type: boolean
          description: Inactive tables are hidden; a table with an open seating cannot be deactivated.
      required:
      - id
      - outlet_id
      - floor_id
      - name
      - seats
      - active
    Printer:
      type: object
      description: 'A printer and how it is reached (ADR-0014 R8): lan (address and port) or device (USB, Bluetooth
        or spooler on that device).'
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        name:
          type: string
          description: Printer name.
          maxLength: 30
          example: Kitchen LAN
        connection:
          type: string
          description: lan or device:<device id> style reach.
          enum:
          - lan
          - device
          example: lan
        address:
          type: string
          description: IPv4 address, for lan printers.
          maxLength: 45
          example: 192.0.2.50
        port:
          type: integer
          description: TCP port, for lan printers (normally 9100).
          minimum: 1
          maximum: 65535
          example: 9100
        host_device_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        paper_width_mm:
          type: integer
          description: Paper width, 58 or 80.
          minimum: 58
          maximum: 80
          example: 80
        chars_per_line:
          type: integer
          description: Characters per line at the printer's default font.
          minimum: 20
          maximum: 80
          example: 48
        code_page:
          type: string
          description: ESC/POS code page name.
          maxLength: 20
          example: cp437
        cut:
          type: boolean
          description: Whether the printer cuts after a ticket.
        drawer_pin:
          type: integer
          description: Cash-drawer pin, 0 for none.
          minimum: 0
          maximum: 2
          example: 0
        raster:
          type: boolean
          description: Whether raster images (Tamil and Malayalam) are supported.
        power_backup:
          type: string
          description: Printed fallback depends on this; recorded at set-up (RM-U5).
          enum:
          - none
          - ups
          - inverter
          example: none
      required:
      - id
      - outlet_id
      - name
      - connection
      - paper_width_mm
      - chars_per_line
      - code_page
      - cut
      - drawer_pin
      - raster
      - power_backup
    ReasonCode:
      type: object
      description: An outlet or brand reason code for cancels, discounts, comps, internal closures, refunds, credit
        notes and changes after a pre-bill.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        purpose:
          type: string
          description: What the code may be used for.
          enum:
          - cancel
          - discount
          - comp
          - internal
          - refund
          - credit_note
          - present_change
          - cash_move
          example: cancel
        label_key:
          type: string
          description: i18n key of the label (seeded) or a literal label the owner typed.
          maxLength: 60
          example: reason.cancel.guest_changed_mind
        active:
          type: boolean
          description: Whether the code is offered.
      required:
      - id
      - purpose
      - label_key
      - active
    Menu:
      type: object
      description: The whole sellable menu of a brand with the outlet overlay, for a first load or a refresh by
        a client that is not syncing (read-only; devices normally get this by sync).
      properties:
        brand_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        outlet_id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        generated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        categories:
          type: array
          description: Categories, in order.
          items:
            $ref: '#/components/schemas/Category'
        items:
          type: array
          description: Items with variants.
          items:
            $ref: '#/components/schemas/Item'
        modifier_groups:
          type: array
          description: Modifier groups referenced by items.
          items:
            $ref: '#/components/schemas/ModifierGroup'
        availability:
          type: array
          description: Outlet overlay rows.
          items:
            $ref: '#/components/schemas/ItemOutlet'
      required:
      - brand_id
      - outlet_id
      - generated_at
      - categories
      - items
      - modifier_groups
      - availability
    SetTaxClass:
      type: object
      description: A tax-class change; the class must exist in the rule set in force.
      properties:
        tax_class:
          $ref: '#/components/schemas/TaxClass'
        reason:
          $ref: ../../../common/components.yaml#/components/schemas/Reason
      required:
      - tax_class
      - reason
    TaxClassChange:
      type: object
      description: Result of a tax-class change; the op was emitted to every device of the brand.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        tax_class:
          $ref: '#/components/schemas/TaxClass'
        updated_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        op_id:
          type: string
          description: Identity of the emitted op, cloud-<epoch>/stream/seq.
          example: cloud-1/brand:0190a1b2/412
      required:
      - id
      - tax_class
      - updated_at
      - op_id
    CreateMenuImport:
      type: object
      description: A CSV menu, previewed and validated; nothing is written until commit.
      properties:
        filename:
          type: string
          description: Original file name, for the audit line.
          maxLength: 100
          example: menu.csv
        csv_text:
          type: string
          description: UTF-8 CSV with columns category, item name, item code, variant name, price (rupees, up to
            two decimals), veg mark, station; up to 2,000 rows.
          maxLength: 400000
          example: 'category,item name,item code,variant name,price,veg mark,station

            Starters,Paneer Tikka,101,Full,240.00,veg,Kitchen

            '
      required:
      - filename
      - csv_text
    ImportRowError:
      type: object
      description: A row-level error; a preview with any error cannot be committed (all rows or none, RM-M9).
      properties:
        row:
          type: integer
          description: 1-based data row number (header excluded).
          minimum: 1
          example: 7
        field:
          type: string
          description: CSV column name.
          example: price
        code:
          type: string
          description: Stable error code.
          example: price_invalid
      required:
      - row
      - field
      - code
    MenuImport:
      type: object
      description: A menu import job (server-only data, ADR-0014 R3). Re-import matches by item code and counts
        as a price edit.
      properties:
        id:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        status:
          type: string
          description: 'previewed: valid or with errors, awaiting commit; committed: ops emitted; cancelled: abandoned.'
          enum:
          - previewed
          - committed
          - cancelled
          example: previewed
        source:
          type: string
          description: 'owner: the owner''s own strong session; support_session: Hostry staff under an owner-consented
            act-mode session (A1 BR-A1-86 to 89).'
          enum:
          - owner
          - support_session
          example: owner
        filename:
          type: string
          description: Original file name.
          example: menu.csv
        row_count:
          type: integer
          description: Data rows read.
          minimum: 0
          example: 1
        error_count:
          type: integer
          description: Rows with an error.
          minimum: 0
          example: 0
        errors:
          type: array
          description: Row-level errors, at most 100 returned.
          items:
            $ref: '#/components/schemas/ImportRowError'
          maxItems: 100
        categories_created:
          type: integer
          description: Categories the commit would create or did create.
          minimum: 0
          example: 1
        items_created:
          type: integer
          description: Items created.
          minimum: 0
          example: 1
        items_updated:
          type: integer
          description: Items matched by code and updated.
          minimum: 0
          example: 0
        price_changes:
          type: integer
          description: Price edits among the updates (each is a price edit, RM-M4).
          minimum: 0
          example: 0
        created_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
        committed_at:
          $ref: ../../../common/components.yaml#/components/schemas/Timestamp
      required:
      - id
      - status
      - source
      - filename
      - row_count
      - error_count
      - errors
      - categories_created
      - items_created
      - items_updated
      - price_changes
      - created_at
    CommitMenuImport:
      type: object
      description: 'Commit guard: the row count the preview showed.'
      properties:
        row_count:
          type: integer
          description: Must equal the preview's row_count; guards against committing a different file.
          minimum: 1
          example: 1
      required:
      - row_count
