                  category_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
                  name_en: Paneer Tikka
                  kitchen_name: Paneer Tikka
                  station_code: KITCHEN
                  veg_mark: veg
                  tax_class: fnb_standard
                  code: '101'
                  status: active
                  sort_order: 1
                  variants:
                  - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5111
                    item_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                    name: Full
                    price:
                      amount_paise: 24000
                      currency: INR
                    is_default: true
                    sort_order: 1
                  modifier_group_ids:
                  - 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5121
                modifier_groups:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5121
                  name: Add-ons
                  min_select: 0
                  max_select: 2
                  modifiers:
                  - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5122
                    name: Extra cheese
                    price_delta:
                      amount_paise: 2000
                      currency: INR
                    sort_order: 1
                availability:
                - item_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  available: true
                  quick_item: true
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
