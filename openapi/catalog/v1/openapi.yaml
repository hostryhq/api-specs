        in: path
        required: true
        description: Item id.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                category_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
                name_en: Paneer Tikka
                kitchen_name: Paneer Tikka
                station_code: KITCHEN
                veg_mark: veg
                tax_class: fnb_standard
                code: '101'
                status: active
                sort_order: 1
                variants:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5111
                  item_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                  name: Full
                  price:
                    amount_paise: 24000
                    currency: INR
                  is_default: true
                  sort_order: 1
                modifier_group_ids:
                - 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5121
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
  /v1/items/{item_id}/tax-class:
    put:
      operationId: setItemTaxClass
      summary: Set an item's tax class
      description: strong_only (RM-M5); same rules as setCategoryTaxClass. Lines already on any bill keep the class
        they were added with (RM-M6).
      tags:
      - catalog
      x-permission: menu.tax_class.edit
      x-step-up: true
      parameters:
      - name: item_id
        in: path
        required: true
        description: Item id.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaxClass'
            example:
              tax_class: fnb_non_gst
              reason: Alcohol items are outside GST.
      responses:
        '200':
          description: The change.
          content:
