                  brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                  category_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
                  name_en: Paneer Tikka
                  kitchen_name: Paneer Tikka
                  station_code: KITCHEN
                  veg_mark: veg
                  tax_class: fnb_standard
                  code: '101'
                  status: active
                  sort_order: 1
                  variants:
                  - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5111
                    item_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                    name: Full
                    price:
                      amount_paise: 24000
                      currency: INR
                    is_default: true
                    sort_order: 1
                  modifier_group_ids:
                  - 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5121
                next_cursor: eyJhZnRlciI6IjAxOTBhMWIyIn0
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/items/{item_id}:
