openapi: 3.1.0
info:
  title: Hostry catalog API
  version: 1.0.0
  description: 'What an outlet sells and how it is set up: categories, items, variants, modifiers, prices, item
    tax class, stations, floors, tables, printers and reason codes (ADR-0014 R1, R3), as projected from the sync
    stream into catalog''s own database, plus the menu import and the two strong-session tax-class edits. Every
    master is written on devices as sync ops (intents of class config); this API never writes a synced row directly:
    the online-only operations (tax class, menu import) call the gateway emit API with a self-contained op (ADR-0014
    R1). The tenant is always the caller''s organisation from the token; outlet-scoped reads take X-Outlet-Id. Item
    prices are brand-wide (brand stream) with an optional outlet price on item_outlet. A later product (bakery counter,
    stall) reads the same API. Entity fields, owners and conflict policies are in entities/restaurant/.'
  x-status: stable
  x-example-worlds:
    base: Brand 4a6a with outlet 4a61 (restaurant, state 33). Category 5001 (Starters, default_tax_class fnb_standard),
      item 5101 (Paneer Tikka, code 101, variant 5111 Full at 24000, modifier group 5121 with modifier 5122), station
      5131 (KITCHEN) with printer 5141 (LAN), floor 5151, table 5152 (T1), reason code 5161, item_outlet for 5101
      available and a quick item. No menu import job and no exceptions. The caller is the owner Asha in a strong
      online session.
    import-previewed: Base plus menu import job 5171 (owner source, file menu.csv, one valid row, no errors) in
      status previewed.
    price-conflict: Base plus an open exception 5181 (price_conflict, price_entry 5191, kept 25000, lost 24000)
      detected 13:05:11.
servers:
- url: /
tags:
- name: catalog
  description: Menu and outlet set-up reads, tax-class edits.
- name: menu-import
  description: CSV menu import (strong session, or a support act-mode session).
security:
- bearerAuth: []
paths:
  /v1/categories:
    get:
      operationId: listCategories
      summary: List categories
      tags:
      - catalog
      x-permission: menu.read
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          type: string
          enum:
          - active
          - hidden
          - archived
        example: active
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page of categories ordered by sort order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
                  brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                  name_en: Starters
                  default_station_code: KITCHEN
                  default_tax_class: fnb_standard
                  sort_order: 10
                  status: active
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/categories/{category_id}/tax-class:
    put:
      operationId: setCategoryTaxClass
      summary: Set a category's default tax class
      description: 'strong_only: refused in pin and device sessions with 403 strong_session_required (RM-M5); online
        only; audited. Existing items keep their own class. Emits one config op to the brand stream.'
      tags:
      - catalog
      x-permission: menu.tax_class.edit
      x-step-up: true
      parameters:
      - name: category_id
        in: path
        required: true
        description: Category id.
        schema:
          $ref: ../../../common/components.yaml#/components/schemas/Id
        example: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaxClass'
            example:
              tax_class: fnb_non_gst
              reason: Alcohol items are outside GST.
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxClassChange'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5001
                tax_class: fnb_non_gst
                updated_at: '2026-11-24T13:05:11.120Z'
                op_id: cloud-1/brand:0190a1b2/412
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StrongSessionRequired'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/dining-tables:
    get:
      operationId: listDiningTables
      summary: List tables
      tags:
      - catalog
      x-permission: settings.read
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page, outlet-scoped by X-Outlet-Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiningTablePage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5152
                  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  floor_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5151
                  name: T1
                  seats: 4
                  active: true
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
  /v1/exceptions:
    get:
      operationId: listCatalogExceptions
      summary: List catalog exceptions (concurrent price edits to confirm)
      description: 'Detector findings derived from the projection: price_conflict (concurrent lww+review edits;
        the winner applies and the loser is kept, RM-M4), config_changed_shared_device (price or menu change recorded
        in a pin session). Resolving is an op from a device (conflict.confirm), never a call here.'
      tags:
      - catalog
      x-permission: exceptions.view
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          type: string
          enum:
          - open
          - resolved
          - superseded
        example: open
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5181
                  kind: price_conflict
                  severity: warning
                  status: open
                  subject_kind: price_entry
                  subject_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5191
                  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  detected_at: '2026-11-24T13:05:11.120Z'
                  detail_key: exception.price_conflict
                  params:
                    kept_paise: 25000
                    lost_paise: 24000
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
      x-example-world: price-conflict
  /v1/floors:
    get:
      operationId: listFloors
      summary: List floors
      tags:
      - catalog
      x-permission: settings.read
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page, outlet-scoped by X-Outlet-Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5151
                  outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
                  name: Ground floor
                  sort_order: 1
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../../common/components.yaml#/components/responses/Forbidden
  /v1/item-availability:
    get:
      operationId: listItemAvailability
      summary: List the outlet overlay (sold out, outlet price, quick items)
      tags:
      - catalog
      x-permission: menu.read
      x-outlet-scoped: true
