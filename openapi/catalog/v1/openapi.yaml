              schema:
                $ref: '#/components/schemas/TaxClassChange'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5101
                tax_class: fnb_non_gst
                updated_at: '2026-11-24T13:05:11.120Z'
                op_id: cloud-1/brand:0190a1b2/412
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StrongSessionRequired'
        '404':
          $ref: ../../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
  /v1/menu:
    get:
      operationId: getMenu
      summary: Get the whole menu with the outlet overlay
      description: Read-only snapshot of the brand menu (categories, items, variants, modifier groups) with the
        outlet's availability and prices; archived rows are excluded. Devices normally receive the same data by
        sync; this serves owner mode, later products and tests.
      tags:
      - catalog
      x-permission: menu.read
      x-outlet-scoped: true
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/OutletScope
      responses:
        '200':
          description: The menu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
              example:
                brand_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a6a
                outlet_id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61
