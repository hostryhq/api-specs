  /v1/menu-imports:
    post:
      operationId: createMenuImport
      summary: Upload a CSV menu and preview it
      description: strong_only (x-step-up). A support act-mode session may also call it, through catalog.import,
        once security-reviewer has signed the flag and IST-43 passes (ADR-0005 A2.5 item 5, A1 BR-A1-89); until
        then act mode answers mode_not_supported at identity. Validates every row, returns the preview, writes nothing.
        Max 2,000 rows.
      tags:
      - menu-import
      x-permission: menu.import
      x-step-up: true
      x-permission-widened-by: catalog.import
      x-provisional: Act-mode access stays off until security-reviewer signs catalog.import.
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuImport'
            example:
              filename: menu.csv
              csv_text: 'category,item name,item code,variant name,price,veg mark,station

                Starters,Paneer Tikka,101,Full,240.00,veg,Kitchen

                '
      responses:
        '201':
          description: The preview job. A replay returns the same job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuImport'
              example:
                id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5171
                status: previewed
                source: owner
                filename: menu.csv
                row_count: 1
                error_count: 0
                errors: []
                categories_created: 1
                items_created: 1
                items_updated: 0
                price_changes: 0
                created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StrongSessionRequired'
        '409':
          $ref: ../../../common/components.yaml#/components/responses/Conflict
        '422':
          $ref: ../../../common/components.yaml#/components/responses/ValidationFailed
        '429':
          $ref: ../../../common/components.yaml#/components/responses/TooManyRequests
    get:
      operationId: listMenuImports
      summary: List menu import jobs
      tags:
      - menu-import
      x-permission: menu.import
      x-step-up: true
      x-permission-widened-by: catalog.import
      parameters:
      - $ref: ../../../common/components.yaml#/components/parameters/Cursor
      - $ref: ../../../common/components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: A page, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuImportPage'
              example:
                items:
                - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f5171
                  status: previewed
                  source: owner
                  filename: menu.csv
                  row_count: 1
                  error_count: 0
                  errors: []
                  categories_created: 1
                  items_created: 1
                  items_updated: 0
                  price_changes: 0
                  created_at: '2026-11-24T13:05:11.120Z'
        '401':
          $ref: ../../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: '#/components/responses/StrongSessionRequired'
      x-example-world: import-previewed
  /v1/menu-imports/{import_id}:
    get:
      operationId: getMenuImport
      summary: Get an import job with its row errors
      tags:
      - menu-import
      x-permission: menu.import
      x-step-up: true
      x-permission-widened-by: catalog.import
      parameters:
      - name: import_id
        in: path
        required: true
