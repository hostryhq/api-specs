# Shared example world: platform domain (identity, tenancy, admin). ADR-0003, ADR-0005, ADR-0013.
# Every id, GSTIN, series code, member and device that appears in a spec example, event example or entity file of the
# platform services is declared here once. `make lint-worlds` (cmd/validate-worlds) fails an example that uses an id
# nobody declared, a GSTIN with a wrong check character, a series code outside the registry alphabet, an id whose kind
# does not fit the field it sits in, or an entity whose facts (name, code, GSTIN ...) differ between two examples.
# Ids are written as the 4 trailing hex digits; the full id is `id_prefix` + digits (UUIDv7).
world: platform
id_prefix: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f
series_alphabet: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
entries:
