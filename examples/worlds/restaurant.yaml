# Shared example world: restaurant domain (catalog, orders, billing and the sync intents/entities they own).
# Same rules and tooling as platform.yaml (`make lint-worlds`). The organisation, outlet, registration, series, members and
# devices are the platform world's: org 4a60, outlet 4a61, registration 4a6b, series A7K (4a6c) and A7M (4a95), device 4a5e,
# members Asha 4a64 (owner and cashier) and Ravi 4a9e. A restaurant example never names a vendor user as a member.
# `derive` states how a deterministic row id (entity file `id.rule: uuidv5`) is built; the validator recomputes it with the
# namespace 9a3c7f1e-5b2d-5c84-a1e6-4d0f8b27c3a9 and fails on a mismatch.
world: restaurant
id_prefix: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f
uuid_namespace: 9a3c7f1e-5b2d-5c84-a1e6-4d0f8b27c3a9
# Fixed facts every document of the restaurant worlds agrees on.
constants:
  business_date: '2026-11-24'
  bill_number: A7K/2627/000123
  credit_note_number: A7M/2627/000004
  z_number: Z/2026-11-24/P1
  tax_vector_count: 65
entries:
# ---- catalog ------------------------------------------------------------------------------------------------------
- {name: category_starters, id: '5001', kind: category, facts: {name: Starters}}
- {name: item_paneer_tikka, id: '5101', kind: item, facts: {code: '101', name: Paneer Tikka}}
